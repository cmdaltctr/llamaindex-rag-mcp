sonar.organization=cmdaltctr
sonar.projectKey=cmdaltctr_llamaindex-rag-mcp

# Project metadata
sonar.projectName=llamaindex-rag-mcp
sonar.projectVersion=1.8.0

# Source directories
sonar.sources=src
sonar.tests=tests

# Python-specific
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml

# Exclusions — generated/vendored files
sonar.exclusions=\
  **/.opencode/**,\
  **/chroma_db/**,\
  **/experiments/**,\
  **/.venv/**,\
  **/__pycache__/**,\
  **/uv.lock

# Test exclusions from coverage
sonar.coverage.exclusions=\
  tests/**,\
  **/__init__.py,\
  src/rag_mcp/cli.py

# Monorepo structure
sonar.python.pylint.reportPath=pylint-report.txt
