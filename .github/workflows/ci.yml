name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff

      - name: Install dependencies
        run: uv sync --frozen --no-build

      - name: Run tests (fast)
        env:
          PDF_READER: pypdf
        run: uv run --no-sync --no-build pytest -m "not slow" --tb=short -q

      - name: Run tests (slow, liteparse on macOS)
        if: matrix.os == 'macos-latest'
        env:
          PDF_READER: liteparse
        run: uv run --no-sync --no-build pytest -m "slow" --tb=short -q || echo "Slow tests skipped (Ollama not available in CI)"

  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff

      - name: Install dependencies
        run: uv sync --frozen --no-build

      - name: Run tests with coverage
        run: uv run --no-sync --no-build pytest -m "not slow" --cov=rag_mcp --cov-report=xml

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
