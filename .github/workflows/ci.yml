name: CI

on:
  push:
    branches: [main, v3]
  pull_request:
    branches: [main, v3]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      # Pinned to SHA for security — actions/checkout@v7.0.0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up Python
        # Pinned to SHA for security — actions/setup-python@v6.3.0
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Install uv
        # Pinned to SHA for security — astral-sh/setup-uv@v8.2.0
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests (fast)
        env:
          PDF_READER: pypdf
          EMBED_PROVIDER: local
          LOCAL_BACKEND: ollama
          EMBED_MODEL: nomic-embed-text
          OLLAMA_BASE_URL: http://localhost:11434
          METADATA_LLM_PROVIDER: local
        run: uv run --no-sync pytest -m "not slow" --tb=short -q

      # Verify the default install stays torch-free (ADR-038).
      - name: Verify default install is torch-free
        run: |
          set -euo pipefail
          if ! packages="$(uv pip list)"; then
            echo "FAIL: unable to inspect default install" >&2
            exit 1
          fi
          if printf '%s\n' "$packages" | grep -qiE '^(torch|transformers)([[:space:]]|$)'; then
            echo "FAIL: torch or transformers found in default install"
            exit 1
          fi
          echo "OK: default install is torch-free"

      # Phase 2 (config/compose/DI layering): import-linter contracts must
      # pass — settings models stay pure data, providers are constructed
      # only in compose.py, and core business modules avoid providers.
      - name: Run import-linter contracts
        run: uv run --no-sync lint-imports

      # Phase 5: validate the OpenAPI 3.1 contract on every push.
      - name: Validate OpenAPI contract
        run: uv run --no-sync python -c "import yaml; from openapi_spec_validator import validate; validate(yaml.safe_load(open('src/rag_mcp/transports/api/openapi.yaml')))" && echo "OpenAPI contract valid"

      - name: Run tests (slow, liteparse on macOS)
        if: matrix.os == 'macos-latest'
        env:
          PDF_READER: liteparse
        run: uv run --no-sync pytest -m "slow" --tb=short -q || echo "Slow tests skipped (Ollama not available in CI)"

  # ── Floor-resolution CI job (ADR-042) ────────────────────────────────
  # Installs at the declared lower bounds (--resolution lowest-direct) and
  # runs the fast test suite. This converts the floors in pyproject.toml
  # from a comment into a tested contract. Without it they rot again on
  # the next upgrade cycle. See raise-dependency-floors OpenSpec change.
  #
  # Matrix covers the base install plus every non-torch extra, because
  # `uv sync` does not install optional dependencies unless an extra is
  # selected — without the matrix the floors in [project.optional-dependencies]
  # would never be exercised at their lower bounds. The torch extra is
  # excluded here because it has its own dedicated job below (ADR-038) and
  # must never enter the default install path.
  floors:
    name: Floor resolution${{ matrix.extra && format(' ({0})', matrix.extra) || '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        extra:
          - "" # base install, no extras
          - hybrid
          - pdf-pypdfium2
          - azure
          - llamacpp
          - openrouter
    steps:
      # Pinned to SHA for security — actions/checkout@v7.0.0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Set up Python
        # Pinned to SHA for security — actions/setup-python@v6.3.0
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Install uv
        # Pinned to SHA for security — astral-sh/setup-uv@v8.2.0
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39

      - name: Install dependencies at declared floors
        run: uv sync --resolution lowest-direct${{ matrix.extra && format(' --extra {0}', matrix.extra) || '' }}

      - name: Run tests (fast) at floors
        env:
          PDF_READER: pypdf
          EMBED_PROVIDER: local
          LOCAL_BACKEND: ollama
          EMBED_MODEL: nomic-embed-text
          OLLAMA_BASE_URL: http://localhost:11434
          METADATA_LLM_PROVIDER: local
        run: uv run --no-sync pytest -m "not slow" --tb=short -q

  # ── Torch-extra CI job (ADR-038, task 11.5) ───────────────────────────
  # The torch backend is opt-in. Without this dedicated job it would never
  # be exercised — the slow job has no schedule and suppresses failures
  # with || echo. This job installs the torch extra and runs the
  # torch-backend and cross-backend contract tests without suppression.
  torch-extra:
    name: Torch backend tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Pinned to SHA for security — actions/checkout@v7.0.0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Set up Python
        # Pinned to SHA for security — actions/setup-python@v6.3.0
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Install uv
        # Pinned to SHA for security — astral-sh/setup-uv@v8.2.0
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39

      - name: Install dependencies with torch extra
        run: uv sync --extra torch

      - name: Run torch-backend and cross-backend contract tests
        env:
          PDF_READER: pypdf
          EMBED_PROVIDER: local
          LOCAL_BACKEND: ollama
          EMBED_MODEL: nomic-embed-text
          OLLAMA_BASE_URL: http://localhost:11434
          METADATA_LLM_PROVIDER: local
        run: uv run --no-sync pytest -m "slow" -k "torch or backend_contract" --cov=rag_mcp --cov-branch --cov-report=xml --tb=short -v

      - name: Upload torch coverage to Codecov
        # Pinned to SHA for security — codecov/codecov-action@v7.0.0
        uses: codecov/codecov-action@e53489f4d376d79066609109e7a95a29eb3740b1
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Pinned to SHA for security — actions/checkout@v7.0.0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Set up Python
        # Pinned to SHA for security — actions/setup-python@v6.3.0
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Install uv
        # Pinned to SHA for security — astral-sh/setup-uv@v8.2.0
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff check
        run: uv run --no-sync ruff check .

      - name: Ruff format check
        run: uv run --no-sync ruff format --check .

  codecov:
    name: Coverage (Codecov)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Pinned to SHA for security — actions/checkout@v7.0.0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up Python
        # Pinned to SHA for security — actions/setup-python@v6.3.0
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Install uv
        # Pinned to SHA for security — astral-sh/setup-uv@v8.2.0
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests with coverage
        env:
          PDF_READER: pypdf
          EMBED_PROVIDER: local
          LOCAL_BACKEND: ollama
          EMBED_MODEL: nomic-embed-text
          OLLAMA_BASE_URL: http://localhost:11434
          METADATA_LLM_PROVIDER: local
        run: uv run --no-sync pytest -m "not slow" --cov=rag_mcp --cov-branch --cov-report=xml --junitxml=junit.xml -o junit_family=legacy

      - name: Upload coverage to Codecov
        # Pinned to SHA for security — codecov/codecov-action@v7.0.0
        uses: codecov/codecov-action@e53489f4d376d79066609109e7a95a29eb3740b1
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        # Pinned to SHA for security — codecov/test-results-action@v1
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
