name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      # Pinned to SHA for security — actions/checkout@v7.0.0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up Python
        # Pinned to SHA for security — actions/setup-python@v6.3.0
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Install uv
        # Pinned to SHA for security — astral-sh/setup-uv@v8.2.0
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39

      - name: Install dependencies
        run: uv sync --frozen --no-build

      - name: Run tests (fast)
        env:
          PDF_READER: pypdf
        run: uv run --no-sync --no-build pytest -m "not slow" --tb=short -q

      - name: Run tests (slow, liteparse on macOS)
        if: matrix.os == 'macos-latest'
        env:
          PDF_READER: liteparse
        run: uv run --no-sync --no-build pytest -m "slow" --tb=short -q || echo "Slow tests skipped (Ollama not available in CI)"

  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    steps:
      # Pinned to SHA for security — actions/checkout@v7.0.0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Set up Python
        # Pinned to SHA for security — actions/setup-python@v6.3.0
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Install uv
        # Pinned to SHA for security — astral-sh/setup-uv@v8.2.0
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39

      - name: Install dependencies
        run: uv sync --frozen --no-build

      - name: Run tests with coverage
        run: uv run --no-sync --no-build pytest -m "not slow" --cov=rag_mcp --cov-report=xml

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
