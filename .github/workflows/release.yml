name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.ref_name }}
      cancel-in-progress: false

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          # Full history is required for two reasons:
          #   1. python-semantic-release walks every commit since the last tag
          #      to compute the version bump (feat -> minor, fix -> patch).
          #   2. The "Force branch to workflow SHA" step below resets to
          #      github.sha, which is an ancestor of the tip when commits land
          #      while this run is queued. With the default fetch-depth: 1 that
          #      ancestor is absent and the reset fails with exit code 128.
          fetch-depth: 0

      - name: Force branch to workflow SHA
        run: git reset --hard ${{ github.sha }}

      # Release preparation gate (design: web assets ship in the wheel).
      # The web assets are gitignored build output, and Hatch ships them
      # only when they exist. Build the frontend and a wheel, then fail
      # before tagging or publishing if the wheel cannot serve the
      # workspace. The wheel goes to wheel-check/, not dist/, so the
      # published release assets stay unchanged.
      - name: Set up Node
        # Pinned to SHA for security — actions/setup-node@v7.0.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Install uv
        # Pinned to SHA for security — astral-sh/setup-uv@v8.2.0
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39

      - name: Build wheel and check web assets
        run: |
          set -euo pipefail
          uv build --wheel --out-dir wheel-check
          # The check uses the standard library only.
          python3 scripts/check_web_wheel.py wheel-check/*.whl
          rm -rf wheel-check
          echo "OK: wheel contains the web workspace assets"

      - name: Semantic Release
        id: release
        uses: python-semantic-release/python-semantic-release@v10.5.3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          git_committer_name: "github-actions"
          git_committer_email: "actions@users.noreply.github.com"
          build: "false"

      - name: Publish to GitHub Release
        uses: python-semantic-release/publish-action@v10.5.3
        if: steps.release.outputs.released == 'true'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.release.outputs.tag }}
