name: Release

on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.ref_name }}
      cancel-in-progress: false

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          # Full history is required for two reasons:
          #   1. python-semantic-release walks every commit since the last tag
          #      to compute the version bump (feat -> minor, fix -> patch).
          #   2. The "Force branch to workflow SHA" step below resets to
          #      github.sha, which is an ancestor of the tip when commits land
          #      while this run is queued. With the default fetch-depth: 1 that
          #      ancestor is absent and the reset fails with exit code 128.
          fetch-depth: 0

      - name: Force branch to workflow SHA
        run: git reset --hard ${{ github.sha }}

      - name: Semantic Release
        id: release
        uses: python-semantic-release/python-semantic-release@v10.5.3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          git_committer_name: "github-actions"
          git_committer_email: "actions@users.noreply.github.com"
          build: "false"

      - name: Publish to GitHub Release
        uses: python-semantic-release/publish-action@v10.5.3
        if: steps.release.outputs.released == 'true'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.release.outputs.tag }}
