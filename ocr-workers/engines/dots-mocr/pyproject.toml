# Isolated dots.mocr OCR engine (OpenSpec change modular-ocr-workers-dots-mocr,
# design D4). This project owns PyTorch and transformers; nothing here may
# enter OMRG's main environment, root lockfile, or import graph. Provision
# with `python3 ocr-workers/provision.py dots-mocr --accept-model-licence`,
# never with a bare `uv sync` from the repository root.
[project]
name = "omrg-ocr-dots-mocr"
version = "0.1.0"
description = "Isolated dots.mocr document-parsing engine for OMRG (primary OCR route)"
requires-python = ">=3.11,<3.14"
dependencies = [
    "omrg-ocr-worker-core",
    # The model runtime. The operator approved PyTorch for this isolated
    # environment on 2026-09-24; it stays out of the OMRG install.
    "torch>=2.7",
    "torchvision",
    # The version the pinned model code targets (Experiment 34).
    "transformers==4.57.6",
    "accelerate",
    "qwen-vl-utils",
    "huggingface-hub",
    # Page rendering.
    "pypdfium2",
    "pillow",
]

[project.scripts]
# Downloads the pinned revision, applies the patches and records hashes.
omrg-ocr-fetch = "omrg_ocr_dots_mocr.fetch:main"

[project.entry-points."omrg.ocr_engine"]
dots-mocr = "omrg_ocr_dots_mocr.engine:ENGINE"

[tool.uv.sources]
omrg-ocr-worker-core = { path = "../../core" }

[tool.omrg-ocr]
# The model licence adds terms beyond MIT. provision.py refuses this
# engine without --accept-model-licence and prints this file's path.
licence-file = "LICENCE-NOTES.md"
requires-acceptance = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omrg_ocr_dots_mocr"]
