# Isolated PaddleOCR-VL OCR engine: the fallback route (OpenSpec change
# modular-ocr-workers-dots-mocr; first built by improve-rag-input-quality-5,
# tasks 2.1/2.1a). This project owns every Paddle package; nothing here may
# enter OMRS's main environment, root lockfile, or import graph. Provision
# with `python3 ocr-workers/provision.py paddleocr-vl`, never with a bare
# `uv sync` from the repository root.
[project]
name = "omrs-ocr-paddleocr-vl"
version = "0.1.0"
description = "Isolated PaddleOCR-VL document-parsing engine for OMRS (fallback OCR route)"
requires-python = ">=3.11,<3.14"
dependencies = [
    # The shared protocol, framing loop and engine contract. It also
    # brings pypdf for page-subset writing (TDR-027).
    "omrs-ocr-worker-core",
    # Full PaddleOCR-VL document pipeline: layout, reading order,
    # recognition, and result assembly. paddleocr pulls paddlex
    # transitively, so paddlex is deliberately not declared here.
    "paddleocr[doc-parser]",
    # CPU PaddlePaddle runtime. Accelerator packages (for example GPU
    # variants) are not declared until a provisioned environment has
    # validated them.
    "paddlepaddle",
]

[project.entry-points."omrs.ocr_engine"]
paddleocr-vl = "omrs_ocr_paddleocr_vl.engine:ENGINE"

[tool.uv.sources]
omrs-ocr-worker-core = { path = "../../core" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omrs_ocr_paddleocr_vl"]
