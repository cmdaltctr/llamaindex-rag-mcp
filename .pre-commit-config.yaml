# Pre-commit hooks: Ruff (lint + format) and Gitleaks (secret scanning).
# Install commit hooks:  uv run pre-commit install
# Install push hooks:    uv run pre-commit install --hook-type pre-push
# Run all:               uv run pre-commit run --all-files
# Run push hooks:        uv run pre-commit run --hook-stage pre-push --all-files
# Update:                uv run pre-commit autoupdate
#
# The commit-stage Ruff hooks only see STAGED python files, so repo-wide
# format drift and non-python files (e.g. AGENTS.md) slip through. The
# pre-push stage below re-runs the whole-repo CI gates that catch that
# class of failure early, in ~12s. It deliberately excludes the full fast
# suite (~11 min) — that belongs in a manual pre-PR run, not an automatic
# push gate that would train everyone to use --no-verify.
repos:
  # Ruff uses local hooks so the pre-commit version matches the dev
  # dependency in pyproject.toml exactly. No version drift between the
  # editor, CLI, pre-commit, and CI.
  - repo: local
    hooks:
      # Pinned to the commit stage: these MUTATE files (ruff --fix / format),
      # which must never happen during a push. Without this key they would
      # default to all stages and rewrite files mid-push.
      - id: ruff-check
        name: ruff check (lint + auto-fix)
        entry: uv run ruff check --fix
        language: system
        types: [python]
        stages: [pre-commit]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
        stages: [pre-commit]

  # Gitleaks scans for hardcoded secrets (API keys, tokens, private keys).
  # Complements Ruff's S ruleset: Ruff flags dangerous code patterns,
  # Gitleaks finds literal secret strings by entropy and known formats.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        stages: [pre-commit]

  # Pre-push CI mirror: whole-repo gates that the commit-stage hooks cannot
  # catch. Ordered fastest-first so a break fails early. Runtime ~12s.
  - repo: local
    hooks:
      - id: ruff-check-all
        name: ruff check (whole repo, verify)
        entry: uv run ruff check .
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: ruff-format-check-all
        name: ruff format --check (whole repo)
        entry: uv run ruff format --check .
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: import-linter
        name: import-linter contracts
        entry: uv run lint-imports
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: structural-guards
        name: fast structural guard tests
        entry: uv run pytest tests/test_docs_references.py tests/test_file_size_ceiling.py tests/test_package_metadata.py tests/test_dependency_floors.py -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
