openapi: 3.1.0
info:
  title: OMRG local workspace API
  description: >
    HTTP contract of the optional local web runtime of OMRG (Opinionated
    Modular RAG). Start the runtime with `omrg web`. The routes map to the
    same core operations that the MCP and CLI transports call. Routes
    validate, delegate and format only.


    ## Error envelope

    Every error response uses the MCP error-dict shape:
    `{"status": "error", "message": "..."}`. `error_type` is optional.
    A graph or selector validation failure (422) adds `issues`. Messages
    never contain stack traces or credential values. An unknown `/v1` path
    gets this envelope with 404, never the application HTML.


    ## Request validation

    A request body or query value that does not match its schema gets 400
    with `error_type: validation`. A graph document or cleanup selector that
    is well formed but invalid gets 422 with the structured `issues`.


    ## Access

    The server binds to loopback only. Every request must carry a loopback
    `Host` header for the bound port (else 400). On `/v1` paths a foreign
    `Origin`, or `Sec-Fetch-Site: cross-site`/`same-site`, gets 403.
    Credentials in the query string get 400.


    Two credentials exist. The browser exchanges the one-time bootstrap
    secret from the launch URL fragment for an HttpOnly, SameSite=Strict
    session cookie (`POST /v1/session`). Notebook clients send a revocable
    per-launch bearer credential (`Authorization: Bearer omrg_bt_<id>.<secret>`).
    Each operation names its scope in `x-omrg-scopes`. An operation whose
    `security` lists only `sessionCookie` is session only: a bearer
    credential never passes, whatever scopes it holds. Cookie-authenticated
    `POST`, `PUT`, `PATCH` and `DELETE` requests must carry the application
    Origin. `GET /v1/health` and `POST /v1/session` are the only public
    operations (`security: []`).


    A bearer credential can be bound to one approved experiment context
    (`POST /v1/credentials` with `experiment_context`). A bound credential
    reaches only `/v1/session`, `/v1/pipeline-operations`,
    `/v1/pipeline-templates`, `/v1/pipelines` and `/v1/runs` (else 403).
    It runs graphs only in its own context, never on the live library, and
    it sees only its own context's runs.


    ## Jobs and graph runs

    Ingestion and codebase maps are document jobs: 202 with a `Job`, then
    poll `GET /v1/jobs/{jobId}` and page `GET /v1/jobs/{jobId}/events`. Graph runs are 202 with a `RunRecord`,
    then poll `GET /v1/runs/{run_id}`, page `GET /v1/runs/{run_id}/events`,
    or follow `GET /v1/runs/{run_id}/events/stream` (server-sent events with
    replay after `Last-Event-ID`). Both kinds share one persisted run
    service with one consumer and a bounded queue (429 when full). Work that
    was not finished when the server stopped is reported as `interrupted`
    (graph runs) or `failed` (jobs) at the next start. It is never repeated
    automatically.
  version: 2.0.0
  license:
    name: Apache-2.0

servers:
  - url: http://127.0.0.1:{port}/v1
    variables:
      port:
        default: "8765"
        description: >
          Loopback port chosen at launch (`omrg web --port`; a free port
          when omitted). The launch URL on stderr names it.

x-omrg-scope-catalogue:
  read:
    session_only: false
    description: Read collections, search, answer, jobs, pipelines, runs and events.
  graph:
    session_only: false
    description: Create pipelines, save layouts and revisions, validate graphs.
  run:
    session_only: false
    description: Submit, cancel and retry graph runs.
  files:
    session_only: true
    description: Approved roots, uploads, ingestion and codebase-map jobs.
  plugins:
    session_only: true
    description: Notebook plugin registration, compatibility checks and editor start/stop.
  credentials:
    session_only: true
    description: Issue, list and revoke bearer credentials.
  manage:
    session_only: true
    description: >
      Preview-bound destructive actions (deletion, profile change, cleanup)
      and experiment context approval and revocation.

paths:
  # ── Health and session (public bootstrap) ───────────────────────────
  /health:
    get:
      operationId: getHealth
      summary: Report liveness
      description: Public. Returns no workspace data.
      security: []
      x-omrg-scopes: []
      responses:
        "200":
          description: The server is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /session:
    post:
      operationId: createSession
      summary: Exchange the bootstrap secret for a session cookie
      description: >
        Public, but constrained. The request must carry the application
        Origin. The bootstrap secret works once. After 20 wrong guesses it
        stops working. Success sets the cookie `omrg_session_<port>`
        (HttpOnly, SameSite=Strict, Path=/).
      security: []
      x-omrg-scopes: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BootstrapRequest"
      responses:
        "200":
          description: Session created. The response sets the session cookie.
          headers:
            Set-Cookie:
              description: "`omrg_session_<port>=<value>; HttpOnly; SameSite=Strict; Path=/`"
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/BootstrapRejected"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      operationId: getSession
      summary: Describe the caller's credential and the workspace path
      security:
        - sessionCookie: [read]
        - bearerToken: [read]
      x-omrg-scopes: [read]
      responses:
        "200":
          description: Credential kind, scopes and workspace path.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInfo"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  # ── Bearer credentials (session only) ───────────────────────────────
  /credentials:
    post:
      operationId: issueCredential
      summary: Issue a bearer credential for a notebook client
      description: The token is shown once. Only its SHA-256 digest is kept.
      security:
        - sessionCookie: [credentials]
      x-omrg-scopes: [credentials]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialRequest"
      responses:
        "201":
          description: Credential issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuedCredential"
        "400":
          $ref: "#/components/responses/ExperimentRefused"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      operationId: listCredentials
      summary: List bearer credentials without their secrets
      security:
        - sessionCookie: [credentials]
      x-omrg-scopes: [credentials]
      responses:
        "200":
          description: Issued credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /credentials/{credential_id}:
    delete:
      operationId: revokeCredential
      summary: Revoke a bearer credential
      description: Revocation takes effect on the next request.
      security:
        - sessionCookie: [credentials]
      x-omrg-scopes: [credentials]
      parameters:
        - $ref: "#/components/parameters/CredentialId"
      responses:
        "200":
          description: Credential revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialRevoked"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # ── File grants and uploads (session only) ──────────────────────────
  /roots:
    get:
      operationId: listRoots
      summary: List the approved roots and the managed upload root
      description: >
        Roots come from `omrg web --root` and the workspace upload storage.
        Paths read from indexed metadata never add a root.
      security:
        - sessionCookie: [files]
      x-omrg-scopes: [files]
      responses:
        "200":
          description: Approved roots.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RootList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /uploads/preflight:
    post:
      operationId: preflightUpload
      summary: Check a file name, type and size before the upload
      description: >
        The name must be a plain file name. The extension must be an
        ingestible type. Archives fail with 415. A declared size over the
        limit (50 MiB by default) fails with 413.
      security:
        - sessionCookie: [files]
      x-omrg-scopes: [files]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadPreflightRequest"
      responses:
        "200":
          description: The upload can start.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadPreflightResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /uploads:
    post:
      operationId: uploadFile
      summary: Stream one file into managed storage
      description: >
        The body is the raw file. The percent-encoded file name travels in
        the `X-Upload-Name` header, so it stays out of the access log. The
        size limit is also enforced while the body streams. A failed or
        interrupted upload keeps no partial file. The response does not
        return the server path: ingest the upload by its managed-root path
        (`GET /v1/roots`, then `<upload id>/<name>`).
      security:
        - sessionCookie: [files]
      x-omrg-scopes: [files]
      parameters:
        - name: X-Upload-Name
          in: header
          required: true
          description: Percent-encoded plain file name.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: File stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadStored"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # ── Document jobs (session only) ────────────────────────────────────
  /ingestions:
    post:
      operationId: ingestPath
      summary: Queue ingestion of an approved file or directory
      description: >
        Indexes supported document formats into the collection. The path
        must be absolute and inside an approved root (else 403 before any
        work). Returns 202 with a job resource. Poll `GET /v1/jobs/{jobId}`.
      security:
        - sessionCookie: [files]
      x-omrg-scopes: [files]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestRequest"
      responses:
        "202":
          description: Ingestion job accepted and queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /codebase-maps:
    post:
      operationId: generateCodebaseMap
      summary: Queue a codebase map of an approved directory
      description: >
        Scans a project directory, builds code and document graphs, detects
        communities and hubs, and returns a text map in the job result
        (`{"map": "..."}`). The job passes the owning Engine's settings and
        store to the core map API. The path must be absolute and inside an
        approved root. Returns 202 with a job resource.
      security:
        - sessionCookie: [files]
      x-omrg-scopes: [files]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CodebaseMapRequest"
      responses:
        "202":
          description: Codebase map job accepted and queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /jobs/{jobId}:
    get:
      operationId: getJobStatus
      summary: Poll an ingestion or codebase-map job
      description: >
        Terminal states: `completed`, `failed`. A job that was queued or
        running when the server stopped reads `failed` after the next
        start. Graph runs and non-UUID ids get 404.
      security:
        - sessionCookie: [read]
        - bearerToken: [read]
      x-omrg-scopes: [read]
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Job status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /jobs/{jobId}/events:
    get:
      operationId: listJobEvents
      summary: Page committed events of an ingestion or codebase-map job
      description: >
        Returns the committed events of the run behind the job, with a
        sequence above `after_sequence`. Send the returned `last_sequence`
        as the next `after_sequence`. `complete` is true when the job is
        terminal and no later event exists. Same scope as
        `GET /v1/jobs/{jobId}`. Graph runs and non-UUID ids get 404.
      security:
        - sessionCookie: [read]
        - bearerToken: [read]
      x-omrg-scopes: [read]
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
        - name: after_sequence
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 500
      responses:
        "200":
          description: One page of job events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobEventPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # ── Collections and documents ───────────────────────────────────────
  /collections:
    get:
      operationId: listCollections
      summary: List all collections
      description: >
        Returns all collections with document and chunk counts and the
        stored profile name (or `null`).
      security:
        - sessionCookie: [read]
        - bearerToken: [read]
      x-omrg-scopes: [read]
      responses:
        "200":
          description: Collection list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CollectionInfo"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /collections/{collection}/documents:
    get:
      operationId: listDocuments
      summary: List indexed sources in a collection
      description: >
        Returns every source with its chunk count, stable source identity
        and machine-local orphan status. A missing collection gives an
        empty list.
      security:
        - sessionCookie: [read]
        - bearerToken: [read]
      x-omrg-scopes: [read]
      parameters:
        - $ref: "#/components/parameters/CollectionName"
      responses:
        "200":
          description: Document list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DocumentInfo"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      operationId: deleteDocuments
      summary: Preview, or confirm a previewed, deletion
      description: >
        Removes chunks by source path, by metadata filter, or drops the
        whole collection (no selector). Step 1: send `dry_run: true`. This
        mutates nothing and returns the affected count plus a single-use
        `confirmation`. Step 2: repeat the same selector with
        `confirmation_token`. The token is bound to the action, collection,
        selector and observed store validity token, and expires after 300
        seconds. No token gives 428. An unknown, used, expired, altered or
        stale token gives 409, and the data stays unchanged. Preview again.
      security:
        - sessionCookie: [manage]
      x-omrg-scopes: [manage]
      parameters:
        - $ref: "#/components/parameters/CollectionName"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteRequest"
      responses:
        "200":
          description: Deletion preview (dry run) or deletion result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /collections/{collection}/search:
    post:
      operationId: searchCollection
      summary: Search one collection
      description: >
        Returns the most relevant chunks with lineage, score and score kind.
        Omitted controls resolve from the collection profile. Diagnostics-only
        keys appear only with `diagnostics: true`.
      security:
        - sessionCookie: [read]
        - bearerToken: [read]
      x-omrg-scopes: [read]
      parameters:
        - $ref: "#/components/parameters/CollectionName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
      responses:
        "200":
          description: Search results.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SearchResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /collections/{collection}/answer:
    post:
      operationId: answerCollection
      summary: Answer a question from retrieved evidence with citations
      description: >
        Retrieves evidence through the same profile-resolved path as
        search, then synthesises a grounded answer. Citations are built
        deterministically from chunk lineage. Retrieval and generation
        failures come back inside the answer result (`failure_stage`), not
        as HTTP errors. When retrieval finds nothing the response carries
        the no_evidence shape.
      security:
        - sessionCookie: [read]
        - bearerToken: [read]
      x-omrg-scopes: [read]
      parameters:
        - $ref: "#/components/parameters/CollectionName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnswerRequest"
      responses:
        "200":
          description: Grounded answer result (including the no-evidence shape).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnswerResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /collections/{collection}/chunks/{chunk_id}:
    get:
      operationId: getChunk
      summary: Inspect one stored chunk and its neighbours
      description: >
        Reads the stored chunk by its stable `chunk_id`, with up to `window`
        neighbours per side from the same source version. It never opens
        the original file, so a citation stays inspectable when its source
        is outside the approved roots. Text is plain JSON text
        (`text_format: plain`). Render it as text, never as markup.
      security:
        - sessionCookie: [read]
        - bearerToken: [read]
      x-omrg-scopes: [read]
      parameters:
        - $ref: "#/components/parameters/CollectionName"
        - name: chunk_id
          in: path
          required: true
          schema:
            type: string
        - name: window
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 5
            default: 1
      responses:
        "200":
          description: The chunk and its neighbours.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChunkInspection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "501":
          $ref: "#/components/responses/NotImplemented"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /collections/{collection}/profile:
    patch:
      operationId: changeCollectionProfile
      summary: Preview, or confirm a previewed, profile change
      description: >
        Profiles control retrieval behaviour: `documents` (quality-first,
        reranker on, dense-only) or `codebase` (speed-first, reranker off,
        hybrid). The change does not re-chunk or re-embed existing chunks.
        Step 1: send `confirm: false` (the default). This returns a
        `ProfilePreview` with the lever impacts and a single-use
        `confirmation`. Step 2: send `confirm: true` with the same profile
        and `confirmation_token`. No token gives 428. A stale, altered or
        expired token gives 409. Preview again.
      security:
        - sessionCookie: [manage]
      x-omrg-scopes: [manage]
      parameters:
        - $ref: "#/components/parameters/CollectionName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileChangeRequest"
      responses:
        "200":
          description: >
            Preview (confirm=false) or the applied change (confirm=true).
            The `status` value tells the two apart.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ProfilePreview"
                  - $ref: "#/components/schemas/ProfileChangeResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # ── Graph catalogue, pipelines and revisions ────────────────────────
  /pipeline-operations:
    get:
      operationId: listPipelineOperations
      summary: List the graph operation catalogue with availability
      security:
        - sessionCookie: [read]
        - bearerToken: [read]
      x-omrg-scopes: [read]
      responses:
        "200":
          description: Every operation version, with availability and reasons.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationCatalogue"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /pipelines:
    post:
      operationId: createPipeline
      summary: Create a pipeline with a title and an optional layout
      description: No revision is created. The layout key `omrg_task` is reserved (400).
      security:
        - sessionCookie: [graph]
        - bearerToken: [graph]
      x-omrg-scopes: [graph]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePipelineRequest"
      responses:
        "201":
          description: Pipeline created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    get:
      operationId: listPipelines
      summary: List pipelines in creation order
      description: Reserved document-job pipelines are hidden.
      security:
        - sessionCookie: [read]
        - bearerToken: [read]
      x-omrg-scopes: [read]
      responses:
        "200":
          description: Pipelines.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /pipelines/validate:
    post:
      operationId: validatePipeline
      summary: Validate a graph without running it
      description: >
        Core validation decides what a valid graph is. Without `inputs` this
        is the draft check (`admitted: false`). With `inputs` it is the
        admission check that a run submission applies (`admitted: true`).
        No node, model call or write runs. An invalid graph gets 422 with
        every structured issue.
      security:
        - sessionCookie: [graph]
        - bearerToken: [graph]
      x-omrg-scopes: [graph]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidateRequest"
      responses:
        "200":
          description: The graph is valid.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/DraftValidation"
                  - $ref: "#/components/schemas/AdmissionValidation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /pipelines/{pipeline_id}:
    get:
      operationId: getPipeline
      summary: Return a pipeline and its current revision
      security:
        - sessionCookie: [read]
        - bearerToken: [read]
      x-omrg-scopes: [read]
      parameters:
        - $ref: "#/components/parameters/PipelineId"
      responses:
        "200":
          description: Pipeline with its current revision (or null).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /pipelines/{pipeline_id}/layout:
    put:
      operationId: savePipelineLayout
      summary: Replace the presentation layout
      description: >
        No revision is created. A document-job pipeline gives 409. The
        layout key `omrg_task` is reserved (400).
      security:
        - sessionCookie: [graph]
        - bearerToken: [graph]
      x-omrg-scopes: [graph]
      parameters:
        - $ref: "#/components/parameters/PipelineId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LayoutRequest"
      responses:
        "200":
          description: Layout saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /pipelines/{pipeline_id}/revisions:
    post:
      operationId: savePipelineRevision
      summary: Store an immutable revision and make it current
      description: >
        The document must parse as a supported graph document, either the
        graph itself or `{"graph", "layout"}` (only the graph is stored).
        Full checks run at validation and admission. A new revision gives
        201 (`created: true`). Identical content gives 200 with the existing
        revision (`created: false`).
      security:
        - sessionCookie: [graph]
        - bearerToken: [graph]
      x-omrg-scopes: [graph]
      parameters:
        - $ref: "#/components/parameters/PipelineId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevisionRequest"
      responses:
        "200":
          description: Identical content exists; that revision is returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevisionSaved"
        "201":
          description: New revision stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevisionSaved"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    get:
      operationId: listPipelineRevisions
      summary: List a pipeline's revisions by revision number
      security:
        - sessionCookie: [read]
        - bearerToken: [read]
      x-omrg-scopes: [read]
      parameters:
        - $ref: "#/components/parameters/PipelineId"
      responses:
        "200":
          description: Revisions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevisionList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /pipelines/{pipeline_id}/revisions/{revision_id}:
    get:
      operationId: getPipelineRevision
      summary: Return one revision of a pipeline
      security:
        - sessionCookie: [read]
        - bearerToken: [read]
      x-omrg-scopes: [read]
      parameters:
        - $ref: "#/components/parameters/PipelineId"
        - name: revision_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The revision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevisionEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # ── Graph runs ──────────────────────────────────────────────────────
  /runs:
    post:
      operationId: submitRun
      summary: Admit a saved revision with its inputs and queue a run
      description: >
        Admission runs at once with the inputs. An invalid graph or input
        gets 422 and no run record is written. A document-job revision or
        an unknown revision gives 404. Inputs that hold credentials give
        400. A full queue gives 429. Returns 202 with the queued run. Poll
        `GET /v1/runs/{run_id}` or follow its events. With
        `experiment_context` the run uses that approved context's Engine.
        The experiment admission guard refuses before any run record with
        403 and a stable `code`: `live_library_target` (an experiment
        credential without a context), `experiment_scope_mismatch`,
        `experiment_credential_required`, `experiment_context_unknown`,
        `experiment_context_revoked`, `action_not_permitted` or
        `commit_outside_context`.
      security:
        - sessionCookie: [run]
        - bearerToken: [run]
      x-omrg-scopes: [run]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitRunRequest"
      responses:
        "202":
          description: Run queued (status `queued`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ExperimentRefused"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    get:
      operationId: listRuns
      summary: List graph runs, newest first
      description: Document-job runs are hidden.
      security:
        - sessionCookie: [read]
        - bearerToken: [read]
      x-omrg-scopes: [read]
      parameters:
        - name: pipeline_id
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: Repeat the parameter to select several statuses.
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/RunStatus"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: Runs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /runs/{run_id}:
    get:
      operationId: getRun
      summary: Return one run record
      description: >
        The record holds the revision, redacted settings, state and failure.
        Statuses: queued, running, cancelling, succeeded, failed, cancelled,
        interrupted. A run that was not finished when the server stopped
        reads `interrupted` after the next start.
      security:
        - sessionCookie: [read]
        - bearerToken: [read]
      x-omrg-scopes: [read]
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: The run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /runs/{run_id}/result:
    get:
      operationId: getRunResult
      summary: Return the stored, redacted result of a finished run
      security:
        - sessionCookie: [read]
        - bearerToken: [read]
      x-omrg-scopes: [read]
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: The stored result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /runs/{run_id}/cancel:
    post:
      operationId: cancelRun
      summary: Cancel a queued run, or stop an active run at a safe boundary
      description: >
        A queued run becomes `cancelled`. An active run becomes `cancelling`
        and then `cancelled` at its next safe boundary. A terminal run is
        returned unchanged. Closing an event stream never cancels a run.
      security:
        - sessionCookie: [run]
        - bearerToken: [run]
      x-omrg-scopes: [run]
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: The run after the request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /runs/{run_id}/retry:
    post:
      operationId: retryRun
      summary: Repeat a failed, cancelled or interrupted run as a new run
      description: >
        The new run uses the stored revision and inputs with fresh
        admission, `origin: retry` and `source_run_id`. The source run does
        not change. Another status gives 409.
      security:
        - sessionCookie: [run]
        - bearerToken: [run]
      x-omrg-scopes: [run]
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "202":
          description: The new run is queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ExperimentRefused"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /runs/{run_id}/events:
    get:
      operationId: listRunEvents
      summary: Page committed run events (polling fallback)
      description: >
        Returns events with a sequence above `after_sequence`. Send the
        returned `last_sequence` as the next `after_sequence`. `complete`
        is true when the run is terminal and no later event exists.
      security:
        - sessionCookie: [read]
        - bearerToken: [read]
      x-omrg-scopes: [read]
      parameters:
        - $ref: "#/components/parameters/RunId"
        - name: after_sequence
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 500
      responses:
        "200":
          description: One page of events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunEventPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /runs/{run_id}/events/stream:
    get:
      operationId: streamRunEvents
      summary: Follow run events as server-sent events
      description: >
        The stream first sends `retry: 3000`. It then replays committed
        events after `Last-Event-ID` (or `after`; the header wins) and
        follows new ones. Each event frame has `id: <sequence>`,
        `event: <kind>` and `data: <RunEventRecord JSON>`. Use the `id` to
        drop duplicates after a reconnection. The stream ends with
        `event: run.end` when the run is terminal, or with
        `event: server.closing` when the server stops. A closed connection
        only detaches the stream: the run continues until an explicit
        cancel. The same access policy as run inspection applies.
      security:
        - sessionCookie: [read]
        - bearerToken: [read]
      x-omrg-scopes: [read]
      x-omrg-sse-events:
        "*": RunEventRecord
        run.end: StreamEnd
        server.closing: StreamClosing
      parameters:
        - $ref: "#/components/parameters/RunId"
        - name: after
          in: query
          required: false
          description: Replay events after this sequence. `Last-Event-ID` wins.
          schema:
            type:
              - integer
              - "null"
            minimum: 0
        - name: Last-Event-ID
          in: header
          required: false
          description: Sequence of the last event the client received.
          schema:
            type:
              - string
              - "null"
      responses:
        "200":
          description: Event stream.
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # ── Workspace cleanup (session only) ────────────────────────────────
  /workspace/cleanup/preview:
    post:
      operationId: previewWorkspaceCleanup
      summary: List the finished runs a cleanup would remove
      description: >
        Lists finished runs, their events and artefact files that match the
        selector, and returns a single-use token bound to this state.
        Vectors, sources, uploads, notebooks and experiment outputs are
        never in scope. Nothing changes.
      security:
        - sessionCookie: [manage]
      x-omrg-scopes: [manage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CleanupPreviewRequest"
      responses:
        "200":
          description: Cleanup preview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CleanupPreviewEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /workspace/cleanup:
    post:
      operationId: applyWorkspaceCleanup
      summary: Remove exactly what a valid preview listed
      description: >
        An unknown, expired, altered or stale token gives 409 and nothing
        is removed. Preview again.
      security:
        - sessionCookie: [manage]
      x-omrg-scopes: [manage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CleanupApplyRequest"
      responses:
        "200":
          description: Cleanup result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CleanupResultEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # ── Templates ───────────────────────────────────────────────────────
  /pipeline-templates:
    get:
      operationId: listPipelineTemplates
      summary: List the canonical ingestion, search and answer templates
      description: >
        Returns the templates shaped for the live Engine: the retrieval
        chain is hybrid when the collection settings enable it, and the
        rerank node starts bypassed when the Engine has no reranker. Save a
        template document as a revision before a run. The `search` output
        is a ContextBundle; a stored run result holds its public rows (the
        `Engine.search` row shape, from `ContextBundle.public_rows()`).
      security:
        - sessionCookie: [read]
        - bearerToken: [read]
      x-omrg-scopes: [read]
      responses:
        "200":
          description: Canonical templates.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineTemplateList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # ── Experiment contexts (session only) ──────────────────────────────
  /experiments:
    post:
      operationId: createExperiment
      summary: Approve an experiment workspace below an approved experiment root
      description: >
        The workspace must be an existing directory below a root that the
        operator approved with `omrg web --experiment-root`. The context
        store sits below `<workspace>/output/` (LanceDB unless `store` is a
        declared factor). Nothing is built until the first admitted run. A
        path check failure gives 400 with a stable `code`. A server started
        without an experiment root gives 409. Contexts last for one launch.
      security:
        - sessionCookie: [manage]
      x-omrg-scopes: [manage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExperimentRequest"
      responses:
        "201":
          description: Context approved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExperimentCreated"
        "400":
          $ref: "#/components/responses/ExperimentRefused"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    get:
      operationId: listExperiments
      summary: List the approved experiment roots and contexts of this launch
      security:
        - sessionCookie: [manage]
      x-omrg-scopes: [manage]
      responses:
        "200":
          description: Roots and contexts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExperimentList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /experiments/{context_id}:
    get:
      operationId: getExperiment
      summary: Return one approval record with its backend and index identity
      security:
        - sessionCookie: [manage]
      x-omrg-scopes: [manage]
      parameters:
        - $ref: "#/components/parameters/ContextId"
      responses:
        "200":
          description: The context.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExperimentDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ExperimentRefused"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      operationId: revokeExperiment
      summary: Revoke an experiment context
      description: >
        Later admissions fail with `experiment_context_revoked`. A queued
        run fails before its Engine runs. A run that already started
        finishes; cancel it with `POST /v1/runs/{run_id}/cancel`. Bound
        credentials stay valid but cannot run anything. Workspace files
        are not touched.
      security:
        - sessionCookie: [manage]
      x-omrg-scopes: [manage]
      parameters:
        - $ref: "#/components/parameters/ContextId"
      responses:
        "200":
          description: Context revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExperimentRevoked"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ExperimentRefused"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # ── Notebook plugins (session only) ─────────────────────────────────
  /plugins:
    get:
      operationId: listPlugins
      summary: List plugin registrations and running editors
      description: Runs no process. With no registration, `install_hint` says what to do.
      security:
        - sessionCookie: [plugins]
      x-omrg-scopes: [plugins]
      responses:
        "200":
          description: Plugin states and editors.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      operationId: registerPlugin
      summary: Register an approved manifest and executable
      description: >
        An explicit trust decision (`approved: true`). The manifest must be
        the shipped marimo manifest or a file below `<workspace>/plugins/`.
        The executable must sit in a directory of the server's `PATH` or
        below `<workspace>/plugins/`, and its file name must be the
        manifest's executable name. Registration runs no process; run a
        recheck before an editor opens.
      security:
        - sessionCookie: [plugins]
      x-omrg-scopes: [plugins]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterPluginRequest"
      responses:
        "201":
          description: Plugin registered (status `unchecked`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /plugins/{name}:
    delete:
      operationId: unregisterPlugin
      summary: Remove a plugin registration
      description: Stop the plugin's editors first (else 409). No file is touched.
      security:
        - sessionCookie: [plugins]
      x-omrg-scopes: [plugins]
      parameters:
        - $ref: "#/components/parameters/PluginName"
      responses:
        "200":
          description: Registration removed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginUnregistered"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /plugins/{name}/recheck:
    post:
      operationId: recheckPlugin
      summary: Probe the registered executable for version and capabilities
      description: Runs only the manifest probe recipe. Never installs or updates the tool.
      security:
        - sessionCookie: [plugins]
      x-omrg-scopes: [plugins]
      parameters:
        - $ref: "#/components/parameters/PluginName"
      responses:
        "200":
          description: Plugin state after the probe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /plugins/{name}/editors:
    post:
      operationId: openPluginEditor
      summary: Open a notebook in a separate local editor after consent
      description: >
        Needs `consent: true`, an active experiment context and a notebook
        path relative to that context's workspace. The host rechecks the
        plugin, binds the editor to loopback, and passes a new access token
        in a private file. The response carries that token once
        (`token_delivery.token`); the URL never holds it and it is never
        logged. Notebook Python runs with the user's filesystem and network
        permissions.
      security:
        - sessionCookie: [plugins]
      x-omrg-scopes: [plugins]
      parameters:
        - $ref: "#/components/parameters/PluginName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenEditorRequest"
      responses:
        "201":
          description: Editor started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditorOpened"
        "400":
          $ref: "#/components/responses/ExperimentRefused"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /plugin-editors/{launch_id}:
    delete:
      operationId: stopPluginEditor
      summary: Stop an owned editor
      description: Graceful stop first, then bounded escalation. Notebook files stay.
      security:
        - sessionCookie: [plugins]
      x-omrg-scopes: [plugins]
      parameters:
        - $ref: "#/components/parameters/LaunchId"
      responses:
        "200":
          description: Editor stopped.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditorStopped"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: omrg_session_8765
      description: >
        Browser session cookie `omrg_session_<port>` (the example name uses
        port 8765). HttpOnly, SameSite=Strict, Path=/. `POST /v1/session`
        sets it from the one-time bootstrap secret. The session holds every
        scope. State-changing requests must carry the application Origin.
    bearerToken:
      type: http
      scheme: bearer
      bearerFormat: omrg_bt_<id>.<secret>
      description: >
        Revocable per-launch credential for notebook clients, issued by
        `POST /v1/credentials`. It holds only `read`, `graph` and `run`.
        It never passes a session-only operation. It stops working when
        revoked or when the server stops.

  parameters:
    CollectionName:
      name: collection
      in: path
      required: true
      schema:
        type: string
      description: Collection name
    CredentialId:
      name: credential_id
      in: path
      required: true
      schema:
        type: string
    PipelineId:
      name: pipeline_id
      in: path
      required: true
      schema:
        type: string
    RunId:
      name: run_id
      in: path
      required: true
      schema:
        type: string
    ContextId:
      name: context_id
      in: path
      required: true
      schema:
        type: string
      description: Experiment context id (`exp_<16 hex>`).
    PluginName:
      name: name
      in: path
      required: true
      schema:
        type: string
      description: Plugin id from the manifest.
    LaunchId:
      name: launch_id
      in: path
      required: true
      schema:
        type: string

  responses:
    BadRequest:
      description: >
        Invalid request body, query or header (`error_type: validation`),
        an invalid Host header, or a credential in the query string.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing, invalid or revoked credential.
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BootstrapRejected:
      description: >
        The bootstrap secret is wrong, was already used, or stopped working
        after too many wrong guesses. Restart `omrg web` to get a new link.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: >
        Foreign Origin or cross-site fetch, a missing scope, a bearer
        credential on a session-only operation, or a path outside the
        approved roots.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Unknown resource.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: >
        The request conflicts with the current state: a stale, used or
        expired confirmation (preview again), a reserved job pipeline, or a
        run in the wrong state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PayloadTooLarge:
      description: The file is larger than the upload limit.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnsupportedMediaType:
      description: The file type is not ingestible (archives included).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationFailed:
      description: >
        Core validation rejected the graph, inputs or selector. The body
        lists every structured issue.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PreconditionRequired:
      description: The destructive request has no confirmation token. Preview first.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: The shared run and job queue is full. Try again later.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: Unexpected server error. The body holds no detail.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotImplemented:
      description: The vector store cannot serve this operation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceUnavailable:
      description: >
        The server is starting or shutting down, or the Engine or run
        service is not available.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ExperimentRefused:
      description: >
        The request was refused. An experiment refusal carries a stable
        `code` (`ExperimentError`); other refusals use the error envelope.
        Nothing was changed.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/Error"
              - $ref: "#/components/schemas/ExperimentError"

  schemas:
    # ── Error envelope (matches MCP error-dict shape) ──────────────────
    Error:
      type: object
      additionalProperties: false
      required:
        - status
        - message
      properties:
        status:
          type: string
          enum: [error]
        message:
          type: string
        error_type:
          type: string
          enum: [validation, retrieval, internal]
          description: Optional error category.
        issues:
          type: array
          description: Present only on 422 graph validation failures.
          items:
            $ref: "#/components/schemas/ValidationIssue"

    ValidationIssue:
      type: object
      additionalProperties: false
      required: [code, message, node_id, port, edge, lever]
      properties:
        code:
          type: string
          description: Stable issue code, for example `unsupported_schema_version`.
        message:
          type: string
        node_id:
          type: [string, "null"]
        port:
          type: [string, "null"]
        edge:
          type: [string, "null"]
        lever:
          type: [string, "null"]

    # ── Foundation ─────────────────────────────────────────────────────
    Scope:
      type: string
      enum: [read, graph, run, files, plugins, credentials, manage]

    BearerScope:
      type: string
      enum: [read, graph, run]

    Health:
      type: object
      additionalProperties: false
      required: [status, ready]
      properties:
        status:
          type: string
          enum: [ok]
        ready:
          type: boolean
          description: False while the server starts or shuts down.

    BootstrapRequest:
      type: object
      required: [bootstrap]
      properties:
        bootstrap:
          type: string
          minLength: 1
          maxLength: 256
          description: The secret from the `#bootstrap=` fragment of the launch URL.

    SessionCreated:
      type: object
      additionalProperties: false
      required: [status, kind]
      properties:
        status:
          type: string
          enum: [ok]
        kind:
          type: string
          enum: [session]

    SessionInfo:
      type: object
      additionalProperties: false
      required: [status, kind, scopes, workspace]
      properties:
        status:
          type: string
          enum: [ok]
        kind:
          type: string
          enum: [session, bearer]
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/Scope"
        workspace:
          type: [string, "null"]
          description: >
            Canonical path of the workspace directory this server uses
            (`omrg web --workspace`, default `~/.omrg/workspace`). It is
            `null` only while the runtime is not started.

    CredentialRequest:
      type: object
      required: [scopes]
      properties:
        scopes:
          type: array
          minItems: 1
          maxItems: 3
          items:
            $ref: "#/components/schemas/BearerScope"
        label:
          type: string
          maxLength: 80
          default: ""
        experiment_context:
          type: [string, "null"]
          minLength: 1
          maxLength: 64
          description: >
            Bind the credential to this active experiment context. A bound
            credential runs graphs only in that context.

    IssuedCredential:
      type: object
      additionalProperties: false
      required: [status, id, token, scopes, label, experiment_context]
      properties:
        status:
          type: string
          enum: [ok]
        id:
          type: string
        token:
          type: string
          description: The bearer token. It is shown only in this response.
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/BearerScope"
        label:
          type: string
        experiment_context:
          type: [string, "null"]

    CredentialInfo:
      type: object
      additionalProperties: false
      required: [id, scopes, label, created_at, revoked, experiment_context]
      properties:
        id:
          type: string
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/BearerScope"
        label:
          type: string
        created_at:
          type: number
          description: Unix time in seconds.
        revoked:
          type: boolean
        experiment_context:
          type: [string, "null"]
          description: Experiment context the credential is bound to, if any.

    CredentialList:
      type: object
      additionalProperties: false
      required: [status, credentials]
      properties:
        status:
          type: string
          enum: [ok]
        credentials:
          type: array
          items:
            $ref: "#/components/schemas/CredentialInfo"

    CredentialRevoked:
      type: object
      additionalProperties: false
      required: [status, id, revoked]
      properties:
        status:
          type: string
          enum: [ok]
        id:
          type: string
        revoked:
          type: boolean
          enum: [true]

    Root:
      type: object
      additionalProperties: false
      required: [id, path, kind]
      properties:
        id:
          type: string
          description: "`root_` plus 12 hex characters of the canonical path digest."
        path:
          type: string
        kind:
          type: string
          enum: [operator, managed]

    RootList:
      type: object
      additionalProperties: false
      required: [status, roots]
      properties:
        status:
          type: string
          enum: [ok]
        roots:
          type: array
          items:
            $ref: "#/components/schemas/Root"

    UploadPreflightRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 1024
        size:
          type: [integer, "null"]
          description: Declared size in bytes, when known.

    UploadPreflightResult:
      type: object
      additionalProperties: false
      required: [status, name, max_bytes]
      properties:
        status:
          type: string
          enum: [ok]
        name:
          type: string
        max_bytes:
          type: integer

    UploadStored:
      type: object
      additionalProperties: false
      required: [status, upload]
      properties:
        status:
          type: string
          enum: [ok]
        upload:
          type: object
          additionalProperties: false
          required: [id, name, size, sha256]
          properties:
            id:
              type: string
            name:
              type: string
            size:
              type: integer
            sha256:
              type: string

    # ── Ingest ─────────────────────────────────────────────────────────
    IngestRequest:
      type: object
      additionalProperties: false
      required:
        - path
      properties:
        path:
          type: string
          maxLength: 4096
          description: >
            Absolute file or directory path inside an approved root. For an
            upload, use the managed root path plus `<upload id>/<name>`.
        collection:
          type: string
          minLength: 1
          maxLength: 256
          default: documents
          description: Target collection


    # ── Search ─────────────────────────────────────────────────────────
    SearchRequest:
      type: object
      additionalProperties: false
      required:
        - query
      properties:
        query:
          type: string
          description: Natural language search query
        top_k:
          type: [integer, "null"]
          minimum: 1
          description: >
            Maximum results to return. Resolved from the collection profile
            when omitted.
        similarity_threshold:
          type: [number, "null"]
          minimum: 0.0
          maximum: 1.0
          description: >
            Minimum canonical dense similarity. Resolved from the collection
            profile when omitted. Hybrid/no-rerank applies it to dense
            evidence before RRF; successful reranking uses the calibrated
            reranker transform.
        rerank:
          type:
            - boolean
            - "null"
          description: >
            Tri-state rerank control: true (force on), false (force off),
            null (resolved from the collection profile when omitted).
        hybrid:
          type:
            - boolean
            - "null"
          description: >
            Fuse dense + sparse (BM25 + RRF). Resolved from the collection
            profile when omitted.
        expand_window:
          type: integer
          minimum: 0
          default: 0
          description: >
            Neighbours added per side of each retrieved chunk during
            context assembly (0 = no expansion, the default). Expanded
            neighbours merge into the retrieved chunk under the assembly
            merging rules and never displace retrieved rows.
        diagnostics:
          type: boolean
          default: false
          description: >
            When true, include core-produced retrieval diagnostics in each
            result row (rank diagnostics, rerank reason, sparse backend,
            per-stage timings, etc.). Diagnostics-only fields are optional
            on the response schema.
        metadata_filter:
          type:
            - object
            - "null"
          description: ChromaDB-compatible `where` clause for metadata filtering
          additionalProperties: true

    SearchResult:
      type: object
      required:
        - score
        - score_kind
        - source
        - text
        - reranked
        - metadata
        - source_id
        - source_version
        - chunk_id
        - source_chunk_index
        - source_chunk_count
      properties:
        score:
          type: number
          format: float
          description: >
            Relevance score. Absent on rows added purely by neighbour
            expansion (``expand_window`` > 0), which were never ranked.
        score_kind:
          type: string
          enum: [dense_similarity_v1, rrf_v1, reranker_sigmoid_v1]
          description: >
            Score semantics for ``score``. Absent on rows added purely by
            neighbour expansion, which carry no retrieval score.
        source:
          type: string
        page_label:
          type:
            - string
            - "null"
          description: >
            Page label when the configured reader observes page boundaries.
            Optional by contract (design D5): readers that return one
            document per file (pdf_inspector) genuinely cannot know the
            page, so the field is null there rather than fabricated.
        text:
          type: string
        reranked:
          type: boolean
        metadata:
          type: object
          description: >
            The full stored metadata mapping for the chunk, including
            file path, page label, and any extraction-produced fields.
          additionalProperties: true
        source_id:
          type:
            - string
            - "null"
          description: >
            Stable source identity derived from the canonical source path.
            Absent (null) for legacy rows stored without lineage metadata.
        source_version:
          type:
            - string
            - "null"
          description: >
            Content version stamp of the source at ingest time. Absent
            (null) for legacy rows.
        chunk_id:
          type:
            - string
            - "null"
          description: >
            Stable chunk identity within the source. Absent (null) for
            legacy rows.
        source_chunk_index:
          type:
            - integer
            - "null"
          description: >
            Zero-based ordinal of this chunk within its source. Absent
            (null) for legacy rows.
        source_chunk_count:
          type:
            - integer
            - "null"
          description: >
            Total chunk count of the source at ingest time. Absent (null)
            for legacy rows.
        chunk_ids:
          type: array
          items:
            type: string
          description: >
            The ``chunk_id`` of every constituent chunk of an assembled
            row, in ascending ``source_chunk_index`` order. Present only
            on rows the assembly stage merged from multiple adjacent
            chunks; unmerged rows keep the plain ``chunk_id`` key and gain
            nothing. Each listed id is a stable per-chunk reference that
            resolves to exactly one stored chunk, so citations remain
            verifiable after merging. Optional by contract: absent means
            the row is a single chunk.
        # ── Diagnostics-only fields (present when diagnostics=true) ──────
        id:
          type: string
          description: Internal row identifier (diagnostics only).
        fused_score:
          type: number
          format: float
          description: RRF fused score (diagnostics only, hybrid queries).
        dense_score:
          type: number
          format: float
          description: Canonical dense similarity score (diagnostics only).
        dense_score_kind:
          type: string
          description: Score kind of the dense evidence (diagnostics only).
        dense_rank:
          type:
            - integer
            - "null"
          description: Rank in the dense ranking (diagnostics only, hybrid).
        sparse_rank:
          type:
            - integer
            - "null"
          description: Rank in the sparse ranking (diagnostics only, hybrid).
        fused_rank:
          type:
            - integer
            - "null"
          description: Rank after RRF fusion (diagnostics only, hybrid).
        rerank_reason:
          type: string
          description: >
            Policy or failure reason explaining the rerank decision
            (diagnostics only).
        threshold_score_kind:
          type: string
          description: >
            Score semantics used for threshold evaluation (diagnostics only).
        rerank_backend:
          type: string
          description: >
            Backend that actually served the rerank (e.g. onnx, torch).
            Present only when the reranker ran (diagnostics only).
        sparse_backend:
          type: string
          description: >
            Sparse backend that actually served the hybrid query (e.g.
            bm25, native). Present only for hybrid queries (diagnostics only).
        assembly_merged:
          type: boolean
          description: >
            Whether the assembly stage merged this row from multiple
            adjacent chunks (diagnostics only).
        assembly_chunk_count:
          type: integer
          minimum: 1
          description: >
            Number of constituent chunks this row was assembled from
            (diagnostics only; 1 for unmerged rows).
        assembly_expanded:
          type: boolean
          description: >
            Whether the row was added purely by neighbour expansion and
            was never ranked — such rows carry no retrieval score
            (diagnostics only).
        norm_guard:
          type: object
          description: >
            Embedding norm-guard state dict. Present only when the norm
            guard is enabled (diagnostics only).
          additionalProperties: true
        timings:
          type: object
          description: >
            Per-stage retrieval wall-clock durations in seconds, attached
            to each result row when diagnostics are enabled. Keys are
            stage names (``embedding_seconds``, ``dense_seconds``,
            ``sparse_seconds``, ``fusion_seconds``, ``rerank_seconds``,
            ``assembly_seconds``).
            A stage that did not run is absent — absence means "did not
            execute", never "took zero time". Per-stage durations do not
            sum to wall time in hybrid mode because dense and sparse run
            concurrently. No total is emitted (diagnostics only).
          additionalProperties:
            type: number
            format: float

    # ── Document info ──────────────────────────────────────────────────
    AnswerRequest:
      type: object
      additionalProperties: false
      required:
        - query
      properties:
        query:
          type: string
          maxLength: 4096
          description: Natural language question to answer.
        top_k:
          type:
            - integer
            - "null"
          minimum: 1
          maximum: 100
          description: >
            Maximum chunks to use as evidence. Resolved from the
            collection profile when omitted.
        similarity_threshold:
          type:
            - number
            - "null"
          format: float
          minimum: 0
          maximum: 1
          description: Minimum evidence score (0.0 = no filtering).
        rerank:
          type:
            - boolean
            - "null"
          description: >
            Re-score evidence with the cross-encoder reranker. Resolved
            from the collection profile when omitted.
        hybrid:
          type:
            - boolean
            - "null"
          description: >
            Fuse dense + sparse retrieval. Resolved from the collection
            profile when omitted.
        expand_window:
          type: integer
          minimum: 0
          maximum: 10
          default: 0
          description: >
            Neighbours merged into each evidence chunk during context
            assembly.
        metadata_filter:
          type:
            - object
            - "null"
          description: ChromaDB-compatible `where` clause for evidence filtering
          additionalProperties: true

    AnswerResponse:
      type: object
      required:
        - status
        - query
        - answer
        - citations
        - evidence
        - failure_stage
        - error
        - completion_source
      properties:
        status:
          type: string
          enum: [ok, no_evidence, generation_unverified, unverified_claims, error]
          description: >
            ok = grounded answer with at least one valid citation.
            no_evidence = retrieval found nothing (no model call made).
            generation_unverified = answer text present but no valid
            citation; the evidence is still returned. unverified_claims =
            claim verification (ANSWER__VERIFY_CLAIMS, ADR-059) found one
            or more cited claims unsupported by their evidence; the
            answer, citations, and evidence are retained and the failing
            claims are listed. error = see failure_stage and error.
        query:
          type: string
        answer:
          type:
            - string
            - "null"
          description: >
            The synthesised answer text (null for no_evidence, retrieval
            failure, and provider-absent errors).
        citations:
          type: array
          items:
            $ref: "#/components/schemas/AnswerCitation"
          description: >
            Deterministic citations built from supplied chunk lineage.
            Empty for no_evidence; a substantive answer with no valid
            citation yields an empty list and status
            generation_unverified.
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/AnswerEvidence"
          description: >
            Every chunk supplied as context, retained even on generation
            failure so the caller keeps the evidence.
        failure_stage:
          type:
            - string
            - "null"
          enum: [retrieval, generation, null]
          description: >
            Which stage failed (null unless status is error). retrieval =
            the language model was never called.
        error:
          type:
            - string
            - "null"
          description: >
            Actionable message; the provider-absent case names the
            configuration to set.
        completion_source:
          type: string
          description: >
            Which model completed the answer: server, client_mrtr,
            client_legacy, or none.
        diagnostics:
          $ref: "#/components/schemas/AnswerDiagnostics"
          description: >
            Present only when diagnostics were requested.
        verified:
          type: boolean
          description: >
            Present only when claim verification ran and every cited
            claim passed the judge (ADR-059). Absent when verification
            is disabled or skipped.
        unverified_claims:
          type: array
          items:
            type: object
            required: [claim, verdict, ordinals]
            properties:
              claim:
                type: string
                description: The failing claim text (citation markers stripped).
              verdict:
                type: string
                enum: [unsupported, unparseable]
                description: unsupported = the evidence contradicts or omits the claim; unparseable = the judge reply could not be read (never silently passed).
              ordinals:
                type: array
                items:
                  type: integer
                  minimum: 1
                description: The evidence ordinals the claim cited.
          description: >
            Present only when status is unverified_claims — the cited
            claims that failed verification. The answer, citations, and
            evidence are all retained.
        verification_skipped:
          type: string
          description: >
            Present only when claim verification was enabled but could
            not run (provider unavailable, call failure, or every
            verdict unparseable). Names the reason; the referential-only
            ok guarantee is retained.

    AnswerCitation:
      type: object
      required:
        - ordinal
        - chunk_id
        - chunk_ids
        - source_id
        - source_version
        - source
        - source_chunk_index
      properties:
        ordinal:
          type: integer
          minimum: 1
          description: The 1-based supplied-source number the model cited.
        chunk_id:
          type:
            - string
            - "null"
          description: >
            The merged row's representative chunk id; re-fetches exactly
            one stored chunk by metadata filter.
        chunk_ids:
          type: array
          items:
            type: string
          description: >
            Every constituent chunk id when context assembly merged
            rows; a single-element list otherwise.
        source_id:
          type:
            - string
            - "null"
        source_version:
          type:
            - string
            - "null"
        source:
          type:
            - string
            - "null"
        source_chunk_index:
          type:
            - integer
            - "null"
        score:
          type:
            - number
            - "null"
          format: float
        score_kind:
          type:
            - string
            - "null"

    AnswerEvidence:
      type: object
      description: >
        One chunk supplied as context — the citation lineage plus the
        ordinal it was labelled with in the prompt and the chunk text.
      required:
        - ordinal
        - chunk_id
        - chunk_ids
        - source_id
        - source_version
        - source
        - source_chunk_index
        - text
      properties:
        ordinal:
          type: integer
          minimum: 1
          description: >
            The 1-based position of this chunk in the supplied context;
            the number citations refer to.
        chunk_id:
          type:
            - string
            - "null"
        chunk_ids:
          type: array
          items:
            type: string
        source_id:
          type:
            - string
            - "null"
        source_version:
          type:
            - string
            - "null"
        source:
          type:
            - string
            - "null"
        source_chunk_index:
          type:
            - integer
            - "null"
        score:
          type:
            - number
            - "null"
          format: float
        score_kind:
          type:
            - string
            - "null"
        text:
          type: string

    AnswerDiagnostics:
      type: object
      required:
        - retrieval_ms
        - generation_ms
        - completion_calls
      properties:
        retrieval_ms:
          type: number
          format: float
          description: Duration of the retrieval stage in milliseconds.
        generation_ms:
          type: number
          format: float
          description: Duration of the generation stage in milliseconds.
        completion_calls:
          type: integer
          minimum: 0
          description: >
            Number of language-model completion rounds made (bounded by
            the answer configuration).
        verification_ms:
          type: number
          format: float
          description: >
            Duration of the claim-verification stage in milliseconds
            (ADR-059). Present only when the stage ran.
        verification_calls:
          type: integer
          minimum: 0
          description: >
            Judge completions made, one per cited claim. Present only
            when the stage ran; reported separately from
            completion_calls.

    DocumentInfo:
      type: object
      properties:
        source:
          type: string
        source_id:
          type:
            - string
            - "null"
          description: >
            Stable identity derived from the canonical source path. Absent
            (null) for legacy rows grouped by display path.
        chunks:
          type: integer
        orphaned:
          type:
            - boolean
            - "null"
          description: >
            Tri-state machine-local orphan status: true (source file missing
            on this machine), false (source file present), null (cannot
            determine — the source path is not an absolute path on this
            machine). This is machine-local, not a global property of the
            document.

    # ── Collection info ────────────────────────────────────────────────
    CollectionInfo:
      type: object
      additionalProperties: false
      required: [name, document_count, chunk_count, profile]
      properties:
        name:
          type: string
        document_count:
          type: integer
        chunk_count:
          type: integer
        profile:
          type: [string, "null"]
          description: >
            Profile name stored in the collection metadata (for example
            `documents` or `codebase`), or `null` when no profile tag is
            stored or the metadata cannot be read.

    # ── Chunk inspection ───────────────────────────────────────────────
    ChunkView:
      type: object
      additionalProperties: false
      required:
        - chunk_id
        - source_id
        - source_version
        - source_chunk_index
        - source_chunk_count
        - source
        - page_label
        - text
        - metadata
      properties:
        chunk_id:
          type: [string, "null"]
        source_id:
          type: [string, "null"]
        source_version:
          type: [string, "null"]
        source_chunk_index:
          type: [integer, "null"]
        source_chunk_count:
          type: [integer, "null"]
        source:
          type: [string, "null"]
          description: Stored display path. It grants no file access.
        page_label:
          type: [string, "null"]
        text:
          type: string
          description: Plain text. Render it as text, never as markup.
        metadata:
          type: object
          additionalProperties: true

    ChunkInspection:
      type: object
      additionalProperties: false
      required: [status, collection, text_format, chunk, previous, next]
      properties:
        status:
          type: string
          enum: [ok]
        collection:
          type: string
        text_format:
          type: string
          enum: [plain]
        chunk:
          $ref: "#/components/schemas/ChunkView"
        previous:
          type: array
          description: Earlier neighbours of the same source version, in index order.
          items:
            $ref: "#/components/schemas/ChunkView"
        next:
          type: array
          description: Later neighbours of the same source version, in index order.
          items:
            $ref: "#/components/schemas/ChunkView"

    # ── Destructive confirmations ──────────────────────────────────────
    Confirmation:
      type: object
      additionalProperties: false
      required: [token, expires_at, expires_in, validity, warning]
      description: >
        Single-use confirmation for a previewed destructive action. It is
        bound to the action, collection, selector and observed store
        validity token.
      properties:
        token:
          type: string
        expires_at:
          type: string
          format: date-time
        expires_in:
          type: number
          description: Seconds the preview stays valid (300).
        validity:
          type: string
          enum: [durable, process_local]
          description: >
            `durable` when the store reports a durable data version.
            `process_local` when only a process-local counter exists; a
            write by another process can then go undetected.
        warning:
          type: [string, "null"]
          description: Set when `validity` is `process_local`.

    # ── Delete ─────────────────────────────────────────────────────────
    DeleteRequest:
      type: object
      additionalProperties: false
      description: >
        `path` and `metadata_filter` are mutually exclusive. With neither,
        the whole collection is the selection.
      properties:
        path:
          type: [string, "null"]
          maxLength: 4096
          description: Source file path to delete chunks for
        metadata_filter:
          type: [object, "null"]
          description: ChromaDB `where` clause for metadata-based deletion (non-empty)
          additionalProperties: true
        dry_run:
          type: boolean
          default: false
          description: Preview without modifying data and issue a confirmation.
        confirmation_token:
          type: [string, "null"]
          maxLength: 128
          description: >
            Token from the preview `confirmation`. Required when `dry_run`
            is false.

    DeleteResult:
      type: object
      additionalProperties: false
      required: [status, mode, collection]
      properties:
        status:
          type: string
          enum: [ok]
        mode:
          type: string
          enum: [path, metadata, collection]
        collection:
          type: string
        dry_run:
          type: boolean
          description: Present only on a preview.
        would_delete:
          type: integer
          description: Present only on a preview.
        confirmation:
          $ref: "#/components/schemas/Confirmation"
        chunks_removed:
          type: integer
          description: Present after a path or metadata deletion.

    # ── Codebase map ───────────────────────────────────────────────────
    CodebaseMapRequest:
      type: object
      additionalProperties: false
      required:
        - path
      properties:
        path:
          type: string
          maxLength: 4096
          description: Absolute project directory path inside an approved root
        refresh:
          type: boolean
          default: false
          description: Force rebuild regardless of cache

    # ── Profile change ─────────────────────────────────────────────────
    ProfileChangeRequest:
      type: object
      additionalProperties: false
      required:
        - profile
      properties:
        profile:
          type: string
          enum: [documents, codebase]
          description: Target operational profile
        confirm:
          type: boolean
          default: false
          description: >
            When false, returns a preview. When true, applies the change
            (needs `confirmation_token`).
        confirmation_token:
          type: [string, "null"]
          maxLength: 128
          description: Token from the preview `confirmation`.

    ProfilePreview:
      type: object
      additionalProperties: false
      required: [status, contract, confirm_required]
      properties:
        status:
          type: string
          enum: [preview]
        contract:
          type: object
          additionalProperties: false
          required:
            - collection
            - chunk_count
            - old_profile
            - new_profile
            - lever_impacts
            - reingest_pointer
          properties:
            collection:
              type: string
            new_profile:
              type: string
            old_profile:
              type: [string, "null"]
            chunk_count:
              type: integer
            lever_impacts:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [lever, change, timing]
                properties:
                  lever:
                    type: string
                  change:
                    type: string
                  timing:
                    type: string
                    enum: [query-time, ingest-time]
            reingest_pointer:
              type: string
        confirm_required:
          type: boolean
          enum: [true]
        confirmation:
          $ref: "#/components/schemas/Confirmation"

    ProfileChangeResult:
      type: object
      additionalProperties: false
      required: [status, collection, profile, chunk_count_unchanged]
      properties:
        status:
          type: string
          enum: [ok]
        collection:
          type: string
        profile:
          type: string
        chunk_count_unchanged:
          type: integer

    # ── Job resource (document jobs) ───────────────────────────────────
    Job:
      type: object
      additionalProperties: false
      required: [job_id, status, result, error, created_at, updated_at]
      properties:
        job_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued, running, completed, failed]
          description: >
            Current job state. `running` also covers a requested
            cancellation that has not stopped yet.
        result:
          type: [object, "null"]
          description: >
            Result payload when status is completed: the ingestion summary,
            or `{"map": "..."}` for a codebase map.
        error:
          type: [string, "null"]
          description: Redacted error message when status is failed.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ── Graph catalogue ────────────────────────────────────────────────
    OperationEntry:
      type: object
      additionalProperties: false
      required:
        - operation_id
        - version
        - title
        - family
        - description
        - parameters
        - inputs
        - outputs
        - capabilities
        - effect
        - bypass
        - collection_param
        - lever_params
        - free_text_params
        - index_shaping
        - available
        - unavailable_reasons
        - adapter_ref
      properties:
        operation_id:
          type: string
          description: Stable id in `family.name` form, for example `retrieve.dense`.
        version:
          type: integer
        title:
          type: string
        family:
          type: string
        description:
          type: string
        parameters:
          type: object
          description: JSON Schema of the operation parameters.
        inputs:
          type: array
          items:
            $ref: "#/components/schemas/PortDescription"
        outputs:
          type: array
          items:
            $ref: "#/components/schemas/PortDescription"
        capabilities:
          type: array
          items:
            type: string
        effect:
          type: string
        bypass:
          type: [object, "null"]
        collection_param:
          type: [string, "null"]
        lever_params:
          type: object
          additionalProperties:
            type: [string, "null"]
        free_text_params:
          type: array
          items:
            type: string
        index_shaping:
          type: boolean
        available:
          type: boolean
        unavailable_reasons:
          type: array
          items:
            type: string
        adapter_ref:
          type: string

    PortDescription:
      type: object
      required: [name, type, cardinality, description]
      properties:
        name:
          type: string
        type:
          type: object
        cardinality:
          type: string
        description:
          type: string

    OperationCatalogue:
      type: object
      additionalProperties: false
      required: [status, operations]
      properties:
        status:
          type: string
          enum: [ok]
        operations:
          type: array
          items:
            $ref: "#/components/schemas/OperationEntry"

    # ── Pipelines and revisions ────────────────────────────────────────
    PipelineRecord:
      type: object
      additionalProperties: false
      required: [pipeline_id, title, current_revision_id, layout, created_at, updated_at]
      properties:
        pipeline_id:
          type: string
        title:
          type: string
        current_revision_id:
          type: [string, "null"]
        layout:
          type: object
          description: Presentation layout. It never changes execution.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    RevisionRecord:
      type: object
      additionalProperties: false
      required:
        - revision_id
        - pipeline_id
        - revision_number
        - content_hash
        - schema_version
        - document
        - created_at
      properties:
        revision_id:
          type: string
        pipeline_id:
          type: string
        revision_number:
          type: integer
          minimum: 1
        content_hash:
          type: string
        schema_version:
          type: integer
        document:
          type: object
          description: The normalised graph document.
        created_at:
          type: string
          format: date-time

    CreatePipelineRequest:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        layout:
          type: object
          default: {}

    LayoutRequest:
      type: object
      additionalProperties: false
      required: [layout]
      properties:
        layout:
          type: object

    RevisionRequest:
      type: object
      additionalProperties: false
      required: [document]
      properties:
        document:
          type: object
          description: A graph document, or a wrapper with `graph` and `layout` keys.

    PipelineEnvelope:
      type: object
      additionalProperties: false
      required: [status, pipeline]
      properties:
        status:
          type: string
          enum: [ok]
        pipeline:
          $ref: "#/components/schemas/PipelineRecord"

    PipelineList:
      type: object
      additionalProperties: false
      required: [status, pipelines]
      properties:
        status:
          type: string
          enum: [ok]
        pipelines:
          type: array
          items:
            $ref: "#/components/schemas/PipelineRecord"

    PipelineDetail:
      type: object
      additionalProperties: false
      required: [status, pipeline, current_revision]
      properties:
        status:
          type: string
          enum: [ok]
        pipeline:
          $ref: "#/components/schemas/PipelineRecord"
        current_revision:
          oneOf:
            - $ref: "#/components/schemas/RevisionRecord"
            - type: "null"

    RevisionSaved:
      type: object
      additionalProperties: false
      required: [status, revision, created]
      properties:
        status:
          type: string
          enum: [ok]
        revision:
          $ref: "#/components/schemas/RevisionRecord"
        created:
          type: boolean
          description: False when identical content already existed.

    RevisionList:
      type: object
      additionalProperties: false
      required: [status, revisions]
      properties:
        status:
          type: string
          enum: [ok]
        revisions:
          type: array
          items:
            $ref: "#/components/schemas/RevisionRecord"

    RevisionEnvelope:
      type: object
      additionalProperties: false
      required: [status, revision]
      properties:
        status:
          type: string
          enum: [ok]
        revision:
          $ref: "#/components/schemas/RevisionRecord"

    # ── Graph validation ───────────────────────────────────────────────
    ValidateRequest:
      type: object
      additionalProperties: false
      required: [document]
      properties:
        document:
          type: object
        inputs:
          type: [object, "null"]
          description: Run inputs. When given, the check is the admission check.
        collection:
          type: [string, "null"]
          minLength: 1
          maxLength: 128
          description: >
            Default collection for nodes that do not bind one. The graph
            or the collection profile resolves it when omitted.

    DraftValidation:
      type: object
      additionalProperties: false
      required: [status, valid, admitted, order, resolved_versions, collections]
      properties:
        status:
          type: string
          enum: [ok]
        valid:
          type: boolean
          enum: [true]
        admitted:
          type: boolean
          enum: [false]
        order:
          type: array
          items:
            type: string
        resolved_versions:
          type: object
          additionalProperties:
            type: integer
        collections:
          type: object
          description: Node id to bound collection name.
          additionalProperties:
            type: string

    EffectiveControl:
      type: object
      additionalProperties: false
      required: [lever, value, source, detail]
      properties:
        lever:
          type: string
        value:
          description: Effective value (any JSON value).
        source:
          type: string
          enum: [node, graph, environment, profile]
        detail:
          type: string

    AdmissionValidation:
      type: object
      additionalProperties: false
      required: [status, valid, admitted, graph_identity, order, collections, nodes]
      properties:
        status:
          type: string
          enum: [ok]
        valid:
          type: boolean
          enum: [true]
        admitted:
          type: boolean
          enum: [true]
        graph_identity:
          type: string
        order:
          type: array
          items:
            type: string
        collections:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, profile, profile_origin]
            properties:
              name:
                type: string
              profile:
                type: string
              profile_origin:
                type: string
                enum: [collection, graph]
        nodes:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [node_id, operation, version, enabled, collection, controls]
            properties:
              node_id:
                type: string
              operation:
                type: string
              version:
                type: integer
              enabled:
                type: boolean
              collection:
                type: [string, "null"]
              controls:
                type: array
                items:
                  $ref: "#/components/schemas/EffectiveControl"

    # ── Graph runs ─────────────────────────────────────────────────────
    RunStatus:
      type: string
      enum: [queued, running, cancelling, succeeded, failed, cancelled, interrupted]

    SubmitRunRequest:
      type: object
      additionalProperties: false
      required: [revision_id]
      properties:
        revision_id:
          type: string
          minLength: 1
          maxLength: 64
        inputs:
          type: object
          default: {}
          description: Run inputs. Values must not hold credentials.
        origin:
          type: string
          enum: [submit, repeat]
          default: submit
        experiment_context:
          type: [string, "null"]
          minLength: 1
          maxLength: 64
          description: >
            Run in this approved experiment context. The run records
            `resources.experiment` (context id, graph identity, backend and
            index identity). Omitted means the live library.

    RunRecord:
      type: object
      additionalProperties: false
      required:
        - run_id
        - pipeline_id
        - revision_id
        - graph_hash
        - status
        - origin
        - source_run_id
        - settings
        - resources
        - inputs
        - failure
        - result_ref
        - last_sequence
        - created_at
        - started_at
        - finished_at
      properties:
        run_id:
          type: string
        pipeline_id:
          type: string
        revision_id:
          type: string
        graph_hash:
          type: string
        status:
          $ref: "#/components/schemas/RunStatus"
        origin:
          type: string
          enum: [submit, repeat, retry]
        source_run_id:
          type: [string, "null"]
          description: The run a retry repeats.
        settings:
          type: object
          description: Redacted settings resolved at admission, per collection.
        resources:
          type: object
          description: >
            Identities resolved at admission. Graph runs record
            `graph_identity`, `operations` (node id to `operation@version`),
            `controls` (node id to the admitted `EffectiveControl` list) and
            `index`: `backend` (store kind, location, embedding identity,
            `index_identity`, `store_class`) and `collections` (name to
            `{exists, data_version, version_scope}`; `version_scope` is
            `durable`, or `process-local` with a `generation` counter that is
            valid in the server process only). Experiment runs add
            `experiment` and `artefact_root`.
        inputs:
          type: object
        failure:
          type: [object, "null"]
          description: "`{reason, error, ...}` for a failed, cancelled or interrupted run."
        result_ref:
          type: [string, "null"]
        last_sequence:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
        started_at:
          type: [string, "null"]
          format: date-time
        finished_at:
          type: [string, "null"]
          format: date-time

    RunEnvelope:
      type: object
      additionalProperties: false
      required: [status, run]
      properties:
        status:
          type: string
          enum: [ok]
        run:
          $ref: "#/components/schemas/RunRecord"

    RunList:
      type: object
      additionalProperties: false
      required: [status, runs]
      properties:
        status:
          type: string
          enum: [ok]
        runs:
          type: array
          items:
            $ref: "#/components/schemas/RunRecord"

    RunResult:
      type: object
      additionalProperties: false
      required: [status, run_id, result]
      properties:
        status:
          type: string
          enum: [ok]
        run_id:
          type: string
        result:
          type: object
          description: >
            The redacted pipeline result: run id, status, graph identity,
            outputs, node outcomes, failed node, completed effects, wall
            time, error and the admitted node controls.
          required: [run_id, status, graph_identity, outputs]
          properties:
            run_id:
              type: string
            status:
              type: string
            graph_identity:
              type: string
            outputs:
              type: object
            nodes:
              type: array
              items:
                $ref: "#/components/schemas/NodeOutcome"
            controls:
              type: object
              description: Node id to the admitted controls of that node.
              additionalProperties:
                type: array
                items:
                  $ref: "#/components/schemas/EffectiveControl"

    NodeOutcome:
      type: object
      required: [node_id, status]
      description: What happened to one node in one unit.
      properties:
        node_id:
          type: string
        status:
          type: string
        error:
          type: [string, "null"]
        fallback:
          type: [string, "null"]
          description: The domain fallback reason, when one applied.
        effects:
          type: array
          items:
            type: string
        duration_s:
          type: [number, "null"]
        unit_id:
          type: [string, "null"]
        summary:
          type: object
          description: >
            Bounded, redacted node summary, the data of its completed or
            bypassed event. For example a reranker switched off records
            `{reranked: false, reason}`; a node disabled in the graph
            records the bypass reason.

    RunEventRecord:
      type: object
      additionalProperties: false
      required: [run_id, sequence, kind, node_id, unit_id, summary, created_at]
      properties:
        run_id:
          type: string
        sequence:
          type: integer
          minimum: 1
        kind:
          type: string
          description: Event kind, for example `run.started` or `node.finished`.
        node_id:
          type: [string, "null"]
        unit_id:
          type: [string, "null"]
        summary:
          type: object
        created_at:
          type: string
          format: date-time

    RunEventPage:
      type: object
      additionalProperties: false
      required: [status, run_id, run_status, events, last_sequence, complete]
      properties:
        status:
          type: string
          enum: [ok]
        run_id:
          type: string
        run_status:
          $ref: "#/components/schemas/RunStatus"
        events:
          type: array
          items:
            $ref: "#/components/schemas/RunEventRecord"
        last_sequence:
          type: integer
          minimum: 0
          description: Send this value as the next `after_sequence`.
        complete:
          type: boolean

    JobEventPage:
      type: object
      additionalProperties: false
      required: [status, job_id, job_status, events, last_sequence, complete]
      properties:
        status:
          type: string
          enum: [ok]
        job_id:
          type: string
        job_status:
          type: string
          enum: [queued, running, completed, failed]
        events:
          type: array
          items:
            $ref: "#/components/schemas/RunEventRecord"
        last_sequence:
          type: integer
          minimum: 0
          description: Send this value as the next `after_sequence`.
        complete:
          type: boolean

    StreamEnd:
      type: object
      additionalProperties: false
      required: [status, last_sequence]
      description: Data of the final `run.end` server-sent event.
      properties:
        status:
          $ref: "#/components/schemas/RunStatus"
        last_sequence:
          type: integer
          minimum: 0

    StreamClosing:
      type: object
      additionalProperties: false
      required: [reason]
      description: Data of the `server.closing` server-sent event.
      properties:
        reason:
          type: string

    # ── Workspace cleanup ──────────────────────────────────────────────
    CleanupSelector:
      type: object
      additionalProperties: false
      description: Every given criterion must hold. Only finished runs are selected.
      properties:
        older_than_days:
          type: [number, "null"]
          minimum: 0
        statuses:
          type: array
          maxItems: 8
          default: []
          items:
            type: string
          description: Terminal statuses (succeeded, failed, cancelled, interrupted).
        run_id:
          type: [string, "null"]
          minLength: 1
          maxLength: 64

    CleanupPreviewRequest:
      type: object
      additionalProperties: false
      required: [selector]
      properties:
        selector:
          $ref: "#/components/schemas/CleanupSelector"

    CleanupApplyRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
        selector:
          description: When given, it must equal the previewed selector.
          oneOf:
            - $ref: "#/components/schemas/CleanupSelector"
            - type: "null"

    CleanupItem:
      type: object
      additionalProperties: false
      required: [item, reason]
      properties:
        item:
          type: string
        reason:
          type: string

    CleanupPreviewEnvelope:
      type: object
      additionalProperties: false
      required: [status, preview]
      properties:
        status:
          type: string
          enum: [ok]
        preview:
          type: object
          additionalProperties: false
          required: [token, selector, expires_at, runs, skipped, warnings, totals]
          properties:
            token:
              type: string
            selector:
              type: object
              additionalProperties: false
              required: [older_than_days, statuses, run_id]
              properties:
                older_than_days:
                  type: [number, "null"]
                statuses:
                  type: array
                  items:
                    type: string
                run_id:
                  type: [string, "null"]
            expires_at:
              type: string
              format: date-time
            runs:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [run_id, status, finished_at, events, files]
                properties:
                  run_id:
                    type: string
                  status:
                    $ref: "#/components/schemas/RunStatus"
                  finished_at:
                    type: [string, "null"]
                  events:
                    type: integer
                  files:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [ref, bytes]
                      properties:
                        ref:
                          type: string
                        bytes:
                          type: integer
            skipped:
              type: array
              items:
                $ref: "#/components/schemas/CleanupItem"
            warnings:
              type: array
              items:
                type: string
            totals:
              type: object
              additionalProperties: false
              required: [runs, events, files, bytes]
              properties:
                runs:
                  type: integer
                events:
                  type: integer
                files:
                  type: integer
                bytes:
                  type: integer

    CleanupResultEnvelope:
      type: object
      additionalProperties: false
      required: [status, result]
      properties:
        status:
          type: string
          enum: [ok]
        result:
          type: object
          additionalProperties: false
          required:
            - runs_removed
            - events_removed
            - files_removed
            - bytes_removed
            - failed
            - skipped
          properties:
            runs_removed:
              type: integer
            events_removed:
              type: integer
            files_removed:
              type: integer
            bytes_removed:
              type: integer
            failed:
              type: array
              items:
                $ref: "#/components/schemas/CleanupItem"
            skipped:
              type: array
              items:
                $ref: "#/components/schemas/CleanupItem"

    # ── Templates ───────────────────────────────────────────────────────
    PipelineTemplate:
      type: object
      additionalProperties: false
      required: [name, title, description, standard_operation, document, outputs]
      properties:
        name:
          type: string
          enum: [ingestion, search, answer]
        title:
          type: string
        description:
          type: string
        standard_operation:
          type: string
          description: The Engine method the template reproduces.
        document:
          type: object
          description: Editable graph document; save it as a revision before a run.
        outputs:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, description]
            properties:
              name:
                type: string
              description:
                type: string

    PipelineTemplateList:
      type: object
      additionalProperties: false
      required: [status, templates]
      properties:
        status:
          type: string
          enum: [ok]
        templates:
          type: array
          items:
            $ref: "#/components/schemas/PipelineTemplate"

    # ── Experiment contexts ─────────────────────────────────────────────
    ExperimentError:
      type: object
      additionalProperties: false
      required: [status, code, message]
      description: >
        A refused experiment request. `code` is stable, for example
        `live_library_target`, `experiment_scope_mismatch`,
        `experiment_credential_required`, `experiment_context_unknown`,
        `experiment_context_revoked`, `action_not_permitted`,
        `commit_outside_context`, or a path check code such as
        `outside_root`, `traversal` or `symlink_escape`.
      properties:
        status:
          type: string
          enum: [error]
        code:
          type: string
        message:
          type: string
        context_id:
          type: [string, "null"]

    ExperimentRequest:
      type: object
      additionalProperties: false
      required: [workspace]
      properties:
        workspace:
          type: string
          minLength: 1
          maxLength: 4096
          description: Absolute path of an existing directory below an approved experiment root.
        name:
          type: string
          maxLength: 80
          default: ""
        actions:
          type: [array, "null"]
          minItems: 1
          maxItems: 2
          items:
            type: string
            enum: [read, ingest]
          description: Permitted actions. Omitted means both; `ingest` permits commit nodes.
        store_backend:
          type: string
          minLength: 1
          maxLength: 32
          default: lancedb
          description: "`chroma` (local) needs `store` in `declared_factors`."
        declared_factors:
          type: array
          maxItems: 8
          default: []
          items:
            type: string

    ExperimentRecord:
      type: object
      additionalProperties: false
      required:
        - context_id
        - name
        - root
        - workspace
        - output_dir
        - store_backend
        - declared_factors
        - actions
        - approved_at
        - revoked_at
        - status
      properties:
        context_id:
          type: string
        name:
          type: string
        root:
          type: string
        workspace:
          type: string
        output_dir:
          type: string
        store_backend:
          type: string
        declared_factors:
          type: array
          items:
            type: string
        actions:
          type: array
          items:
            type: string
        approved_at:
          type: string
          format: date-time
        revoked_at:
          type: [string, "null"]
          format: date-time
        status:
          type: string
          enum: [active, revoked]

    BackendIdentity:
      type: object
      additionalProperties: false
      required:
        - context_id
        - store_kind
        - store_path
        - embedding_provider
        - embedding_model
        - index_identity
      properties:
        context_id:
          type: [string, "null"]
        store_kind:
          type: string
        store_path:
          type: string
        embedding_provider:
          type: string
        embedding_model:
          type: string
        index_identity:
          type: string
          description: Short hash of the store location and embedding identity.

    ExperimentDetail:
      type: object
      additionalProperties: false
      required: [status, experiment, identity]
      properties:
        status:
          type: string
          enum: [ok]
        experiment:
          $ref: "#/components/schemas/ExperimentRecord"
        identity:
          $ref: "#/components/schemas/BackendIdentity"

    ExperimentCreated:
      type: object
      additionalProperties: false
      required: [status, experiment, identity, trust_notice]
      properties:
        status:
          type: string
          enum: [ok]
        experiment:
          $ref: "#/components/schemas/ExperimentRecord"
        identity:
          $ref: "#/components/schemas/BackendIdentity"
        trust_notice:
          type: string

    ExperimentList:
      type: object
      additionalProperties: false
      required: [status, roots, experiments, trust_notice]
      properties:
        status:
          type: string
          enum: [ok]
        roots:
          type: array
          items:
            type: string
        experiments:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [experiment, identity]
            properties:
              experiment:
                $ref: "#/components/schemas/ExperimentRecord"
              identity:
                $ref: "#/components/schemas/BackendIdentity"
        trust_notice:
          type: string

    ExperimentRevoked:
      type: object
      additionalProperties: false
      required: [status, experiment]
      properties:
        status:
          type: string
          enum: [ok]
        experiment:
          $ref: "#/components/schemas/ExperimentRecord"

    # ── Notebook plugins ────────────────────────────────────────────────
    PluginState:
      type: object
      additionalProperties: false
      required: [name, status, message, executable, version, launchable, display_name, tool]
      properties:
        name:
          type: string
        status:
          type: string
          enum: [compatible, incompatible, unchecked, needs_approval, unavailable]
        message:
          type: string
          description: What the operator can do next.
        executable:
          type: string
        version:
          type: [string, "null"]
        launchable:
          type: boolean
        display_name:
          type: [string, "null"]
        tool:
          type: [string, "null"]

    EditorInfo:
      type: object
      additionalProperties: false
      required: [launch_id, plugin, notebook, experiment_context, url_without_token]
      properties:
        launch_id:
          type: string
        plugin:
          type: string
        notebook:
          type: string
        experiment_context:
          type: [string, "null"]
        url_without_token:
          type: string
          description: Loopback editor URL. It never holds the access token.

    PluginList:
      type: object
      additionalProperties: false
      required: [status, plugins, editors, install_hint, trust_notice]
      properties:
        status:
          type: string
          enum: [ok]
        plugins:
          type: array
          items:
            $ref: "#/components/schemas/PluginState"
        editors:
          type: array
          items:
            $ref: "#/components/schemas/EditorInfo"
        install_hint:
          type: string
        trust_notice:
          type: string

    RegisterPluginRequest:
      type: object
      additionalProperties: false
      required: [manifest_path, executable_path, approved]
      properties:
        manifest_path:
          type: string
          minLength: 1
          maxLength: 4096
        executable_path:
          type: string
          minLength: 1
          maxLength: 4096
        approved:
          type: boolean
          description: Must be true. Registration is an explicit trust decision.

    PluginEnvelope:
      type: object
      additionalProperties: false
      required: [status, plugin]
      properties:
        status:
          type: string
          enum: [ok]
        plugin:
          $ref: "#/components/schemas/PluginState"
        trust_notice:
          type: string

    PluginUnregistered:
      type: object
      additionalProperties: false
      required: [status, name, unregistered]
      properties:
        status:
          type: string
          enum: [ok]
        name:
          type: string
        unregistered:
          type: boolean
          enum: [true]

    OpenEditorRequest:
      type: object
      additionalProperties: false
      required: [notebook, experiment_context, consent]
      properties:
        notebook:
          type: string
          minLength: 1
          maxLength: 1024
          description: Relative `.py` path inside the experiment workspace.
        experiment_context:
          type: string
          minLength: 1
          maxLength: 64
        consent:
          type: boolean
          description: Must be true. The notebook runs Python with your permissions.

    EditorOpened:
      type: object
      additionalProperties: false
      required:
        - status
        - launch_id
        - plugin
        - notebook
        - experiment_context
        - url_without_token
        - token_delivery
        - trust_notice
      properties:
        status:
          type: string
          enum: [ok]
        launch_id:
          type: string
        plugin:
          type: string
        notebook:
          type: string
        experiment_context:
          type: [string, "null"]
        url_without_token:
          type: string
        token_delivery:
          type: object
          additionalProperties: false
          required: [method, token]
          description: The editor access token, shown only in this response.
          properties:
            method:
              type: string
              enum: [response_body_once]
            token:
              type: string
        trust_notice:
          type: string

    EditorStopped:
      type: object
      additionalProperties: false
      required: [status, launch_id, stopped]
      properties:
        status:
          type: string
          enum: [ok]
        launch_id:
          type: string
        stopped:
          type: boolean
          enum: [true]
