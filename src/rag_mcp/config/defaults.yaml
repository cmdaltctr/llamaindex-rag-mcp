# Non-secret global defaults for the RAG MCP server.
#
# This file is loaded by the Settings resolver at a LOWER priority than
# environment variables and .env.  Override any value by setting the
# matching environment variable.
#
# SCHEMA (v2.0.0): subpackage settings are NESTED under their block; only
# cross-cutting settings stay flat at the top level.  Environment variables
# for nested keys use the "__" delimiter, e.g.
#     retrieval.top_k       -> RETRIEVAL__TOP_K
#     chunking.chunk_size   -> CHUNKING__CHUNK_SIZE
#     ingestion.embed_batch_size -> INGESTION__EMBED_BATCH_SIZE
#     metadata.extraction_mode   -> METADATA__EXTRACTION_MODE
#
# NEVER put API keys, tokens, passwords, or machine-specific absolute
# paths in this file — those belong in .env (gitignored).

# ── Chunking ──────────────────────────────────────────────────────────
chunking:
  chunk_size: 512
  chunk_overlap: 100
  markdown_chunk_size: 1024
  markdown_heading_prepend: false
  markdown_min_chunk_fraction: 0.0
  strategy_fallback: markdown

# ── Ingestion ─────────────────────────────────────────────────────────
# Moved out of `chunking` in v2.0.0: these are ingestion concerns and only
# lived under chunking because the flat schema had nowhere better.
ingestion:
  # 4 (was 2): promoted from .env, 2026-08-05. This is machine-
  # specific — raise on a bigger box, lower if the embedder throttles.
  embed_concurrency: 4
  embed_batch_size: 100

# ── Retrieval ─────────────────────────────────────────────────────────
retrieval:
  top_k: 10
  similarity_threshold: 0.0
  rerank_enabled: false
  rerank_enabled_for_semantic: true
  hard_technical_threshold: 0.3
  rerank_fetch_multiplier: 3
  rerank_max_fetch: 100
  rerank_model: cross-encoder/ms-marco-MiniLM-L-6-v2
  hybrid_enabled: false
  hybrid_rrf_k: 60
  hybrid_sparse_backend: bm25

# ── Metadata extraction ──────────────────────────────────────────────
metadata:
  extraction_mode: llamaindex
  taxonomy_mode: category
  ollama_classify_model: "qwen3:0.6b"
  classify_max_attempts: 3
  classify_timeout: 30.0
  # pipeline_timeout defaults to 180.0 in the settings model (not listed
  # here — same convention as the six per-provider overrides below).
  #
  # Six optional per-provider overrides for classify_timeout/pipeline_timeout
  # — llamacpp_classify_timeout_override, ollama_classify_timeout_override,
  # openrouter_classify_timeout_override, llamacpp_pipeline_timeout_override,
  # ollama_pipeline_timeout_override, openrouter_pipeline_timeout_override. Each defaults to
  # null (unset) and falls back to the shared value above; set one here or
  # via METADATA__<NAME> only on the machine that needs different tuning.

# ── Storage (cross-cutting, flat) ─────────────────────────────────────
CHROMA_PERSIST_DIR: ./chroma_db
COLLECTION_NAME: documents
CHROMA_SCAN_PAGE_SIZE: 10000

# ── Provider selection (two-tier) ─────────────────────────────────────
EMBED_PROVIDER: local
METADATA_LLM_PROVIDER: local
LOCAL_BACKEND: llamacpp
CLOUD_BACKEND: openrouter

# ── PDF reader ────────────────────────────────────────────────────────
PDF_READER: auto
LITEPARSE_OCR_ENABLED: false

# ── Codebase map ──────────────────────────────────────────────────────
MAGIKA_BINARY: magika
DOC_SIMILARITY_THRESHOLD: 0.85
CODEBASE_MAP_CACHE_DIR: .opencode
CODEBASE_MAP_MAX_FILES: 5000
CODEBASE_MAP_MAX_DEPTH: 10
# Community detection shared by codebase and document graphs.
# louvain = base install (default); leiden = optional community-leiden extra
# (startup fails with an installation instruction when the extra is absent).
COMMUNITY_ALGORITHM: louvain
# Seed for algorithm randomness; 0 keeps partitions deterministic.
COMMUNITY_SEED: 0

# ── Document backend ──────────────────────────────────────────────────
DOCUMENT_BACKEND: local
AZURE_DOC_INTELLIGENCE_MODEL: prebuilt-layout

# ── Profiles (Phase 4) ────────────────────────────────────────────────
# Server-wide default profile.  Individual collections override via
# metadata tags.  See config/profiles/ for the bundle YAMLs.
RAG_PROFILE: documents
