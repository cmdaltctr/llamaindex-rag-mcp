# Profile: Codebase Context (Use Case B)
#
# Optimised for fast retrieval of code understanding to assist coding
# agents (code review, refactoring, navigation).  Speed-first: the
# cross-encoder reranker is DISABLED (Experiment 10 showed it degrades
# Coverage@20 by 19-27% on identifier-heavy technical docs and adds
# ~14s latency per query), retrieval is hybrid (dense + BM25 + RRF for
# exact-match keyword coverage), and file_type taxonomy classifies by
# Magika-detected language.
#
# Bind a collection to this profile:
#   metadata={"profile": "codebase"}
#
# NEVER put API keys, tokens, or secrets in this file.

# Retrieval: speed-first for coding agents in the loop.
TOP_K: 20
RERANK_ENABLED: "false"
HYBRID_ENABLED: "true"

# Chunking fallback for ambiguous file types.
CHUNK_STRATEGY_FALLBACK: code

# Metadata taxonomy: file-type classification via Magika.
METADATA_TAXONOMY_MODE: file_type
