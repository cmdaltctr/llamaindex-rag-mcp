# Profile: Document Grounding (Use Case A)
#
# Optimised for pulling facts from research papers, financial statements,
# reports, and scientific PDFs.  Quality-first: the cross-encoder reranker
# is enabled (restoring ADR-018's balanced intent), retrieval is dense-only
# (no BM25 fusion needed for prose documents), and the category taxonomy
# from ADR-013 classifies content.
#
# This profile deliberately sets RERANK_ENABLED=true, differing from the
# global code default of false (flipped post-Experiment 10).  Experiment 10
# evaluated the reranker on a TECHNICAL/codebase workload (FreshStack
# LangChain docs) where it was harmful.  Document grounding is a semantic
# workload — the reranker's quality benefit applies here.  See ADR-030 for
# the full revalidation rationale.
#
# Bind a collection to this profile:
#   metadata={"profile": "documents"}
#
# NEVER put API keys, tokens, or secrets in this file.

# Retrieval: quality-first for document grounding.
TOP_K: 10
RERANK_ENABLED: "true"
HYBRID_ENABLED: "false"

# Chunking fallback for ambiguous file types (content-type dispatch still
# wins for known types like .py, .md, .yaml).
CHUNK_STRATEGY_FALLBACK: markdown

# Metadata taxonomy: ADR-013 hybrid category taxonomy.
METADATA_TAXONOMY_MODE: category
