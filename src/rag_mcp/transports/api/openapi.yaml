openapi: 3.1.0
info:
  title: RAG MCP REST API
  description: >
    REST transport contract for the LlamaIndex RAG MCP server.

    Maps HTTP endpoints to the same core operations that the MCP and CLI
    transports call. This is a contract-first document — no runtime HTTP
    code exists yet. The REST implementation is a separate follow-up
    OpenSpec change.

    ## Error Envelope

    All error responses use the same shape as the MCP error dict:
    ```json
    {"status": "error", "message": "..."}
    ```

    ## Long-Running Operations

    Ingestion and codebase-map generation are asynchronous (202 Accepted
    with a job resource). Poll via `GET /v1/jobs/{jobId}`.
  version: 1.0.0
  license:
    name: Apache-2.0

servers:
  - url: https://{host}/v1
    variables:
      host:
        default: localhost:8000
        description: API host (localhost for local-first deployment)

security:
  - bearerAuth: []

paths:
  # ── Ingest ───────────────────────────────────────────────────────────
  /ingestions:
    post:
      operationId: ingestPath
      summary: Index documents into the RAG store
      description: >
        Accepts a file path or directory path and indexes supported
        document formats (PDF, DOCX, Markdown, code, etc.) into the
        specified ChromaDB collection. This is a long-running operation —
        returns 202 Accepted with a job resource.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestRequest"
      responses:
        "202":
          description: Ingestion job accepted and queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  # ── Search ───────────────────────────────────────────────────────────
  /collections/{collection}/search:
    post:
      operationId: searchCollection
      summary: Semantic search over indexed documents
      description: >
        Returns the most relevant text chunks with source paths and
        relevance scores. Optionally re-scores with a cross-encoder
        reranker, fuses with sparse BM25 retrieval, or filters by metadata.
      parameters:
        - $ref: "#/components/parameters/CollectionName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SearchResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  # ── Grounded answering ───────────────────────────────────────────────
  /collections/{collection}/answer:
    post:
      operationId: answerCollection
      summary: Answer a question from retrieved evidence with citations
      description: >
        Retrieves evidence through the same profile-resolved path as
        search, then synthesises a grounded answer (one or more
        language-model completion calls). Citations are constructed
        deterministically from chunk lineage: every cited chunk_id
        re-fetches exactly one stored chunk. When retrieval finds
        nothing the response carries the no_evidence shape rather than
        an error; retrieval and generation failures are attributed
        separately via failure_stage.
      parameters:
        - $ref: "#/components/parameters/CollectionName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnswerRequest"
      responses:
        "200":
          description: Grounded answer result (including the no-evidence shape)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnswerResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  # ── List documents ───────────────────────────────────────────────────
  /collections/{collection}/documents:
    get:
      operationId: listDocuments
      summary: List indexed documents in a collection
      description: >
        Returns all documents currently indexed in the specified
        collection, with their source paths and chunk counts.
      parameters:
        - $ref: "#/components/parameters/CollectionName"
      responses:
        "200":
          description: Document list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DocumentInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteDocuments
      summary: Delete documents from a collection
      description: >
        Removes chunks by source file path, metadata filter, or drops
        the entire collection. Use dry_run=true to preview without
        modifying data.
      parameters:
        - $ref: "#/components/parameters/CollectionName"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteRequest"
      responses:
        "200":
          description: Deletion result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  # ── List collections ─────────────────────────────────────────────────
  /collections:
    get:
      operationId: listCollections
      summary: List all ChromaDB collections
      description: Returns all collections with document and chunk counts.
      responses:
        "200":
          description: Collection list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CollectionInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  # ── Codebase map ─────────────────────────────────────────────────────
  /codebase-maps:
    post:
      operationId: generateCodebaseMap
      summary: Generate a compact codebase map
      description: >
        Scans a project directory for file types, builds code and document
        graphs, detects communities and hubs, and returns a formatted text
        map. This is a long-running operation — returns 202 Accepted with
        a job resource.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CodebaseMapRequest"
      responses:
        "202":
          description: Codebase map job accepted and queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  # ── Change collection profile ────────────────────────────────────────
  /collections/{collection}/profile:
    patch:
      operationId: changeCollectionProfile
      summary: Change the profile bound to a collection
      description: >
        Profiles control retrieval behaviour: 'documents' (quality-first,
        reranker on, dense-only) or 'codebase' (speed-first, reranker off,
        hybrid). The change is non-destructive — existing chunks are NOT
        re-chunked or re-embedded.

        A request without `confirm: true` returns a preview response with
        impact details and `confirm_required: true`. A request with
        `confirm: true` applies the change.
      parameters:
        - $ref: "#/components/parameters/CollectionName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileChangeRequest"
      responses:
        "200":
          description: >
            Preview response (when confirm=false) or applied change
            confirmation (when confirm=true).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ProfilePreview"
                  - $ref: "#/components/schemas/ProfileChangeResult"
        "400":
          description: Invalid profile name or bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  # ── Job polling ──────────────────────────────────────────────────────
  /jobs/{jobId}:
    get:
      operationId: getJobStatus
      summary: Poll the status of an asynchronous job
      description: >
        Returns the current status of a long-running job (ingestion or
        codebase-map generation). Terminal states: `completed`, `failed`.
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Job status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Bearer token authentication (API key or JWT). The specific token
        type is resolved when the REST transport is implemented.

  parameters:
    CollectionName:
      name: collection
      in: path
      required: true
      schema:
        type: string
      description: ChromaDB collection name

  responses:
    BadRequest:
      description: Invalid request parameters or body
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or invalid authentication
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    # ── Error envelope (matches MCP error-dict shape) ──────────────────
    Error:
      type: object
      required:
        - status
        - message
      properties:
        status:
          type: string
          enum: [error]
        message:
          type: string
        error_type:
          type: string
          enum: [validation, retrieval, internal]
          description: Optional error category (used by search errors)

    # ── Ingest ─────────────────────────────────────────────────────────
    IngestRequest:
      type: object
      required:
        - path
      properties:
        path:
          type: string
          description: File or directory path to ingest
        collection:
          type: string
          default: documents
          description: Target ChromaDB collection

    # ── Search ─────────────────────────────────────────────────────────
    SearchRequest:
      type: object
      required:
        - query
      properties:
        query:
          type: string
          description: Natural language search query
        top_k:
          type: integer
          minimum: 1
          description: >
            Maximum results to return. Resolved from the collection profile
            when omitted.
        similarity_threshold:
          type: number
          minimum: 0.0
          maximum: 1.0
          description: >
            Minimum canonical dense similarity. Resolved from the collection
            profile when omitted. Hybrid/no-rerank applies it to dense
            evidence before RRF; successful reranking uses the calibrated
            reranker transform.
        rerank:
          type:
            - boolean
            - "null"
          description: >
            Tri-state rerank control: true (force on), false (force off),
            null (resolved from the collection profile when omitted).
        hybrid:
          type:
            - boolean
            - "null"
          description: >
            Fuse dense + sparse (BM25 + RRF). Resolved from the collection
            profile when omitted.
        expand_window:
          type: integer
          minimum: 0
          default: 0
          description: >
            Neighbours added per side of each retrieved chunk during
            context assembly (0 = no expansion, the default). Expanded
            neighbours merge into the retrieved chunk under the assembly
            merging rules and never displace retrieved rows.
        diagnostics:
          type: boolean
          default: false
          description: >
            When true, include core-produced retrieval diagnostics in each
            result row (rank diagnostics, rerank reason, sparse backend,
            per-stage timings, etc.). Diagnostics-only fields are optional
            on the response schema.
        metadata_filter:
          type:
            - object
            - "null"
          description: ChromaDB-compatible `where` clause for metadata filtering
          additionalProperties: true

    SearchResult:
      type: object
      required:
        - score
        - score_kind
        - source
        - text
        - reranked
        - metadata
        - source_id
        - source_version
        - chunk_id
        - source_chunk_index
        - source_chunk_count
      properties:
        score:
          type: number
          format: float
          description: >
            Relevance score. Absent on rows added purely by neighbour
            expansion (``expand_window`` > 0), which were never ranked.
        score_kind:
          type: string
          enum: [dense_similarity_v1, rrf_v1, reranker_sigmoid_v1]
          description: >
            Score semantics for ``score``. Absent on rows added purely by
            neighbour expansion, which carry no retrieval score.
        source:
          type: string
        page_label:
          type:
            - string
            - "null"
          description: >
            Page label when the configured reader observes page boundaries.
            Optional by contract (design D5): readers that return one
            document per file (pdf_inspector) genuinely cannot know the
            page, so the field is null there rather than fabricated.
        text:
          type: string
        reranked:
          type: boolean
        metadata:
          type: object
          description: >
            The full stored metadata mapping for the chunk, including
            file path, page label, and any extraction-produced fields.
          additionalProperties: true
        source_id:
          type:
            - string
            - "null"
          description: >
            Stable source identity derived from the canonical source path.
            Absent (null) for legacy rows stored without lineage metadata.
        source_version:
          type:
            - string
            - "null"
          description: >
            Content version stamp of the source at ingest time. Absent
            (null) for legacy rows.
        chunk_id:
          type:
            - string
            - "null"
          description: >
            Stable chunk identity within the source. Absent (null) for
            legacy rows.
        source_chunk_index:
          type:
            - integer
            - "null"
          description: >
            Zero-based ordinal of this chunk within its source. Absent
            (null) for legacy rows.
        source_chunk_count:
          type:
            - integer
            - "null"
          description: >
            Total chunk count of the source at ingest time. Absent (null)
            for legacy rows.
        chunk_ids:
          type: array
          items:
            type: string
          description: >
            The ``chunk_id`` of every constituent chunk of an assembled
            row, in ascending ``source_chunk_index`` order. Present only
            on rows the assembly stage merged from multiple adjacent
            chunks; unmerged rows keep the plain ``chunk_id`` key and gain
            nothing. Each listed id is a stable per-chunk reference that
            resolves to exactly one stored chunk, so citations remain
            verifiable after merging. Optional by contract: absent means
            the row is a single chunk.
        # ── Diagnostics-only fields (present when diagnostics=true) ──────
        id:
          type: string
          description: Internal row identifier (diagnostics only).
        fused_score:
          type: number
          format: float
          description: RRF fused score (diagnostics only, hybrid queries).
        dense_score:
          type: number
          format: float
          description: Canonical dense similarity score (diagnostics only).
        dense_score_kind:
          type: string
          description: Score kind of the dense evidence (diagnostics only).
        dense_rank:
          type:
            - integer
            - "null"
          description: Rank in the dense ranking (diagnostics only, hybrid).
        sparse_rank:
          type:
            - integer
            - "null"
          description: Rank in the sparse ranking (diagnostics only, hybrid).
        fused_rank:
          type:
            - integer
            - "null"
          description: Rank after RRF fusion (diagnostics only, hybrid).
        rerank_reason:
          type: string
          description: >
            Policy or failure reason explaining the rerank decision
            (diagnostics only).
        threshold_score_kind:
          type: string
          description: >
            Score semantics used for threshold evaluation (diagnostics only).
        rerank_backend:
          type: string
          description: >
            Backend that actually served the rerank (e.g. onnx, torch).
            Present only when the reranker ran (diagnostics only).
        sparse_backend:
          type: string
          description: >
            Sparse backend that actually served the hybrid query (e.g.
            bm25, native). Present only for hybrid queries (diagnostics only).
        assembly_merged:
          type: boolean
          description: >
            Whether the assembly stage merged this row from multiple
            adjacent chunks (diagnostics only).
        assembly_chunk_count:
          type: integer
          minimum: 1
          description: >
            Number of constituent chunks this row was assembled from
            (diagnostics only; 1 for unmerged rows).
        assembly_expanded:
          type: boolean
          description: >
            Whether the row was added purely by neighbour expansion and
            was never ranked — such rows carry no retrieval score
            (diagnostics only).
        norm_guard:
          type: object
          description: >
            Embedding norm-guard state dict. Present only when the norm
            guard is enabled (diagnostics only).
          additionalProperties: true
        timings:
          type: object
          description: >
            Per-stage retrieval wall-clock durations in seconds, attached
            to each result row when diagnostics are enabled. Keys are
            stage names (``embedding_seconds``, ``dense_seconds``,
            ``sparse_seconds``, ``fusion_seconds``, ``rerank_seconds``,
            ``assembly_seconds``).
            A stage that did not run is absent — absence means "did not
            execute", never "took zero time". Per-stage durations do not
            sum to wall time in hybrid mode because dense and sparse run
            concurrently. No total is emitted (diagnostics only).
          additionalProperties:
            type: number
            format: float

    # ── Document info ──────────────────────────────────────────────────
    AnswerRequest:
      type: object
      required:
        - query
      properties:
        query:
          type: string
          maxLength: 4096
          description: Natural language question to answer.
        top_k:
          type:
            - integer
            - "null"
          minimum: 1
          maximum: 100
          description: >
            Maximum chunks to use as evidence. Resolved from the
            collection profile when omitted.
        similarity_threshold:
          type:
            - number
            - "null"
          format: float
          minimum: 0
          maximum: 1
          description: Minimum evidence score (0.0 = no filtering).
        rerank:
          type:
            - boolean
            - "null"
          description: >
            Re-score evidence with the cross-encoder reranker. Resolved
            from the collection profile when omitted.
        hybrid:
          type:
            - boolean
            - "null"
          description: >
            Fuse dense + sparse retrieval. Resolved from the collection
            profile when omitted.
        expand_window:
          type: integer
          minimum: 0
          maximum: 10
          default: 0
          description: >
            Neighbours merged into each evidence chunk during context
            assembly.
        metadata_filter:
          type:
            - object
            - "null"
          description: ChromaDB-compatible `where` clause for evidence filtering
          additionalProperties: true

    AnswerResponse:
      type: object
      required:
        - status
        - query
        - answer
        - citations
        - evidence
        - failure_stage
        - error
        - completion_source
      properties:
        status:
          type: string
          enum: [ok, no_evidence, generation_unverified, unverified_claims, error]
          description: >
            ok = grounded answer with at least one valid citation.
            no_evidence = retrieval found nothing (no model call made).
            generation_unverified = answer text present but no valid
            citation; the evidence is still returned. unverified_claims =
            claim verification (ANSWER__VERIFY_CLAIMS, ADR-059) found one
            or more cited claims unsupported by their evidence; the
            answer, citations, and evidence are retained and the failing
            claims are listed. error = see failure_stage and error.
        query:
          type: string
        answer:
          type:
            - string
            - "null"
          description: >
            The synthesised answer text (null for no_evidence, retrieval
            failure, and provider-absent errors).
        citations:
          type: array
          items:
            $ref: "#/components/schemas/AnswerCitation"
          description: >
            Deterministic citations built from supplied chunk lineage.
            Empty for no_evidence; a substantive answer with no valid
            citation yields an empty list and status
            generation_unverified.
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/AnswerEvidence"
          description: >
            Every chunk supplied as context, retained even on generation
            failure so the caller keeps the evidence.
        failure_stage:
          type:
            - string
            - "null"
          enum: [retrieval, generation, null]
          description: >
            Which stage failed (null unless status is error). retrieval =
            the language model was never called.
        error:
          type:
            - string
            - "null"
          description: >
            Actionable message; the provider-absent case names the
            configuration to set.
        completion_source:
          type: string
          description: >
            Which model completed the answer: server, client_mrtr,
            client_legacy, or none.
        diagnostics:
          $ref: "#/components/schemas/AnswerDiagnostics"
          description: >
            Present only when diagnostics were requested.
        verified:
          type: boolean
          description: >
            Present only when claim verification ran and every cited
            claim passed the judge (ADR-059). Absent when verification
            is disabled or skipped.
        unverified_claims:
          type: array
          items:
            type: object
            required: [claim, verdict, ordinals]
            properties:
              claim:
                type: string
                description: The failing claim text (citation markers stripped).
              verdict:
                type: string
                enum: [unsupported, unparseable]
                description: unsupported = the evidence contradicts or omits the claim; unparseable = the judge reply could not be read (never silently passed).
              ordinals:
                type: array
                items:
                  type: integer
                  minimum: 1
                description: The evidence ordinals the claim cited.
          description: >
            Present only when status is unverified_claims — the cited
            claims that failed verification. The answer, citations, and
            evidence are all retained.
        verification_skipped:
          type: string
          description: >
            Present only when claim verification was enabled but could
            not run (provider unavailable, call failure, or every
            verdict unparseable). Names the reason; the referential-only
            ok guarantee is retained.

    AnswerCitation:
      type: object
      required:
        - ordinal
        - chunk_id
        - chunk_ids
        - source_id
        - source_version
        - source
        - source_chunk_index
      properties:
        ordinal:
          type: integer
          minimum: 1
          description: The 1-based supplied-source number the model cited.
        chunk_id:
          type:
            - string
            - "null"
          description: >
            The merged row's representative chunk id; re-fetches exactly
            one stored chunk by metadata filter.
        chunk_ids:
          type: array
          items:
            type: string
          description: >
            Every constituent chunk id when context assembly merged
            rows; a single-element list otherwise.
        source_id:
          type:
            - string
            - "null"
        source_version:
          type:
            - string
            - "null"
        source:
          type:
            - string
            - "null"
        source_chunk_index:
          type:
            - integer
            - "null"
        score:
          type:
            - number
            - "null"
          format: float
        score_kind:
          type:
            - string
            - "null"

    AnswerEvidence:
      type: object
      description: >
        One chunk supplied as context — the citation lineage plus the
        ordinal it was labelled with in the prompt and the chunk text.
      required:
        - ordinal
        - chunk_id
        - chunk_ids
        - source_id
        - source_version
        - source
        - source_chunk_index
        - text
      properties:
        ordinal:
          type: integer
          minimum: 1
          description: >
            The 1-based position of this chunk in the supplied context;
            the number citations refer to.
        chunk_id:
          type:
            - string
            - "null"
        chunk_ids:
          type: array
          items:
            type: string
        source_id:
          type:
            - string
            - "null"
        source_version:
          type:
            - string
            - "null"
        source:
          type:
            - string
            - "null"
        source_chunk_index:
          type:
            - integer
            - "null"
        score:
          type:
            - number
            - "null"
          format: float
        score_kind:
          type:
            - string
            - "null"
        text:
          type: string

    AnswerDiagnostics:
      type: object
      required:
        - retrieval_ms
        - generation_ms
        - completion_calls
      properties:
        retrieval_ms:
          type: number
          format: float
          description: Duration of the retrieval stage in milliseconds.
        generation_ms:
          type: number
          format: float
          description: Duration of the generation stage in milliseconds.
        completion_calls:
          type: integer
          minimum: 0
          description: >
            Number of language-model completion rounds made (bounded by
            the answer configuration).
        verification_ms:
          type: number
          format: float
          description: >
            Duration of the claim-verification stage in milliseconds
            (ADR-059). Present only when the stage ran.
        verification_calls:
          type: integer
          minimum: 0
          description: >
            Judge completions made, one per cited claim. Present only
            when the stage ran; reported separately from
            completion_calls.

    DocumentInfo:
      type: object
      properties:
        source:
          type: string
        source_id:
          type:
            - string
            - "null"
          description: >
            Stable identity derived from the canonical source path. Absent
            (null) for legacy rows grouped by display path.
        chunks:
          type: integer
        orphaned:
          type:
            - boolean
            - "null"
          description: >
            Tri-state machine-local orphan status: true (source file missing
            on this machine), false (source file present), null (cannot
            determine — the source path is not an absolute path on this
            machine). This is machine-local, not a global property of the
            document.

    # ── Collection info ────────────────────────────────────────────────
    CollectionInfo:
      type: object
      properties:
        name:
          type: string
        document_count:
          type: integer
        chunk_count:
          type: integer

    # ── Delete ─────────────────────────────────────────────────────────
    DeleteRequest:
      type: object
      properties:
        path:
          type:
            - string
            - "null"
          description: Source file path to delete chunks for
        metadata_filter:
          type:
            - object
            - "null"
          description: ChromaDB `where` clause for metadata-based deletion
          additionalProperties: true
        dry_run:
          type: boolean
          default: false
          description: Preview without modifying data

    DeleteResult:
      type: object
      properties:
        status:
          type: string
        mode:
          type: string
          enum: [path, metadata, collection]
        collection:
          type: string
        chunks_removed:
          type: integer
        would_delete:
          type: integer
          description: Present only in dry-run mode

    # ── Codebase map ───────────────────────────────────────────────────
    CodebaseMapRequest:
      type: object
      required:
        - path
      properties:
        path:
          type: string
          description: Project directory path
        refresh:
          type: boolean
          default: false
          description: Force rebuild regardless of cache

    # ── Profile change ─────────────────────────────────────────────────
    ProfileChangeRequest:
      type: object
      required:
        - profile
      properties:
        profile:
          type: string
          enum: [documents, codebase]
          description: Target operational profile
        confirm:
          type: boolean
          default: false
          description: >
            When false, returns a preview. When true, applies the change.

    ProfilePreview:
      type: object
      properties:
        status:
          type: string
          enum: [preview]
        contract:
          type: object
          properties:
            collection:
              type: string
            target_profile:
              type: string
            old_profile:
              type:
                - string
                - "null"
            chunk_count:
              type: integer
            lever_impacts:
              type: array
              items:
                type: object
                properties:
                  lever:
                    type: string
                  change:
                    type: string
                  timing:
                    type: string
                    enum: [query-time, ingest-time]
            reingest_pointer:
              type: string
        confirm_required:
          type: boolean
          enum: [true]

    ProfileChangeResult:
      type: object
      properties:
        status:
          type: string
        collection:
          type: string
        profile:
          type: string
        chunk_count_unchanged:
          type: integer

    # ── Job resource (long-running operations) ─────────────────────────
    Job:
      type: object
      required:
        - job_id
        - status
      properties:
        job_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued, running, completed, failed]
          description: Current job state
        result:
          type:
            - object
            - "null"
          description: Result payload (present when status is completed)
        error:
          type:
            - string
            - "null"
          description: Error message (present when status is failed)
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
