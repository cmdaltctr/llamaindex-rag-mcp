        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      operationId: deleteChatFolder
      summary: Delete a folder and its chats
      description: >
        Deletes the folder and every chat inside it. The delete is permanent.
      security:
        - sessionCookie: [manage]
      x-omrs-scopes: [manage]
      parameters:
        - $ref: "#/components/parameters/ChatFolderId"
      responses:
        "200":
          description: Folder deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatDeleteCounts"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # ── Experiment contexts (session only) ──────────────────────────────
  /experiments:
    post:
      operationId: createExperiment
      summary: Approve an experiment workspace below an approved experiment root
      description: >
        The workspace must be an existing directory below a root that the
        operator approved with `omrs web --experiment-root`. The context
        store sits below `<workspace>/output/` (LanceDB unless `store` is a
        declared factor). Nothing is built until the first admitted run. A
        path check failure gives 400 with a stable `code`. A server started
        without an experiment root gives 409. Contexts last for one launch.
      security:
        - sessionCookie: [manage]
      x-omrs-scopes: [manage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExperimentRequest"
      responses:
        "201":
          description: Context approved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExperimentCreated"
        "400":
          $ref: "#/components/responses/ExperimentRefused"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    get:
      operationId: listExperiments
      summary: List the approved experiment roots, their folder trees and contexts
      description: >
        `folders` holds one directory tree for each approved root. A node
        with a `context_id` is a registered workspace and has no children.
        A node with no `context_id` and no children is an empty folder.
        Hidden directories, links and levels below four are not scanned, and
        a registered workspace is always listed.
      security:
        - sessionCookie: [manage]
      x-omrs-scopes: [manage]
      responses:
        "200":
          description: Roots and contexts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExperimentList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /experiment-folders:
    post:
      operationId: createExperimentFolder
      summary: Create a folder below an approved experiment root
      description: >
        Creates a directory. `path` is relative to the root, has one to four
        segments separated by `/`, and no `..` part. A segment starts with a
        letter or digit and uses letters, digits, `.`, `_`, `-` and single
        spaces (at most 80 characters, and not `output`). No path part may be
        a symbolic link. A refused path gives 400 with a stable `code`
        (`traversal`, `not_relative`, `too_deep`, `invalid_name`,
        `symlink_escape`, `not_a_directory`, `root_unknown`,
        `root_required`) and creates nothing. A folder that exists gives 409
        with `code: exists`. A server started without an experiment root
        gives 409. `root` names an approved root and is needed only when
        more than one root is approved. To register a sub-experiment in the
        folder, send its `workspace` to `POST /v1/experiments`.
      security:
        - sessionCookie: [manage]
      x-omrs-scopes: [manage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExperimentFolderRequest"
      responses:
        "201":
          description: Folder created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExperimentFolderCreated"
        "400":
          $ref: "#/components/responses/ExperimentRefused"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/ExperimentRefused"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /experiments/{context_id}:
    get:
      operationId: getExperiment
      summary: Return one approval record with its backend and index identity
      security:
        - sessionCookie: [manage]
      x-omrs-scopes: [manage]
      parameters:
        - $ref: "#/components/parameters/ContextId"
      responses:
        "200":
          description: The context.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExperimentDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ExperimentRefused"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      operationId: revokeExperiment
      summary: Revoke an experiment context
      description: >
        Later admissions fail with `experiment_context_revoked`. A queued
        run fails before its Engine runs. A run that already started
        finishes; cancel it with `POST /v1/runs/{run_id}/cancel`. Bound
        credentials stay valid but cannot run anything. Workspace files
        are not touched.
      security:
        - sessionCookie: [manage]
      x-omrs-scopes: [manage]
      parameters:
        - $ref: "#/components/parameters/ContextId"
      responses:
        "200":
          description: Context revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExperimentRevoked"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ExperimentRefused"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # ── Notebook plugins (session only) ─────────────────────────────────
  /plugins:
    get:
      operationId: listPlugins
      summary: List plugin registrations and running editors
      description: Runs no process. With no registration, `install_hint` says what to do.
      security:
        - sessionCookie: [plugins]
      x-omrs-scopes: [plugins]
      responses:
        "200":
          description: Plugin states and editors.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      operationId: registerPlugin
      summary: Register an approved manifest and executable
      description: >
        An explicit trust decision (`approved: true`). The manifest must be
        the shipped marimo manifest or a file below `<workspace>/plugins/`.
        The executable must sit in a directory of the server's `PATH` or
        below `<workspace>/plugins/`, and its file name must be the
        manifest's executable name. Registration runs no process; run a
        recheck before an editor opens.
      security:
        - sessionCookie: [plugins]
      x-omrs-scopes: [plugins]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterPluginRequest"
      responses:
        "201":
          description: Plugin registered (status `unchecked`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /plugins/{name}:
    delete:
      operationId: unregisterPlugin
      summary: Remove a plugin registration
      description: Stop the plugin's editors first (else 409). No file is touched.
      security:
        - sessionCookie: [plugins]
      x-omrs-scopes: [plugins]
      parameters:
        - $ref: "#/components/parameters/PluginName"
      responses:
        "200":
          description: Registration removed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginUnregistered"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /plugins/{name}/recheck:
    post:
      operationId: recheckPlugin
      summary: Probe the registered executable for version and capabilities
      description: Runs only the manifest probe recipe. Never installs or updates the tool.
      security:
        - sessionCookie: [plugins]
      x-omrs-scopes: [plugins]
      parameters:
        - $ref: "#/components/parameters/PluginName"
      responses:
        "200":
          description: Plugin state after the probe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /plugins/{name}/editors:
    post:
      operationId: openPluginEditor
      summary: Open a notebook in a separate local editor after consent
      description: >
        Needs `consent: true`, an active experiment context and a notebook
        path relative to that context's workspace. The host rechecks the
        plugin, binds the editor to loopback, and passes a new access token
        in a private file. The response carries that token once
        (`token_delivery.token`); the URL never holds it and it is never
        logged. Notebook Python runs with the user's filesystem and network
        permissions.
      security:
        - sessionCookie: [plugins]
      x-omrs-scopes: [plugins]
      parameters:
        - $ref: "#/components/parameters/PluginName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenEditorRequest"
      responses:
        "201":
          description: Editor started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditorOpened"
        "400":
          $ref: "#/components/responses/ExperimentRefused"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /plugin-editors/{launch_id}:
    delete:
      operationId: stopPluginEditor
      summary: Stop an owned editor
      description: Graceful stop first, then bounded escalation. Notebook files stay.
      security:
        - sessionCookie: [plugins]
      x-omrs-scopes: [plugins]
      parameters:
        - $ref: "#/components/parameters/LaunchId"
      responses:
        "200":
          description: Editor stopped.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditorStopped"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # ── MCP over HTTP and the saved port ────────────────────────────────
  /mcp:
    get:
      operationId: getMcpState
      summary: Read whether MCP over HTTP is on
      description: >
        Returns the switch, the full `/mcp` address on the bound host and
        port, and whether a token exists. The token value is never returned.
        The MCP endpoint itself (`/mcp`, outside `/v1`) speaks streamable HTTP
        MCP. It is off until `PUT /v1/mcp` turns it on. Each request needs
        `Authorization: Bearer omrs_mcp_<secret>` and no foreign `Origin`.
        A request to a switched-off endpoint gets 404, a foreign `Origin` 403
        and a missing or wrong token 401, checked in that order.
      security:
        - sessionCookie: [read]
        - bearerToken: [read]
      x-omrs-scopes: [read]
      responses:
        "200":
          description: The current state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpState"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    put:
      operationId: setMcpEnabled
      summary: Turn MCP over HTTP on or off
      description: >
        The value is written to `mcp_http_enabled` in `omrs.jsonc`, then applied
        without a restart. A hand edit of the file also applies at the next request.
        Turning it off ends open sessions at their next request. The body may carry
        the `revision` last read; a stale one gives 409.
      security:
        - sessionCookie: [manage]
      x-omrs-scopes: [manage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/McpEnabledRequest"
      responses:
        "200":
          description: The stored state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpState"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /mcp/token:
    post:
      operationId: rotateMcpToken
      summary: Create or rotate the MCP token
      description: >
        Replaces any existing token in one transaction. The token is shown
        once, in this response. Only its SHA-256 digest is stored. The token
        works on `/mcp` only: every `/v1` route refuses it.
      security:
        - sessionCookie: [credentials]
      x-omrs-scopes: [credentials]
      responses:
        "201":
          description: Token created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpTokenCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      operationId: revokeMcpToken
      summary: Revoke the MCP token
      description: Clients that hold the token get 401 at their next request.
      security:
        - sessionCookie: [credentials]
      x-omrs-scopes: [credentials]
      responses:
        "200":
          description: Token revoked, or none existed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpTokenRevoked"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /settings/web-port:
    get:
      operationId: getWebPort
      summary: Read the file port and the bound web port
      description: >
        `saved` is `web_port` in `omrs.jsonc`; it is used at the next launch when
        `--port` is not given. `bound` is the port this server listens on now.
        `differs` is true when the file holds a port other than the bound one.
      security:
        - sessionCookie: [read]
        - bearerToken: [read]
      x-omrs-scopes: [read]
      responses:
        "200":
          description: The ports.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebPortState"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    put:
      operationId: setWebPort
      summary: Save or clear the port for later launches
      description: >
        Writes `web_port` to `omrs.jsonc`. Accepts 1024 to 65535, or `null` to clear;
        any other value gives 400 with the range. The running server does not rebind.
        The body may carry the `revision` last read; a stale one gives 409.
      security:
        - sessionCookie: [manage]
      x-omrs-scopes: [manage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebPortRequest"
      responses:
        "200":
          description: The ports after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebPortState"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /settings/upload-limit:
    get:
      operationId: getUploadLimit
      summary: Read the per-file upload limit in force and its range
      description: >
        `max_bytes` is the limit in force. `source` is `launch` when
        `--max-upload-mib` or `WEB_MAX_UPLOAD_MIB` set it, `config-file` when
        `web_max_upload_mib` in `omrs.jsonc` applies, and `default` otherwise.
        A hand edit of the file applies to new uploads at the next request.
      security:
        - sessionCookie: [read]
        - bearerToken: [read]
      x-omrs-scopes: [read]
      responses:
        "200":
          description: The upload limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadLimitState"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    put:
      operationId: setUploadLimit
      summary: Save or clear the per-file upload limit
      description: >
        Accepts a whole number of MiB from 1 to 2048, or `null` to return to
        the default; any other value gives 400 with the range. The server writes
        `web_max_upload_mib` to `omrs.jsonc` first and then applies it to
        new uploads at once. The body may carry the `revision` last read; a stale
        one gives 409. An upload in progress keeps the limit it
        started with. A body that is not valid gets 400. When a launch
        option set the limit, the request gets 409 and nothing changes.
      security:
        - sessionCookie: [manage]
      x-omrs-scopes: [manage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadLimitRequest"
      responses:
        "200":
          description: The upload limit after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadLimitState"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: A launch option set the limit. Nothing changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # ── Integrations (read) ──────────────────────────────────────────────
  /integrations:
    get:
      operationId: listIntegrations
      summary: List the installable integrations with their availability
      description: >
        Returns one entry for each installable extra (chroma, hybrid,
        pdf-pypdfium2, pdf-inspector, community-leiden, azure, llamacpp,
        openrouter, anthropic, torch, web) and for the always-on magika
        integration. `availability` comes from the probes of the running
        server, so it describes this launch only. A probe that fails gives
        `unknown`; no probe text is returned. `restart-needed` means an
        install from the app succeeded in this launch. `install_type` says
        how the server is installed and decides `install_command`. An entry
        with `installable` true can be installed with
        `POST /v1/integrations/{extra}/install`; otherwise `install_reason`
        says why not, and the user runs `install_command` outside the app
        and restarts the server.
      security:
        - sessionCookie: [read]
        - bearerToken: [read]
      x-omrs-scopes: [read]
      responses:
        "200":
          description: The catalogue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /integrations/install:
    get:
      operationId: getIntegrationInstall
      summary: Read the state of the running or last integration install
      description: >
        Returns `idle` when no install ran in this launch, else the state of
        the running or last install with its extra, start and end times and
        at most the last 40 lines of output. The output is redacted: it never
        holds an API key or a value from the settings secrets. The state is
        kept in memory, so a restart returns `idle`. Session only: a bearer
        credential gets 403.
      security:
        - sessionCookie: [manage]
      x-omrs-scopes: [manage]
      responses:
        "200":
          description: The install state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationInstallReply"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /integrations/{extra}/install:
    post:
      operationId: installIntegration
      summary: Install an allowed optional extra into the server's own environment
      description: >
        Starts `uv pip install --python <server Python> <requirements>` with
        the requirements the installed OMRS package declares for `extra`. The
        argument list is built by the server; no request text reaches it
        other than the choice of a listed extra. Only one install runs at a
        time and it stops after 600 s (state `failed`, reason `timed-out`).
        The route answers 202 with the running state; poll
        `GET /v1/integrations/install`. After success the entry reports
        `restart-needed` until the server restarts. An extra that is not in
        the catalogue gets 404. Every refusal of a listed extra gets 409 with
        `reason`: `not-installable-here` (`web`, `torch` or an entry without
        an extra), `not-uv-tool`, `uv-not-found`, `already-installed`,
        `no-requirements` or `install-running`. Session only: a bearer
        credential gets 403.
      security:
        - sessionCookie: [manage]
      x-omrs-scopes: [manage]
      parameters:
        - name: extra
          in: path
          required: true
          schema:
            type: string
            maxLength: 64
      responses:
        "202":
          description: The install started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationInstallReply"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # ── Provider connections (cards, saved addresses and keys, tests, model lists) ──
  /connections:
    get:
      operationId: getConnections
      summary: Read the provider cards from the server settings
      description: >
        Returns `config_dir`, the working directory whose `.env` the
        settings read, `user_config_dir` (the read-only user config folder), `keychain` (`available` or `unavailable`) and one
        entry for each provider in the LLM provider registry, in
        registration order. An entry has the display name, `locality`,
        `installed` with an `install_hint`, the editable `fields`, the
        `read_only` values and the `roles` that use the provider. Roles
        follow the startup rules: `embeddings`, `answers` (when answering
        is enabled), `metadata` and `verification`. A field holds its
        `source` (`env`, `dotenv`, `config-file`, `keychain`, `key-file`, `default` or
        `none`), whether
        it is `locked` and why. Only `env` and `dotenv` lock a field. A key field holds
        `set`, `state` and the last four characters only when the key has 16 or
        more characters. The key value is never returned. `revision` is the stamp of
        `omrs.jsonc` at this read; a save sends it back. This route sends
        no request to any provider.
      security:
        - sessionCookie: [read]
        - bearerToken: [read]
      x-omrs-scopes: [read]
      responses:
        "200":
          description: The summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /connections/{provider}:
    put:
      operationId: saveProviderFields
      summary: Save or clear provider addresses
      description: >
        Body `{fields: {<id>: address or null}}`. An address is an absolute `http` or
        `https` URL with a host, at most 2,048 characters, with no user name, password,
        query or fragment; `null` clears the value. The values go to `omrs.jsonc`; the
        file is written first, then the running Engine takes them. If the Engine refuses,
        the previous file content returns and the route answers 409. The body may carry
        the `revision` last read; a stale one gives 409 "omrs.jsonc changed on disk. Reload
        to see the new values." and nothing is written. 400 for a bad address (the message
        names the rule, not the value), 404 for an unknown provider or field, 409 for a
        field set by the environment or `.env`, or locked by the embeddings role. The
        answer carries the new `revision`.
      security:
        - sessionCookie: [manage]
      x-omrs-scopes: [manage]
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z][a-z0-9_-]{0,63}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveProviderFieldsRequest"
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderSaved"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /connections/{provider}/key:
    put:
      operationId: saveProviderKey
      summary: Save a provider API key to the system keychain
      description: >
        Body `{api_key}` of 8 to 512 printable characters with no spaces. The key joins
        the redaction set before the keychain sees it, then goes to the system keychain
        under the service `omrs`, and `keychain://<provider>` goes to `omrs.jsonc` as the
        key reference (it replaces an `env://` or `file://` reference; a key file is never
        changed). No file holds the key. 409 when the key comes from the environment or
        `.env`, no usable keychain exists, or `omrs.jsonc` changed since the `revision` in
        the body. A bearer credential never passes. The response never holds the key.
      security:
        - sessionCookie: [credentials]
      x-omrs-scopes: [credentials]
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z][a-z0-9_-]{0,63}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveProviderKeyRequest"
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderSaved"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      operationId: removeProviderKey
      summary: Remove a provider API key from the system keychain
      description: >
        Removes the key from the system keychain and the `keychain://` reference from
        `omrs.jsonc`. Another reference (`env://`, `file://`) stays. The optional body
        `{revision}` guards against a hand edit; a stale one gives 409. 409 also when the
        key comes from the environment or `.env`, or no usable keychain exists.
      security:
        - sessionCookie: [credentials]
      x-omrs-scopes: [credentials]
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z][a-z0-9_-]{0,63}$"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderRevisionRequest"
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderSaved"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /connections/{provider}/test:
    post:
      operationId: testConnection
      summary: Send one request to a provider
      description: >
        Ollama `GET /api/tags`, llama.cpp `GET /models` on each configured address,
        OpenRouter `GET /key` with the key. Optional body `{fields: {<id>: value}}`
        tests typed values; nothing is saved. Each request has a 5-second timeout and
        is not redirected. The result holds `reachable` and a `reason`: `null` when
        reachable, else `refused`, `timeout`, `unauthorised`, `http-<status>` or
        `not-configured`. Response bodies and exception text are never returned. A typed
        address that breaks the address rule gives 400 and sends no request.
      security:
        - sessionCookie: [manage]
      x-omrs-scopes: [manage]
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z][a-z0-9_-]{0,63}$"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FieldValuesRequest"
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionTestResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /connections/{provider}/models:
    post:
      operationId: listProviderModels
      summary: List the model names of a provider
      description: >
        Sends one model-list request (5-second limit, no redirect). Optional body
        `{fields: {<id>: value}}` uses typed values; nothing is saved. Reads at most 8
        MiB of the body and returns only names: at most 1,000, sorted, each 1 to 200
        printable characters. `truncated` is true when the list was cut. A failure
        returns the reasons of the connection test with an empty list.
      security:
        - sessionCookie: [manage]
      x-omrs-scopes: [manage]
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z][a-z0-9_-]{0,63}$"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FieldValuesRequest"
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderModels"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # ── Managed llama.cpp server (started and owned by omrs web) ────────
  /llamacpp/server:
    get:
      operationId: getLlamacppServer
      summary: Read the state of the llama.cpp server that omrs owns
      description: >
        Returns the `state` (`stopped`, `starting`, `running` or `failed`), a
        `reason` from a fixed set when the state is `failed`, the `exit_code`
        when the process ended, `running_with` (the context window and model
        kind the process started with), `pending_restart` (the saved program,
        model or window differ from the running process) and the `saved`
        program, model and context window with their source and lock. The
        route never returns the log file or any text of the process.
      security:
        - sessionCookie: [read]
        - bearerToken: [read]
      x-omrs-scopes: [read]
      responses:
        "200":
          description: The state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LlamacppServerStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    put:
      operationId: saveLlamacppServer
      summary: Save the program, the model and the context window
      description: >
        Body keys `binary`, `model`, `context_window` and `idle_sleep`, all optional; a key
        that is absent stays as it is and `null` clears the saved value. No other
        key is accepted. The program must be an absolute path to an executable
        file named exactly `llama-server`, both as given and after links are
        resolved. The model must be an absolute path to an existing `.gguf`
        file or a Hugging Face id `org/name[:tag]`, and never starts with `-`.
        The context window is a whole number from 2,048 to 262,144. The idle
        sleep is a whole number of seconds from 0 to 86,400; 0 sends no
        `--sleep-idle-seconds` flag. 400 names
        the rule and never the value. Changing the program or the model needs
        the `credentials` scope of the browser session; 403 otherwise. 409 for
        a field set by the environment or `.env`, or when `omrs.jsonc` changed since the
        `revision` in the body. The values are written to `omrs.jsonc`. A running server
        keeps running.
      security:
        - sessionCookie: [manage]
      x-omrs-scopes: [manage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveLlamacppServerRequest"
      responses:
        "200":
          description: Saved. The body is the new state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LlamacppServerStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /llamacpp/server/start:
    post:
      operationId: startLlamacppServer
      summary: Start the llama.cpp server with the saved values
      description: >
        Checks the program, the model and the chat address again, then starts
        one process with a fixed argument list (`-m` or `-hf`, `--host
        127.0.0.1`, `--port`, `-c`). The port is the port of
        `llamacpp_chat_url`, which must be a loopback `http` URL. Returns at
        once with state `starting`; the state moves to `running` when
        `/health` returns 200. A refusal is state `failed` with one fixed
        reason (`not-configured`, `binary-invalid`, `model-invalid`,
        `not-loopback` or `port-in-use`). A server that is already starting or
        running is left alone. A server omrs did not start is never touched.
      security:
        - sessionCookie: [manage]
      x-omrs-scopes: [manage]
      responses:
        "200":
          description: The state after the start.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LlamacppServerStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /llamacpp/server/stop:
    post:
      operationId: stopLlamacppServer
      summary: Stop the llama.cpp server that omrs started
      description: >
        Sends SIGTERM to the process group of the owned process, waits up to 10
        seconds, then sends SIGKILL. With no owned process nothing is signalled.
      security:
        - sessionCookie: [manage]
      x-omrs-scopes: [manage]
      responses:
        "200":
          description: The state after the stop.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LlamacppServerStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /llamacpp/server/restart:
    post:
      operationId: restartLlamacppServer
      summary: Stop the owned llama.cpp server and start it with the saved values
      description: Stop, then start, as the two routes above do.
      security:
        - sessionCookie: [manage]
      x-omrs-scopes: [manage]
      responses:
        "200":
          description: The state after the restart.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LlamacppServerStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # ── Chat model choice ───────────────────────────────────────────────
  /settings/chat:
    get:
      operationId: getChatSettings
      summary: Read the Chat provider and model
      description: >
        Returns the provider and model Chat uses, where the choice comes from
        (`env`, `dotenv`, `config-file` or `default`), whether the environment locks it and
        why, whether answering is `enabled`, and whether Chat is `ready`. When
        it is not ready, `reason` is `disabled`, `unknown-provider`,
        `not-installed` or `not-configured`. `reasoning` is the saved reasoning level
        (`""` means the provider default), `reasoning_locked` and `reasoning_lock_reason`
        say whether `ANSWER__REASONING` sets it, and `reasoning_ignored` says whether the
        provider sends no level to the model. This route sends no request to
        any provider.
      security:
        - sessionCookie: [read]
        - bearerToken: [read]
      x-omrs-scopes: [read]
      responses:
        "200":
          description: The Chat choice.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    put:
      operationId: setChatSettings
      summary: Save or clear the Chat provider and model
      description: >
        Body `{provider, model, reasoning?, revision?}` writes `answer.provider`,
        `answer.model` and `answer.reasoning` to `omrs.jsonc` in one write. `reasoning`
        left out keeps the saved level, and `""` removes it. A body with only `reasoning`
        (and `revision`) sets the level and keeps the choice. A body with only `revision`,
        an empty body or `null` clears the choice and its level. The Engine uses the
        choice from the next answer, with no restart.
        Returns 400 for an unknown provider, a bad model name, only one of the two or a
        level outside `^[A-Za-z0-9_-]{1,32}$`, and 409 when the environment or `.env` sets
        the choice (for a body that writes it) or `ANSWER__REASONING` sets the level (for a
        body that sends `reasoning`), `omrs.jsonc` changed since `revision`, or the Engine
        refuses it. Browser session only.
      security:
        - sessionCookie: [manage]
      x-omrs-scopes: [manage]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatSaveRequest"
      responses:
        "200":
          description: The Chat choice after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # ── Claim check judge choice ────────────────────────────────────────
  /settings/judge:
    get:
      operationId: getJudgeSettings
      summary: Read the claim check judge provider and model
      description: >
        Returns the judge provider as set (a registry name, or the alias `cloud` or
        `local`), the registry provider it resolves to (`resolved_provider`), the judge
        model, where the choice comes from (`env`, `dotenv`, `config-file` or `default`),
        whether the environment locks it and why, whether answering is `enabled`, and
        whether the judge is `ready`. When it is not ready, `reason` is `disabled`,
        `unknown-provider`, `not-installed`, `not-configured` or `no-model` (the judge
        model in force is empty). The four `reasoning*` fields report
        `answer.verify_reasoning` like the Chat route, with the lock variable
        `ANSWER__VERIFY_REASONING` and `reasoning_ignored` for the resolved provider.
        It does not say whether claim checks are on: a profile
        decides that per collection. This route sends no request to any provider.
      security:
        - sessionCookie: [read]
        - bearerToken: [read]
      x-omrs-scopes: [read]
      responses:
        "200":
          description: The judge choice.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JudgeSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    put:
      operationId: setJudgeSettings
      summary: Save or clear the claim check judge provider and model
      description: >
        Body `{provider, model, reasoning?, revision?}` writes `answer.verify_provider` and
        `answer.verify_model` to `omrs.jsonc` as one unit, with `answer.verify_reasoning` in
        the same write. `provider` is a registry name; an alias (`cloud`, `local`) is
        refused. `reasoning` follows the Chat route rules; a bad level is 400 and a level
        set by `ANSWER__VERIFY_REASONING` is 409. A body with only `revision`, an empty body
        or `null` clears the choice and its level. The Engine uses the choice from the next answer, with
        no restart. Returns 400 for an unknown provider, an alias, an empty or bad model
        name or only one of the two, and 409 when `ANSWER__VERIFY_PROVIDER` or
        `ANSWER__VERIFY_MODEL` comes from the environment or `.env`, `omrs.jsonc` changed
        since `revision`, or the Engine refuses it. Returns 404 when the provider
        settings are not loaded. Browser session only.
      security:
        - sessionCookie: [manage]
      x-omrs-scopes: [manage]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JudgeSaveRequest"
      responses:
        "200":
          description: The judge choice after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JudgeSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /settings/chat/test:
    post:
      operationId: testChatModel
      summary: Send one short prompt to a Chat model
      description: >
        Optional body `{provider, model}` tests that choice. With no body the
        saved choice is tested. The call asks the model to reply "OK" and has a
        30-second limit. The result holds `ok`, a fixed `reason` (`refused`,
        `timeout`, `unauthorised`, `http-<status>`, `not-installed`,
        `not-configured`, `empty-reply` or `failed`) and `elapsed_ms`. The reply and
        the exception text are never returned. Nothing is saved.
      security:
        - sessionCookie: [manage]
      x-omrs-scopes: [manage]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatChoice"
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatTestResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /settings/chat/reasoning-levels:
    get:
      operationId: getReasoningLevels
      summary: List the reasoning levels a model accepts
      description: >
        Returns `{known: true, levels, default, mandatory, ignored}` when the provider
        publishes a model catalogue that lists `model` with reasoning levels, else
        `{known: false, ignored}`. `ignored` says whether `provider` sends no level to the
        model at all. For OpenRouter the server reads the public
        `GET https://openrouter.ai/api/v1/models` with no API key and keeps the parsed
        catalogue in memory for 10 minutes. A provider without a catalogue sends no
        request. A failed read gives `{known: false}` and is not cached.
      security:
        - sessionCookie: [read]
        - bearerToken: [read]
      x-omrs-scopes: [read]
      parameters:
        - name: provider
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 64
        - name: model
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
      responses:
        "200":
          description: The level list, or `known` false.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReasoningLevels"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /usage/credit:
    get:
      operationId: getUsageCredit
      summary: Read the credit left on the Chat provider key
      description: >
        Returns `{available: true, limit_usd, remaining_usd}` when the Chat provider
        publishes the key's spending limit, else `{available: false}`. For OpenRouter the
        server sends one `GET https://openrouter.ai/api/v1/key` with the key. A key with no
        limit, a missing key, a provider without credit data and any failure give
        `{available: false}`; only the provider with credit data and a key is contacted.
        Nothing is cached. The key never appears in the response or the log.
      security:
        - sessionCookie: [read]
        - bearerToken: [read]
      x-omrs-scopes: [read]
      responses:
        "200":
          description: The credit, or `available` false.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageCredit"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # ── Server log (session only) ───────────────────────────────────────
  /logs:
    get:
      operationId: getLogs
      summary: Read the buffered server log records
      description: >
        Returns the records with a `seq` above `after`, oldest first, and
        `last_seq`, the newest sequence (0 when nothing was logged). The
        server keeps the last 1,000 records in memory and writes no file. A
        record is redacted before it is stored: provider keys and bearer
        tokens never appear. Session only: a bearer credential gets 403.
      security:
        - sessionCookie: [manage]
      x-omrs-scopes: [manage]
      parameters:
        - name: after
          in: query
          required: false
          description: Return only records after this sequence.
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: The records.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /logs/stream:
    get:
      operationId: streamLogs
      summary: Follow the server log as server-sent events
      description: >
        The stream first sends `retry: 3000`. It then replays the buffered
        records after `Last-Event-ID` (or `after`; the header wins) and
        follows new ones. Each frame has `id: <seq>`, `event: log` and
        `data: <LogRecord JSON>`. The stream ends with
        `event: server.closing` when the server stops admitting requests.
        Session only: a bearer credential gets 403.
      security:
        - sessionCookie: [manage]
      x-omrs-scopes: [manage]
      x-omrs-sse-events:
        "*": LogRecord
        log: LogRecord
        server.closing: StreamClosing
      parameters:
        - name: after
          in: query
          required: false
          description: Replay records after this sequence. `Last-Event-ID` wins.
          schema:
            type:
              - integer
              - "null"
            minimum: 0
        - name: Last-Event-ID
          in: header
          required: false
          description: Sequence of the last record the client received.
          schema:
            type:
              - string
              - "null"
      responses:
        "200":
          description: Event stream.
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # ── Configuration list (omrs.jsonc) ─────────────────────────────────
  /settings/configuration:
    get:
      operationId: getSettingsConfiguration
      summary: List every setting with its source, restart state and file problems
      description: >
        Lists every setting with the value in force, where it came from
        (`init`, `env`, `dotenv`, `config-file`, `key-file`, `keychain` or
        `default`), and whether it applies at once (`live`) or only after a
        restart (`restart`). `restart_pending` is true when `omrs.jsonc` now
        holds another value for a restart-only setting: the row keeps the value
        the server started with. A key field has `value` null and `last4` with
        its last four characters (an empty string when the key is shorter than
        eight characters); a key is never sent. `problems` names each key in
        `omrs.jsonc` that was ignored, by key and never by value. `handover`
        says whether saved workspace rows could not be moved into the file, and
        names the folder. The route reads the file and sends no request to any
        provider.
      security:
        - sessionCookie: [read]
        - bearerToken: [read]
      x-omrs-scopes: [read]
      responses:
        "200":
          description: The configuration list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsConfiguration"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /settings/document-reading:
    get:
      operationId: getDocumentReadingSettings
      summary: Read the document-reading settings, the PDF readers and the OCR engines
      description: >
        Lists the nine document-reading keys in a fixed order (`pdf_reader`,
        `ocr_fallback_enabled`, `ocr_fallback_min_confidence`,
        `ocr_fallback_page_fraction`, `ocr_routing_unit`, `ocr_engine_primary`,
        `ocr_engine_fallback`, `ocr_maths_routing_enabled`,
        `ocr_maths_page_fraction`). Each row has the value in force since
        launch, the valid value `omrs.jsonc` holds now (`saved`), the source,
        the lock state, whether a restart is pending and the code default. Every
        key applies at the next launch only, and every key is part of the index
        identity. `pdf_readers` lists `auto` first, then each registered reader
        with its availability. `ocr` lists the OCR workers folder, whether
        `OCR_WORKER_COMMAND` replaces the primary engine, and each known engine
        with its availability now. The route reads the file and probes packages
        and folders; it writes nothing.
      security:
        - sessionCookie: [read]
        - bearerToken: [read]
      x-omrs-scopes: [read]
      responses:
        "200":
          description: The document-reading settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentReadingState"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      operationId: setDocumentReadingSettings
      summary: Save document-reading settings to omrs.jsonc for the next launch
      description: >
        Writes one to nine of the nine keys to `omrs.jsonc`, all in one write
        or none. `null` removes a key, so the default applies. The value in
        force does not change until a restart. The checks run in this order
        and stop at the first failure: body shape (400, `Invalid request. …`);
        a key outside the nine (400, "<key> is not a document reading
        setting."); a key that the environment or `.env` sets (409, "Remove
        <ENV_NAME> from the environment or .env to edit it here.", first locked
        key in key order); a value that breaks its rule, including blank text
        (400, "<key>: <rule>"); a PDF reader that is not installed (400,
        "pdf_reader: This PDF reader is not installed. Install its package,
        then save again."); a stale `revision` (409, "omrs.jsonc changed on
        disk. Reload to see the new values."); a file that cannot be parsed or
        holds a key twice (409, "omrs.jsonc could not be read. Fix it, then
        save again."); a disk error (500, "omrs.jsonc could not be written.").
        An OCR engine name that is valid but not provisioned is allowed. No
        message holds a submitted value. Session only: a bearer credential
        gets 403.
      security:
        - sessionCookie: [manage]
      x-omrs-scopes: [manage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentReadingUpdate"
      responses:
        "200":
          description: The document-reading settings after the write, with the new revision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentReadingState"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  # ── Power control (session only) ────────────────────────────────────
  /server/power:
    get:
      operationId: getServerPower
      summary: Report whether the app can restart or turn itself off
      description: >
        `managed` is true when the running app is the macOS login item
        (`omrs web install`, started with `--login-item`), and false for a
        server started in a terminal with `omrs web`. Session only: a bearer
        credential gets 403.
      security:
        - sessionCookie: [manage]
      x-omrs-scopes: [manage]
      responses:
        "200":
          description: The power state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PowerStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      operationId: requestServerPower
      summary: Restart the app or turn it off
      description: >
        `restart` asks launchd to send `SIGTERM` to the app, so launchd starts
        it again. `off` asks launchd to unload the agent, so the app stays
        stopped until the next login or until `omrs web start` runs; the plist
        stays in place. The route answers 202 and acts about half a second
        later, after the response has been sent. Either action ends the
        browser session, because sessions stay in memory. The body is a closed
        choice of the two actions: another action name gets 422 and a body
        of the wrong shape gets 400. The route answers
        409 and changes nothing when the app is not the login item or when an
        ingestion, a run, a map call or an integration install is in progress. Session only: a bearer
        credential gets 403.
      security:
        - sessionCookie: [manage]
      x-omrs-scopes: [manage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PowerRequest"
      responses:
        "202":
          description: The action was accepted and runs after this response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PowerAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: omrs_session_8765
      description: >
        Browser session cookie `omrs_session_<port>` (the example name uses
        port 8765). HttpOnly, SameSite=Strict, Path=/. `POST /v1/session`
        sets it from the one-time bootstrap secret or the workspace sign-in
        secret. The session holds every
        scope. State-changing requests must carry the application Origin.
    bearerToken:
      type: http
      scheme: bearer
      bearerFormat: omrs_bt_<id>.<secret>
      description: >
        Revocable per-launch credential for notebook clients, issued by
        `POST /v1/credentials`. It holds only `read`, `graph` and `run`.
        It never passes a session-only operation. It stops working when
        revoked or when the server stops.

  parameters:
    CollectionName:
      name: collection
      in: path
      required: true
      schema:
        type: string
      description: Collection name
    CredentialId:
      name: credential_id
      in: path
      required: true
      schema:
        type: string
    ChatId:
      name: chat_id
      in: path
      required: true
      description: The id of a stored chat.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    ChatFolderId:
      name: folder_id
      in: path
      required: true
      description: The id of a chat folder.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    ProfileId:
      name: profile_id
      in: path
      required: true
      description: A built-in profile name or the id of a user profile.
      schema:
        type: string
        minLength: 1
        maxLength: 64

    PipelineId:
      name: pipeline_id
      in: path
      required: true
      schema:
        type: string
    RunId:
      name: run_id
      in: path
      required: true
      schema:
        type: string
    ContextId:
      name: context_id
      in: path
      required: true
      schema:
        type: string
      description: Experiment context id (`exp_<16 hex>`).
    PluginName:
      name: name
      in: path
      required: true
      schema:
        type: string
      description: Plugin id from the manifest.
    LaunchId:
      name: launch_id
      in: path
      required: true
      schema:
        type: string

  responses:
    BadRequest:
      description: >
        Invalid request body, query or header (`error_type: validation`),
        an invalid Host header, or a credential in the query string.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing, invalid or revoked credential.
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BootstrapRejected:
      description: >
        The secret is not the workspace sign-in secret, and as a bootstrap
        secret it is wrong, was already used, or stopped working after too
        many wrong guesses. Reload the page, or restart `omrs web` to get a
        new link.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: >
        Foreign Origin or cross-site fetch, a missing scope, a bearer
        credential on a session-only operation, or a path outside the
        approved roots.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Unknown resource.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Gone:
      description: The operation is withdrawn. The message names the replacement.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: >
        The request conflicts with the current state: a stale, used or
        expired confirmation (preview again), a reserved job pipeline, a
        run in the wrong state, a profile that collections use, a pipeline
        of a deleted profile, a save that would make a profile in use not
        ready, or a power action while the app is not the login item or work
        is running.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PayloadTooLarge:
      description: The file is larger than the upload limit.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnsupportedMediaType:
      description: The file type is not ingestible (archives included).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationFailed:
      description: >
        Core validation rejected the graph, inputs or selector. The body
        lists every structured issue. A power request with any body other
        than one of the two actions gets this status with the plain error
        envelope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PreconditionRequired:
      description: The destructive request has no confirmation token. Preview first.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: The shared run and job queue is full. Try again later.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: Unexpected server error. The body holds no detail.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotImplemented:
      description: The vector store cannot serve this operation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceUnavailable:
      description: >
        The server is starting or shutting down, or the Engine or run
        service is not available.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ExperimentRefused:
      description: >
        The request was refused. An experiment refusal carries a stable
        `code` (`ExperimentError`); other refusals use the error envelope.
        Nothing was changed.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/Error"
              - $ref: "#/components/schemas/ExperimentError"

  schemas:
    # ── Error envelope (matches MCP error-dict shape) ──────────────────
    Error:
      type: object
      additionalProperties: false
      required:
        - status
        - message
      properties:
        status:
          type: string
          enum: [error]
        message:
          type: string
        error_type:
          type: string
          enum: [validation, retrieval, internal, embedding_locked, embedding_mismatch]
          description: >
            Optional error category. `embedding_locked` is a 409 from
            `setProfileEmbedding`, `embedding_mismatch` a 409 from
            `changeCollectionProfile`.
        reason:
          type: string
          description: >
            Present on the 422 from `setProfileEmbedding`: why the model
            check failed. Present on the 409 from `installIntegration`: why
            the extra cannot be installed now.
        collections:
          type: array
          description: >
            Present on a 409 `embedding_locked`: the collections that block the
            change, first blocking collection first.
          items:
            $ref: "#/components/schemas/EmbeddingLockCollection"
        issues:
          type: array
          description: Present only on 422 graph validation failures.
          items:
            $ref: "#/components/schemas/ValidationIssue"
        nodes:
          type: array
          description: >
            Present only on a 422 draft check: the effective controls of each
            node whose parameters passed validation.
          items:
            $ref: "#/components/schemas/DraftNode"
        used_by:
          type: array
          description: Present on a 409 profile delete, the collections that use the profile.
          items:
            type: string
        not_ready_reasons:
          type: array
          description: >
            Present when a profile is not ready (400 on a bind, 409 on a
            slot save): plain lines that say what to fix.
          items:
            type: string

    ValidationIssue:
      type: object
      additionalProperties: false
      required: [code, message, node_id, port, edge, lever]
      properties:
        code:
          type: string
          description: Stable issue code, for example `unsupported_schema_version`.
        message:
          type: string
        node_id:
          type: [string, "null"]
        port:
          type: [string, "null"]
        edge:
          type: [string, "null"]
        lever:
          type: [string, "null"]

    # ── Foundation ─────────────────────────────────────────────────────
    Scope:
      type: string
      enum: [read, graph, run, files, plugins, credentials, manage]

    BearerScope:
      type: string
      enum: [read, graph, run]

    Health:
      type: object
      additionalProperties: false
      required: [status, ready, version]
      properties:
        status:
          type: string
          enum: [ok]
        ready:
          type: boolean
          description: False while the server starts or shuts down.
        version:
          type: string
          description: The installed OMRS package version.

    BootstrapRequest:
      type: object
      required: [bootstrap]
      properties:
        bootstrap:
          type: string
          minLength: 1
          maxLength: 256
          description: >
            The secret from the `#bootstrap=` fragment of the launch URL, or
            the workspace sign-in secret from the page.

    SessionCreated:
      type: object
      additionalProperties: false
      required: [status, kind]
      properties:
        status:
          type: string
          enum: [ok]
        kind:
          type: string
          enum: [session]

    SessionInfo:
      type: object
      additionalProperties: false
      required: [status, kind, scopes, workspace]
      properties:
        status:
          type: string
          enum: [ok]
        kind:
          type: string
          enum: [session, bearer]
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/Scope"
        workspace:
          type: [string, "null"]
          description: >
            Canonical path of the workspace directory this server uses
            (`omrs web --workspace`, default `~/.omrs/workspace`). It is
            `null` only while the runtime is not started.

    CredentialRequest:
      type: object
      required: [scopes]
      properties:
        scopes:
          type: array
          minItems: 1
          maxItems: 3
          items:
            $ref: "#/components/schemas/BearerScope"
        label:
          type: string
          maxLength: 80
          default: ""
        experiment_context:
          type: [string, "null"]
          minLength: 1
          maxLength: 64
          description: >
            Bind the credential to this active experiment context. A bound
            credential runs graphs only in that context.

    IssuedCredential:
      type: object
      additionalProperties: false
      required: [status, id, token, scopes, label, experiment_context]
      properties:
        status:
          type: string
          enum: [ok]
        id:
          type: string
        token:
          type: string
          description: The bearer token. It is shown only in this response.
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/BearerScope"
        label:
          type: string
        experiment_context:
          type: [string, "null"]

    CredentialInfo:
      type: object
      additionalProperties: false
      required: [id, scopes, label, created_at, revoked, experiment_context]
      properties:
        id:
          type: string
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/BearerScope"
        label:
          type: string
        created_at:
          type: number
          description: Unix time in seconds.
        revoked:
          type: boolean
        experiment_context:
          type: [string, "null"]
          description: Experiment context the credential is bound to, if any.

    CredentialList:
      type: object
      additionalProperties: false
      required: [status, credentials]
      properties:
        status:
          type: string
          enum: [ok]
        credentials:
          type: array
          items:
            $ref: "#/components/schemas/CredentialInfo"

    CredentialRevoked:
      type: object
      additionalProperties: false
      required: [status, id, revoked]
      properties:
        status:
          type: string
          enum: [ok]
        id:
          type: string
        revoked:
          type: boolean
          enum: [true]

    McpState:
      type: object
      additionalProperties: false
      required: [status, revision, enabled, source, url, token]
      properties:
        status:
          type: string
          enum: [ok]
        revision:
          type: string
          description: >
            Stamp of `omrs.jsonc` (SHA-256 of its bytes, or `absent`). A save may send it back;
            a file that changed since gives 409.
        enabled:
          type: boolean
        source:
          type: string
          enum: [config-file, default]
          description: '`config-file` when `omrs.jsonc` holds `mcp_http_enabled`.'
        url:
          type: string
          description: The full `/mcp` address on the bound host and port.
        token:
          type: object
          additionalProperties: false
          required: [exists, created_at]
          properties:
            exists:
              type: boolean
            created_at:
              type: [string, "null"]
              description: ISO 8601 creation time, or null when no token exists.

    McpEnabledRequest:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled:
          type: boolean
        revision:
          type: [string, "null"]
          maxLength: 128
          description: >
            The `revision` last read. A file that changed since gives 409 with
            "omrs.jsonc changed on disk. Reload to see the new values." and nothing is written.

    McpTokenCreated:
      type: object
      additionalProperties: false
      required: [status, token, created_at]
      properties:
        status:
          type: string
          enum: [ok]
        token:
          type: string
          description: The MCP token (`omrs_mcp_` prefix). It is shown only in this response.
        created_at:
          type: string

    McpTokenRevoked:
      type: object
      additionalProperties: false
      required: [status, revoked]
      properties:
        status:
          type: string
          enum: [ok]
        revoked:
          type: boolean
          description: False when no token existed.

    WebPortState:
      type: object
      additionalProperties: false
      required: [status, revision, saved, bound, differs]
      properties:
        status:
          type: string
          enum: [ok]
        revision:
          type: string
          description: >
            Stamp of `omrs.jsonc` (SHA-256 of its bytes, or `absent`). A save may send it back;
            a file that changed since gives 409.
        saved:
          type: [integer, "null"]
          description: '`web_port` in `omrs.jsonc` (used at the next launch), or null.'
        bound:
          type: integer
          description: The port this server listens on now.
        differs:
          type: boolean
          description: Whether the file port differs from the bound port.

    WebPortRequest:
      type: object
      additionalProperties: false
      required: [port]
      properties:
        port:
          type: [integer, "null"]
          minimum: 1024
          maximum: 65535
        revision:
          type: [string, "null"]
          maxLength: 128
          description: >
            The `revision` last read. A file that changed since gives 409 with
            "omrs.jsonc changed on disk. Reload to see the new values." and nothing is written.

    UploadLimitState:
      type: object
      additionalProperties: false
      required: [status, revision, max_bytes, source, saved_mib, default_mib, min_mib, max_mib]
      properties:
        status:
          type: string
          enum: [ok]
        revision:
          type: string
          description: >
            Stamp of `omrs.jsonc` (SHA-256 of its bytes, or `absent`). A save may send it back;
            a file that changed since gives 409.
        max_bytes:
          type: integer
          description: The per-file limit in force, in bytes.
        source:
          type: string
          enum: [launch, config-file, default]
        saved_mib:
          type: [integer, "null"]
          description: '`web_max_upload_mib` in `omrs.jsonc`, or null.'
        default_mib:
          type: integer
          description: The limit when nothing is saved (50).
        min_mib:
          type: integer
        max_mib:
          type: integer

    UploadLimitRequest:
      type: object
      additionalProperties: false
      required: [max_mib]
      properties:
        max_mib:
          type: [integer, "null"]
          minimum: 1
          maximum: 2048
        revision:
          type: [string, "null"]
          maxLength: 128
          description: >
            The `revision` last read. A file that changed since gives 409 with
            "omrs.jsonc changed on disk. Reload to see the new values." and nothing is written.

    Root:
      type: object
      additionalProperties: false
      required: [id, path, kind]
      properties:
        id:
          type: string
          description: "`root_` plus 12 hex characters of the canonical path digest."
        path:
          type: string
        kind:
          type: string
          enum: [operator, managed]

    RootList:
      type: object
      additionalProperties: false
      required: [status, roots]
      properties:
        status:
          type: string
          enum: [ok]
        roots:
          type: array
          items:
            $ref: "#/components/schemas/Root"

    UploadPreflightRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 1024
        size:
          type: [integer, "null"]
          description: Declared size in bytes, when known.

    UploadPreflightResult:
      type: object
      additionalProperties: false
      required: [status, name, max_bytes]
      properties:
        status:
          type: string
          enum: [ok]
        name:
          type: string
        max_bytes:
          type: integer

    UploadStored:
      type: object
      additionalProperties: false
      required: [status, upload]
      properties:
        status:
          type: string
          enum: [ok]
        upload:
          type: object
          additionalProperties: false
          required: [id, name, size, sha256]
          properties:
            id:
              type: string
            name:
              type: string
            size:
              type: integer
            sha256:
              type: string

    # ── Ingest ─────────────────────────────────────────────────────────
    IngestRequest:
      type: object
      additionalProperties: false
      required:
        - path
      properties:
        path:
          type: string
          maxLength: 4096
          description: >
            Absolute file or directory path inside an approved root. For an
            upload, use the managed root path plus `<upload id>/<name>`.
        collection:
          type: string
          minLength: 1
          maxLength: 256
          default: documents
          description: Target collection


    # ── Search ─────────────────────────────────────────────────────────
    SearchRequest:
      type: object
      additionalProperties: false
      required:
        - query
      properties:
        query:
          type: string
          description: Natural language search query
        top_k:
          type: [integer, "null"]
          minimum: 1
          description: >
            Maximum results to return. Resolved from the collection profile
            when omitted.
        similarity_threshold:
          type: [number, "null"]
          minimum: 0.0
          maximum: 1.0
          description: >
            Minimum canonical dense similarity. Resolved from the collection
            profile when omitted. Hybrid/no-rerank applies it to dense
            evidence before RRF; successful reranking uses the calibrated
            reranker transform.
        rerank:
          type:
            - boolean
            - "null"
          description: >
            Tri-state rerank control: true (force on), false (force off),
            null (resolved from the collection profile when omitted).
        hybrid:
          type:
            - boolean
            - "null"
          description: >
            Fuse dense + sparse (BM25 + RRF). Resolved from the collection
            profile when omitted.
        expand_window:
          type: integer
          minimum: 0
          default: 0
          description: >
            Neighbours added per side of each retrieved chunk during
            context assembly (0 = no expansion, the default). Expanded
            neighbours merge into the retrieved chunk under the assembly
            merging rules and never displace retrieved rows.
        diagnostics:
          type: boolean
          default: false
          description: >
            When true, include core-produced retrieval diagnostics in each
            result row (rank diagnostics, rerank reason, sparse backend,
            per-stage timings, etc.). Diagnostics-only fields are optional
            on the response schema.
        metadata_filter:
          type:
            - object
            - "null"
          description: ChromaDB-compatible `where` clause for metadata filtering
          additionalProperties: true

    SearchResult:
      type: object
      required:
        - score
        - score_kind
        - source
        - text
        - reranked
        - metadata
        - source_id
        - source_version
        - chunk_id
        - source_chunk_index
        - source_chunk_count
      properties:
        score:
          type: number
          format: float
          description: >
            Relevance score. Absent on rows added purely by neighbour
            expansion (``expand_window`` > 0), which were never ranked.
        score_kind:
          type: string
          enum: [dense_similarity_v1, rrf_v1, reranker_sigmoid_v1]
          description: >
            Score semantics for ``score``. Absent on rows added purely by
            neighbour expansion, which carry no retrieval score.
        source:
          type: string
        page_label:
          type:
            - string
            - "null"
          description: >
            Page label when the configured reader observes page boundaries.
            Optional by contract (design D5): readers that return one
            document per file (pdf_inspector) genuinely cannot know the
            page, so the field is null there rather than fabricated.
        text:
          type: string
        reranked:
          type: boolean
        metadata:
          type: object
          description: >
            The full stored metadata mapping for the chunk, including
            file path, page label, and any extraction-produced fields.
          additionalProperties: true
        source_id:
          type:
            - string
            - "null"
          description: >
            Stable source identity derived from the canonical source path.
            Absent (null) for legacy rows stored without lineage metadata.
        source_version:
          type:
            - string
            - "null"
          description: >
            Content version stamp of the source at ingest time. Absent
            (null) for legacy rows.
        chunk_id:
          type:
            - string
            - "null"
          description: >
            Stable chunk identity within the source. Absent (null) for
            legacy rows.
        source_chunk_index:
          type:
            - integer
            - "null"
          description: >
            Zero-based ordinal of this chunk within its source. Absent
            (null) for legacy rows.
        source_chunk_count:
          type:
            - integer
            - "null"
          description: >
            Total chunk count of the source at ingest time. Absent (null)
            for legacy rows.
        chunk_ids:
          type: array
          items:
            type: string
          description: >
            The ``chunk_id`` of every constituent chunk of an assembled
            row, in ascending ``source_chunk_index`` order. Present only
            on rows the assembly stage merged from multiple adjacent
            chunks; unmerged rows keep the plain ``chunk_id`` key and gain
            nothing. Each listed id is a stable per-chunk reference that
            resolves to exactly one stored chunk, so citations remain
            verifiable after merging. Optional by contract: absent means
            the row is a single chunk.
        # ── Diagnostics-only fields (present when diagnostics=true) ──────
        id:
          type: string
          description: Internal row identifier (diagnostics only).
        fused_score:
          type: number
          format: float
          description: RRF fused score (diagnostics only, hybrid queries).
        dense_score:
          type: number
          format: float
          description: Canonical dense similarity score (diagnostics only).
        dense_score_kind:
          type: string
          description: Score kind of the dense evidence (diagnostics only).
        dense_rank:
          type:
            - integer
            - "null"
          description: Rank in the dense ranking (diagnostics only, hybrid).
        sparse_rank:
          type:
            - integer
            - "null"
          description: Rank in the sparse ranking (diagnostics only, hybrid).
        fused_rank:
          type:
            - integer
            - "null"
          description: Rank after RRF fusion (diagnostics only, hybrid).
        rerank_reason:
          type: string
          description: >
            Policy or failure reason explaining the rerank decision
            (diagnostics only).
        threshold_score_kind:
          type: string
          description: >
            Score semantics used for threshold evaluation (diagnostics only).
        rerank_backend:
          type: string
          description: >
            Backend that actually served the rerank (e.g. onnx, torch).
            Present only when the reranker ran (diagnostics only).
        sparse_backend:
          type: string
          description: >
            Sparse backend that actually served the hybrid query (e.g.
            bm25, native). Present only for hybrid queries (diagnostics only).
        assembly_merged:
          type: boolean
          description: >
            Whether the assembly stage merged this row from multiple
            adjacent chunks (diagnostics only).
        assembly_chunk_count:
          type: integer
          minimum: 1
          description: >
            Number of constituent chunks this row was assembled from
            (diagnostics only; 1 for unmerged rows).
        assembly_expanded:
          type: boolean
          description: >
            Whether the row was added purely by neighbour expansion and
            was never ranked — such rows carry no retrieval score
            (diagnostics only).
        norm_guard:
          type: object
          description: >
            Embedding norm-guard state dict. Present only when the norm
            guard is enabled (diagnostics only).
          additionalProperties: true
        timings:
          type: object
          description: >
            Per-stage retrieval wall-clock durations in seconds, attached
            to each result row when diagnostics are enabled. Keys are
            stage names (``embedding_seconds``, ``dense_seconds``,
            ``sparse_seconds``, ``fusion_seconds``, ``rerank_seconds``,
            ``assembly_seconds``).
            A stage that did not run is absent — absence means "did not
            execute", never "took zero time". Per-stage durations do not
            sum to wall time in hybrid mode because dense and sparse run
            concurrently. No total is emitted (diagnostics only).
          additionalProperties:
            type: number
            format: float

    # ── Document info ──────────────────────────────────────────────────
    AnswerRequest:
      type: object
      additionalProperties: false
      required:
        - query
      properties:
        query:
          type: string
          maxLength: 4096
          description: Natural language question to answer.
        top_k:
          type:
            - integer
            - "null"
          minimum: 1
          maximum: 100
          description: >
            Maximum chunks to use as evidence. Resolved from the
            collection profile when omitted.
        similarity_threshold:
          type:
            - number
            - "null"
          format: float
          minimum: 0
          maximum: 1
          description: Minimum evidence score (0.0 = no filtering).
        rerank:
          type:
            - boolean
            - "null"
          description: >
            Re-score evidence with the cross-encoder reranker. Resolved
            from the collection profile when omitted.
        hybrid:
          type:
            - boolean
            - "null"
          description: >
            Fuse dense + sparse retrieval. Resolved from the collection
            profile when omitted.
        expand_window:
          type: integer
          minimum: 0
          maximum: 10
          default: 0
          description: >
            Neighbours merged into each evidence chunk during context
            assembly.
        diagnostics:
          type: boolean
          default: false
          description: >
            When true, include per-stage timings and completion counts in
            the response `diagnostics` object, including the judge calls
            of claim verification when that stage ran.
        metadata_filter:
          type:
            - object
            - "null"
          description: ChromaDB-compatible `where` clause for evidence filtering
          additionalProperties: true

    AnswerResponse:
      type: object
      required:
        - status
        - query
        - answer
        - citations
        - evidence
        - failure_stage
        - error
        - completion_source
      properties:
        status:
          type: string
          enum: [ok, no_evidence, generation_unverified, unverified_claims, error]
          description: >
            ok = grounded answer with at least one valid citation.
            no_evidence = retrieval found nothing (no model call made).
            generation_unverified = answer text present but no valid
            citation; the evidence is still returned. unverified_claims =
            claim verification (ANSWER__VERIFY_CLAIMS, ADR-059) found one
            or more cited claims unsupported by their evidence; the
            answer, citations, and evidence are retained and the failing
            claims are listed. error = see failure_stage and error.
        query:
          type: string
        answer:
          type:
            - string
            - "null"
          description: >
            The synthesised answer text (null for no_evidence, retrieval
            failure, and provider-absent errors).
        citations:
          type: array
          items:
            $ref: "#/components/schemas/AnswerCitation"
          description: >
            Deterministic citations built from supplied chunk lineage.
            Empty for no_evidence; a substantive answer with no valid
            citation yields an empty list and status
            generation_unverified.
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/AnswerEvidence"
          description: >
            Every chunk supplied as context, retained even on generation
            failure so the caller keeps the evidence.
        failure_stage:
          type:
            - string
            - "null"
          enum: [retrieval, generation, null]
          description: >
            Which stage failed (null unless status is error). retrieval =
            the language model was never called.
        error:
          type:
            - string
            - "null"
          description: >
            Actionable message; the provider-absent case names the
            configuration to set.
        completion_source:
          type: string
          description: >
            Which model completed the answer: server, client_mrtr,
            client_legacy, or none.
        diagnostics:
          $ref: "#/components/schemas/AnswerDiagnostics"
          description: >
            Present only when diagnostics were requested.
        verified:
          type: boolean
          description: >
            Present only when claim verification ran and every cited
            claim passed the judge (ADR-059). Absent when verification
            is disabled or skipped.
        unverified_claims:
          type: array
          items:
            type: object
            required: [claim, verdict, ordinals]
            properties:
              claim:
                type: string
                description: The failing claim text (citation markers stripped).
              verdict:
                type: string
                enum: [unsupported, unparseable]
                description: unsupported = the evidence contradicts or omits the claim; unparseable = the judge reply could not be read (never silently passed).
              ordinals:
                type: array
                items:
                  type: integer
                  minimum: 1
                description: The evidence ordinals the claim cited.
          description: >
            Present only when status is unverified_claims — the cited
            claims that failed verification. The answer, citations, and
            evidence are all retained.
        verification_skipped:
          type: string
          description: >
            Present only when claim verification was enabled but could
            not run (provider unavailable, call failure, every verdict
            unparseable, or no cited prose sentence to check). Names the
            reason; the referential-only ok guarantee is retained.

    AnswerCitation:
      type: object
      required:
        - ordinal
        - chunk_id
        - chunk_ids
        - source_id
        - source_version
        - source
        - source_chunk_index
      properties:
        ordinal:
          type: integer
          minimum: 1
          description: The 1-based supplied-source number the model cited.
        chunk_id:
          type:
            - string
            - "null"
          description: >
            The merged row's representative chunk id; re-fetches exactly
            one stored chunk by metadata filter.
        chunk_ids:
          type: array
          items:
            type: string
          description: >
            Every constituent chunk id when context assembly merged
            rows; a single-element list otherwise.
        source_id:
          type:
            - string
            - "null"
        source_version:
          type:
            - string
            - "null"
        source:
          type:
            - string
            - "null"
        source_chunk_index:
          type:
            - integer
            - "null"
        score:
          type:
            - number
            - "null"
          format: float
        score_kind:
          type:
            - string
            - "null"

    AnswerEvidence:
      type: object
      description: >
        One chunk supplied as context — the citation lineage plus the
        ordinal it was labelled with in the prompt and the chunk text.
      required:
        - ordinal
        - chunk_id
        - chunk_ids
        - source_id
        - source_version
        - source
        - source_chunk_index
        - text
      properties:
        ordinal:
          type: integer
          minimum: 1
          description: >
            The 1-based position of this chunk in the supplied context;
            the number citations refer to.
        chunk_id:
          type:
            - string
            - "null"
        chunk_ids:
          type: array
          items:
            type: string
        source_id:
          type:
            - string
            - "null"
        source_version:
          type:
            - string
            - "null"
        source:
          type:
            - string
            - "null"
        source_chunk_index:
          type:
            - integer
            - "null"
        score:
          type:
            - number
            - "null"
          format: float
        score_kind:
          type:
            - string
            - "null"
        text:
          type: string

    AnswerDiagnostics:
      type: object
      required:
        - retrieval_ms
        - generation_ms
        - completion_calls
      properties:
        retrieval_ms:
          type: number
          format: float
          description: Duration of the retrieval stage in milliseconds.
        generation_ms:
          type: number
          format: float
          description: Duration of the generation stage in milliseconds.
        completion_calls:
          type: integer
          minimum: 0
          description: >
            Number of language-model completion rounds made (bounded by
            the answer configuration).
        verification_ms:
          type: number
          format: float
          description: >
            Duration of the claim-verification stage in milliseconds
            (ADR-059). Present only when the stage ran.
        verification_calls:
          type: integer
          minimum: 0
          description: >
            Judge completions made, one per cited claim. Present only
            when the stage ran; reported separately from
            completion_calls.

    DocumentInfo:
      type: object
      properties:
        source:
          type: string
        source_id:
          type:
            - string
            - "null"
          description: >
            Stable identity derived from the canonical source path. Absent
            (null) for legacy rows grouped by display path.
        chunks:
          type: integer
        orphaned:
          type:
            - boolean
            - "null"
          description: >
            Tri-state machine-local orphan status: true (source file missing
            on this machine), false (source file present), null (cannot
            determine — the source path is not an absolute path on this
            machine). This is machine-local, not a global property of the
            document.

    # ── Collection info ────────────────────────────────────────────────
    CollectionInfo:
      type: object
      additionalProperties: false
      required: [name, document_count, chunk_count, profile, display_name, store]
      properties:
        name:
          type: string
        document_count:
          type: integer
        chunk_count:
          type: integer
        profile:
          type: [string, "null"]
          description: >
            Profile name stored in the collection metadata (for example
            `documents` or `codebase`), or `null` when no profile tag is
            stored or the metadata cannot be read.
        display_name:
          type: [string, "null"]
          description: >
            Label the user gave the collection in the workspace, or `null`
            when none is set or the metadata cannot be read. It is not the
            collection name: retrieval, ingestion and MCP tools still use
            `name`.
        store:
          $ref: "#/components/schemas/VectorStoreInfo"

    VectorStoreInfo:
      type: object
      additionalProperties: false
      required: [name, label]
      description: >
        The vector database that holds the collection. It carries no path,
        URI, tenant or credential.
      properties:
        name:
          type: string
          description: Registered backend name, for example `lancedb` or `chroma`.
        label:
          type: string
          description: Human-readable name from the vector-store registry, for example `LanceDB`.

    # ── Chunk inspection ───────────────────────────────────────────────
    ChunkView:
      type: object
      additionalProperties: false
      required:
        - chunk_id
        - source_id
        - source_version
        - source_chunk_index
        - source_chunk_count
        - source
        - page_label
        - text
        - metadata
      properties:
        chunk_id:
          type: [string, "null"]
        source_id:
          type: [string, "null"]
        source_version:
          type: [string, "null"]
        source_chunk_index:
          type: [integer, "null"]
        source_chunk_count:
          type: [integer, "null"]
        source:
          type: [string, "null"]
          description: Stored display path. It grants no file access.
        page_label:
          type: [string, "null"]
        text:
          type: string
          description: Plain text. Render it as text, never as markup.
        metadata:
          type: object
          additionalProperties: true

    ChunkInspection:
      type: object
      additionalProperties: false
      required: [status, collection, text_format, chunk, previous, next]
      properties:
        status:
          type: string
          enum: [ok]
        collection:
          type: string
        text_format:
          type: string
          enum: [plain]
        chunk:
          $ref: "#/components/schemas/ChunkView"
        previous:
          type: array
          description: Earlier neighbours of the same source version, in index order.
          items:
            $ref: "#/components/schemas/ChunkView"
        next:
          type: array
          description: Later neighbours of the same source version, in index order.
          items:
            $ref: "#/components/schemas/ChunkView"

    # ── Destructive confirmations ──────────────────────────────────────
    Confirmation:
      type: object
      additionalProperties: false
      required: [token, expires_at, expires_in, validity, warning]
      description: >
        Single-use confirmation for a previewed destructive action. It is
        bound to the action, collection, selector and observed store
        validity token.
      properties:
        token:
          type: string
        expires_at:
          type: string
          format: date-time
        expires_in:
          type: number
          description: Seconds the preview stays valid (300).
        validity:
          type: string
          enum: [durable, process_local]
          description: >
            `durable` when the store reports a durable data version.
            `process_local` when only a process-local counter exists; a
            write by another process can then go undetected.
        warning:
          type: [string, "null"]
          description: Set when `validity` is `process_local`.

    # ── Delete ─────────────────────────────────────────────────────────
    DeleteRequest:
      type: object
      additionalProperties: false
      description: >
        `path` and `metadata_filter` are mutually exclusive. With neither,
        the whole collection is the selection.
      properties:
        path:
          type: [string, "null"]
          maxLength: 4096
          description: Source file path to delete chunks for
        metadata_filter:
          type: [object, "null"]
          description: ChromaDB `where` clause for metadata-based deletion (non-empty)
          additionalProperties: true
        dry_run:
          type: boolean
          default: false
          description: Preview without modifying data and issue a confirmation.
        confirmation_token:
          type: [string, "null"]
          maxLength: 128
          description: >
            Token from the preview `confirmation`. Required when `dry_run`
            is false.

    DeleteResult:
      type: object
      additionalProperties: false
      required: [status, mode, collection]
      properties:
        status:
          type: string
          enum: [ok]
        mode:
          type: string
          enum: [path, metadata, collection]
        collection:
          type: string
        dry_run:
          type: boolean
          description: Present only on a preview.
        would_delete:
          type: integer
          description: Present only on a preview.
        confirmation:
          $ref: "#/components/schemas/Confirmation"
        chunks_removed:
          type: integer
          description: Present after a path or metadata deletion.

    # ── Codebase map ───────────────────────────────────────────────────
    CodebaseMapRequest:
      type: object
      additionalProperties: false
      required:
        - path
      properties:
        path:
          type: string
          maxLength: 4096
          description: Absolute project directory path inside an approved root
        refresh:
          type: boolean
          default: false
          description: Force rebuild regardless of cache

    # ── Profile change ─────────────────────────────────────────────────
    DisplayNameRequest:
      type: object
      additionalProperties: false
      required: [display_name]
      properties:
        display_name:
          type: string
          maxLength: 4096
          description: >
            New display name. Trimmed by the server; empty clears it. At most
            80 Unicode code points after trimming, and no control characters.

    DisplayNameResult:
      type: object
      additionalProperties: false
      required: [collection, display_name]
      properties:
        collection:
          type: string
        display_name:
          type: [string, "null"]

    # ── Profiles ───────────────────────────────────────────────────────
    ProfileSlots:
      type: object
      additionalProperties: false
      required: [ingest, search, answer]
      description: Pipeline ids by slot. All null for a built-in profile.
      properties:
        ingest:
          type: [string, "null"]
        search:
          type: [string, "null"]
        answer:
          type: [string, "null"]

    ProfileItem:
      type: object
      additionalProperties: false
      required:
        - profile_id
        - kind
        - title
        - description
        - base_profile
        - slots
        - ready
        - not_ready_reasons
        - used_by
        - embedding
        - embedding_lock
      properties:
        profile_id:
          type: string
        kind:
          type: string
          enum: [builtin, user]
        title:
          type: string
        description:
          type: string
        base_profile:
          type: string
          enum: [documents, codebase]
        slots:
          $ref: "#/components/schemas/ProfileSlots"
        ready:
          type: boolean
        not_ready_reasons:
          type: array
          description: Plain lines that say which pipeline to fix and how.
          items:
            type: string
        used_by:
          type: array
          description: Names of the collections whose stored profile tag is this id.
          items:
            type: string
        embedding:
          $ref: "#/components/schemas/ProfileEmbedding"
        embedding_lock:
          $ref: "#/components/schemas/ProfileEmbeddingLock"

    ProfileDetail:
      type: object
      additionalProperties: false
      required:
        - profile_id
        - kind
        - title
        - description
        - base_profile
        - slots
        - ready
        - not_ready_reasons
        - used_by
        - embedding
        - embedding_lock
        - standard_graphs
      properties:
        profile_id:
          type: string
        kind:
          type: string
          enum: [builtin, user]
        title:
          type: string
        description:
          type: string
        base_profile:
          type: string
          enum: [documents, codebase]
        slots:
          $ref: "#/components/schemas/ProfileSlots"
        ready:
          type: boolean
        not_ready_reasons:
          type: array
          description: Plain lines that say which pipeline to fix and how.
          items:
            type: string
        used_by:
          type: array
          description: Names of the collections whose stored profile tag is this id.
          items:
            type: string
        embedding:
          $ref: "#/components/schemas/ProfileEmbedding"
        embedding_lock:
          $ref: "#/components/schemas/ProfileEmbeddingLock"
        standard_graphs:
          description: >
            Only a built-in profile has graphs: the graph documents that a
            duplicate copies into its pipelines. Null for a user profile.
          oneOf:
            - type: object
              additionalProperties: false
              required: [ingest, search, answer]
              properties:
                ingest:
                  type: object
                search:
                  type: object
                answer:
                  type: object
            - type: "null"

    ProfileList:
      type: object
      additionalProperties: false
      required: [status, profiles]
      properties:
        status:
          type: string
          enum: [ok]
        profiles:
          type: array
          items:
            $ref: "#/components/schemas/ProfileItem"

    ChatItem:
      type: object
      additionalProperties: false
      required: [chat_id, folder_id, title, created_at, updated_at]
      properties:
        chat_id: {type: string}
        folder_id: {type: [string, "null"]}
        title: {type: string, minLength: 1, maxLength: 200}
        created_at: {type: string}
        updated_at: {type: string}

    ChatFolderItem:
      type: object
      additionalProperties: false
      required: [folder_id, name, created_at]
      properties:
        folder_id: {type: string}
        name: {type: string, minLength: 1, maxLength: 100}
        created_at: {type: string}

    ChatTurnItem:
      type: object
      additionalProperties: false
      required: [position, collection, question, answer, created_at]
      properties:
        position: {type: integer, minimum: 1}
        collection: {type: string}
        question: {type: string, minLength: 1, maxLength: 10000}
        answer:
          type: object
          description: The finished answer exactly as the answer route returned it.
          additionalProperties: true
        created_at: {type: string}

    ChatDetail:
      type: object
      additionalProperties: false
      required: [chat_id, folder_id, title, created_at, updated_at, turns]
      properties:
        chat_id: {type: string}
        folder_id: {type: [string, "null"]}
        title: {type: string, minLength: 1, maxLength: 200}
        created_at: {type: string}
        updated_at: {type: string}
        turns:
          type: array
          items: {$ref: "#/components/schemas/ChatTurnItem"}

    ChatList:
      type: object
      additionalProperties: false
      required: [status, folders, chats]
      properties:
        status: {type: string, enum: [ok]}
        folders:
          type: array
          items: {$ref: "#/components/schemas/ChatFolderItem"}
        chats:
          type: array
          items: {$ref: "#/components/schemas/ChatItem"}

    ChatEnvelope:
      type: object
      additionalProperties: false
      required: [status, chat]
      properties:
        status: {type: string, enum: [ok]}
        chat: {$ref: "#/components/schemas/ChatItem"}

    ChatDetailEnvelope:
      type: object
      additionalProperties: false
      required: [status, chat]
      properties:
        status: {type: string, enum: [ok]}
        chat: {$ref: "#/components/schemas/ChatDetail"}

    ChatTurnEnvelope:
      type: object
      additionalProperties: false
      required: [status, turn]
      properties:
        status: {type: string, enum: [ok]}
        turn:
          type: object
          additionalProperties: false
          required: [chat_id, position, created_at]
          properties:
            chat_id: {type: string}
            position: {type: integer, minimum: 1}
            created_at: {type: string}

    ChatFolderEnvelope:
      type: object
      additionalProperties: false
      required: [status, folder]
      properties:
        status: {type: string, enum: [ok]}
        folder: {$ref: "#/components/schemas/ChatFolderItem"}

    ChatDeleteCounts:
      type: object
      additionalProperties: false
      required: [status, chats, folders]
      properties:
        status: {type: string, enum: [ok]}
        chats: {type: integer, minimum: 0}
        folders: {type: integer, minimum: 0}

    ChatCreateRequest:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: {type: string, minLength: 1, maxLength: 200}
        folder_id: {type: [string, "null"], maxLength: 128}

    ChatMoveRequest:
      type: object
      additionalProperties: false
      required: [folder_id]
      properties:
        folder_id: {type: [string, "null"], maxLength: 128}

    ChatTurnRequest:
      type: object
      additionalProperties: false
      required: [collection, question, answer]
      properties:
        collection: {type: string, minLength: 1, maxLength: 512}
        question: {type: string, minLength: 1, maxLength: 10000}
        answer:
          type: object
          description: The finished answer. The encoded JSON may be at most 2 MiB.
          additionalProperties: true

    ChatBulkDeleteRequest:
      type: object
      additionalProperties: false
      required: [chat_ids]
      properties:
        chat_ids:
          type: array
          minItems: 1
          maxItems: 500
          items: {type: string}

    ChatFolderOrderRequest:
      type: object
      additionalProperties: false
      required: [folder_ids]
      properties:
        folder_ids:
          type: array
          minItems: 1
          maxItems: 500
          items: {type: string, maxLength: 128}

    ChatFolderOrderEnvelope:
      type: object
      additionalProperties: false
      required: [status, folders]
      properties:
        status: {type: string, enum: [ok]}
        folders:
          type: array
          items: {$ref: "#/components/schemas/ChatFolderItem"}

    ChatFolderRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 100}

    ProfileEnvelope:
      type: object
      additionalProperties: false
      required: [status, profile]
      properties:
        status:
          type: string
          enum: [ok]
        profile:
          $ref: "#/components/schemas/ProfileItem"

    ProfileDetailEnvelope:
      type: object
      additionalProperties: false
      required: [status, profile]
      properties:
        status:
          type: string
          enum: [ok]
        profile:
          $ref: "#/components/schemas/ProfileDetail"

    EmbeddingIdentity:
      type: object
      additionalProperties: false
      required: [provider, model]
      properties:
        provider:
          type: string
        model:
          type: string

    EmbeddingProviderItem:
      type: object
      additionalProperties: false
      required: [name, available, reason]
      properties:
        name:
          type: string
        available:
          type: boolean
        reason:
          type: [string, "null"]
          description: Null when available, else the extra to install.

    EmbeddingProviderList:
      type: object
      additionalProperties: false
      required: [status, providers, server_default]
      properties:
        status:
          type: string
          enum: [ok]
        providers:
          type: array
          items:
            $ref: "#/components/schemas/EmbeddingProviderItem"
        server_default:
          $ref: "#/components/schemas/EmbeddingIdentity"

    EmbeddingCheckRequest:
      type: object
      additionalProperties: false
      required: [model]
      properties:
        model:
          type: string
          minLength: 1
          maxLength: 512

    EmbeddingCheckResult:
      type: object
      additionalProperties: false
      required: [status, ok, dimensions, norm, reason]
      properties:
        status:
          type: string
          enum: [ok]
        ok:
          type: boolean
        dimensions:
          type: [integer, "null"]
          description: The vector size. Null when the provider returned no vector.
        norm:
          type: [number, "null"]
          description: The L2 length of the probe vector. Null when there is none.
        reason:
          type: [string, "null"]
          description: Null when the check passed, else a plain-English reason.

    ProfileEmbeddingRequest:
      type: object
      additionalProperties: false
      required: [provider, model]
      description: Both set choose a model. Both null return to the server default.
      properties:
        provider:
          type: [string, "null"]
          maxLength: 64
        model:
          type: [string, "null"]
          maxLength: 512

    ProfileEmbedding:
      type: object
      additionalProperties: false
      required: [provider, model, source, dimensions]
      description: The effective embedding model of a profile.
      properties:
        provider:
          type: string
        model:
          type: string
        source:
          type: string
          enum: [profile, server_default]
        dimensions:
          type: [integer, "null"]
          description: The vector size of the last passing check. Null for the server default.

    EmbeddingLockCollection:
      type: object
      additionalProperties: false
      required: [collection, provider, model, chunk_count]
      properties:
        collection:
          type: string
        provider:
          type: [string, "null"]
          description: Null when the model that made the vectors is not recorded.
        model:
          type: [string, "null"]
          description: Null when the model that made the vectors is not recorded.
        chunk_count:
          type: integer
          minimum: 0

    ProfileEmbeddingLock:
      type: object
      additionalProperties: false
      required: [locked, collections]
      properties:
        locked:
          type: boolean
          description: True while a collection that follows the profile holds vectors.
        collections:
          type: array
          items:
            $ref: "#/components/schemas/EmbeddingLockCollection"

    ProfileCreateRequest:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title:
          type: string
          maxLength: 4096
          description: >
            1 to 80 characters after trimming, with no control characters.
            The raw limit only caps the payload.
        description:
          type: [string, "null"]
          maxLength: 1000
        source:
          type: [string, "null"]
          maxLength: 128
          description: >
            A built-in profile id, a user profile id, or null for an empty
            profile.

    ProfileUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        title:
          type: [string, "null"]
          maxLength: 4096
        description:
          type: [string, "null"]
          maxLength: 1000

    ProfileChangeRequest:
      type: object
      additionalProperties: false
      required:
        - profile
      properties:
        profile:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{0,63}$"
          description: >
            `documents`, `codebase` or the id of a ready user profile.
            `hybrid` is not a profile and gives 400.
        confirm:
          type: boolean
          default: false
          description: >
            When false, returns a preview. When true, applies the change
            (needs `confirmation_token`).
        confirmation_token:
          type: [string, "null"]
          maxLength: 128
          description: Token from the preview `confirmation`.

    ProfilePreview:
      type: object
      additionalProperties: false
      required: [status, contract, confirm_required]
      properties:
        status:
          type: string
          enum: [preview]
        contract:
          type: object
          additionalProperties: false
          required:
            - collection
            - chunk_count
            - old_profile
            - new_profile
            - lever_impacts
            - reingest_pointer
          properties:
            collection:
              type: string
            new_profile:
              type: string
            old_profile:
              type: [string, "null"]
            chunk_count:
              type: integer
            lever_impacts:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [lever, change, timing]
                properties:
                  lever:
                    type: string
                  change:
                    type: string
                  timing:
                    type: string
                    enum: [query-time, ingest-time]
            reingest_pointer:
              type: string
            pipelines:
              type: array
              description: >
                Only for a user profile: its three pipelines with their
                current revision numbers.
              items:
                type: object
                additionalProperties: false
                required: [slot, title, revision_number]
                properties:
                  slot:
                    type: string
                    enum: [ingest, search, answer]
                  title:
                    type: string
                  revision_number:
                    type: [integer, "null"]
            notes:
              type: array
              description: Only for a user profile, what changes at once and at the next ingestion.
              items:
                type: string
        confirm_required:
          type: boolean
          enum: [true]
        confirmation:
          $ref: "#/components/schemas/Confirmation"

    ProfileChangeResult:
      type: object
      additionalProperties: false
      required: [status, collection, profile, chunk_count_unchanged]
      properties:
        status:
          type: string
          enum: [ok]
        collection:
          type: string
        profile:
          type: string
        chunk_count_unchanged:
          type: integer

    # ── Job resource (document jobs) ───────────────────────────────────
    Job:
      type: object
      additionalProperties: false
      required: [job_id, status, result, error, created_at, updated_at]
      properties:
        job_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued, running, completed, failed]
          description: >
            Current job state. `running` also covers a requested
            cancellation that has not stopped yet.
        result:
          type: [object, "null"]
          description: >
            Result payload when status is completed: the ingestion summary,
            or `{"map": "..."}` for a codebase map.
        error:
          type: [string, "null"]
          description: Redacted error message when status is failed.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ── Graph catalogue ────────────────────────────────────────────────
    OperationEntry:
      type: object
      additionalProperties: false
      required:
        - operation_id
        - version
        - title
        - family
        - description
        - parameters
        - inputs
        - outputs
        - capabilities
        - effect
        - bypass
        - collection_param
        - lever_params
        - option_params
        - free_text_params
        - index_shaping
        - available
        - unavailable_reasons
        - unavailable_options
        - inherited_values
        - adapter_ref
      properties:
        operation_id:
          type: string
          description: Stable id in `family.name` form, for example `retrieve.dense`.
        version:
          type: integer
        title:
          type: string
        family:
          type: string
        description:
          type: string
        parameters:
          type: object
          description: JSON Schema of the operation parameters.
        inputs:
          type: array
          items:
            $ref: "#/components/schemas/PortDescription"
        outputs:
          type: array
          items:
            $ref: "#/components/schemas/PortDescription"
        capabilities:
          type: array
          items:
            type: string
        effect:
          type: string
        bypass:
          type: [object, "null"]
        collection_param:
          type: [string, "null"]
        lever_params:
          type: object
          additionalProperties:
            type: [string, "null"]
        option_params:
          type: object
          description: >-
            Parameter name to the host option set that reports which of its
            choices the host cannot run.
          additionalProperties:
            type: string
        free_text_params:
          type: array
          items:
            type: string
        index_shaping:
          type: boolean
        available:
          type: boolean
        unavailable_reasons:
          type: array
          items:
            type: string
        unavailable_options:
          type: object
          description: >-
            Setting name to its choices the host cannot run, each with a reason.
            Empty for an operation without such settings. The operation stays
            available.
          additionalProperties:
            type: object
            additionalProperties:
              type: string
        inherited_values:
          type: object
          description: Setting name to the value that `null` inherits from the host.
          additionalProperties: true
        adapter_ref:
          type: string

    PortDescription:
      type: object
      required: [name, type, cardinality, description]
      properties:
        name:
          type: string
        type:
          type: object
        cardinality:
          type: string
        description:
          type: string

    OperationCatalogue:
      type: object
      additionalProperties: false
      required: [status, operations]
      properties:
        status:
          type: string
          enum: [ok]
        operations:
          type: array
          items:
            $ref: "#/components/schemas/OperationEntry"

    # ── Pipelines and revisions ────────────────────────────────────────
    PipelineRecord:
      type: object
      additionalProperties: false
      required: [pipeline_id, title, current_revision_id, layout, created_at, updated_at]
      properties:
        pipeline_id:
          type: string
        title:
          type: string
        current_revision_id:
          type: [string, "null"]
        layout:
          $ref: "#/components/schemas/GraphLayout"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    RevisionRecord:
      type: object
      additionalProperties: false
      required:
        - revision_id
        - pipeline_id
        - revision_number
        - content_hash
        - schema_version
        - document
        - created_at
      properties:
        revision_id:
          type: string
        pipeline_id:
          type: string
        revision_number:
          type: integer
          minimum: 1
        content_hash:
          type: string
        schema_version:
          type: integer
        document:
          type: object
          description: The normalised graph document.
        created_at:
          type: string
          format: date-time

    GraphLayout:
      type: object
      description: >
        Presentation layout. It never changes execution. Other keys are kept as
        sent. `direction` is the way the Studio Arrange action lays the graph
        out; absent means `horizontal`.
      additionalProperties: true
      properties:
        title: {type: string, maxLength: 200}
        positions:
          type: object
          additionalProperties:
            type: object
            required: [x, y]
            properties:
              x: {type: number}
              y: {type: number}
        viewport:
          type: object
          properties:
            x: {type: number}
            y: {type: number}
            zoom: {type: number, exclusiveMinimum: 0}
        selection:
          type: array
          items: {type: string}
        direction:
          type: string
          enum: [horizontal, vertical]

    LayoutRequest:
      type: object
      additionalProperties: false
      required: [layout]
      properties:
        layout:
          $ref: "#/components/schemas/GraphLayout"

    RevisionRequest:
      type: object
      additionalProperties: false
      required: [document]
      properties:
        document:
          type: object
          description: A graph document, or a wrapper with `graph` and `layout` keys.

    PipelineEnvelope:
      type: object
      additionalProperties: false
      required: [status, pipeline]
      properties:
        status:
          type: string
          enum: [ok]
        pipeline:
          $ref: "#/components/schemas/PipelineRecord"

    PipelineList:
      type: object
      additionalProperties: false
      required: [status, pipelines]
      properties:
        status:
          type: string
          enum: [ok]
        pipelines:
          type: array
          items:
            $ref: "#/components/schemas/PipelineRecord"

    PipelineDetail:
      type: object
      additionalProperties: false
      required: [status, pipeline, current_revision, profile_slot]
      properties:
        status:
          type: string
          enum: [ok]
        pipeline:
          $ref: "#/components/schemas/PipelineRecord"
        current_revision:
          oneOf:
            - $ref: "#/components/schemas/RevisionRecord"
            - type: "null"
        profile_slot:
          description: The profile and the slot that the pipeline fills, or null.
          oneOf:
            - type: object
              additionalProperties: false
              required: [profile_id, slot]
              properties:
                profile_id:
                  type: string
                slot:
                  type: string
                  enum: [ingest, search, answer]
            - type: "null"

    RevisionSaved:
      type: object
      additionalProperties: false
      required: [status, revision, created]
      properties:
        status:
          type: string
          enum: [ok]
        revision:
          $ref: "#/components/schemas/RevisionRecord"
        created:
          type: boolean
          description: False when identical content already existed.
        affected_collections:
          type: array
          description: >
            Only for a pipeline of a user profile: the collections that use
            the profile (maybe none).
          items:
            type: string

    RevisionList:
      type: object
      additionalProperties: false
      required: [status, revisions]
      properties:
        status:
          type: string
          enum: [ok]
        revisions:
          type: array
          items:
            $ref: "#/components/schemas/RevisionRecord"

    RevisionEnvelope:
      type: object
      additionalProperties: false
      required: [status, revision]
      properties:
        status:
          type: string
          enum: [ok]
        revision:
          $ref: "#/components/schemas/RevisionRecord"

    # ── Graph validation ───────────────────────────────────────────────
    ValidateRequest:
      type: object
      additionalProperties: false
      required: [document]
      properties:
        document:
          type: object
        inputs:
          type: [object, "null"]
          description: Run inputs. When given, the check is the admission check.
        collection:
          type: [string, "null"]
          minLength: 1
          maxLength: 128
          description: >
            Default collection for nodes that do not bind one. The graph
            or the collection profile resolves it when omitted.

    DraftValidation:
      type: object
      additionalProperties: false
      required: [status, valid, admitted, order, resolved_versions, collections, nodes]
      properties:
        status:
          type: string
          enum: [ok]
        valid:
          type: boolean
          enum: [true]
        admitted:
          type: boolean
          enum: [false]
        order:
          type: array
          items:
            type: string
        resolved_versions:
          type: object
          additionalProperties:
            type: integer
        collections:
          type: object
          description: Node id to bound collection name.
          additionalProperties:
            type: string
        nodes:
          type: array
          description: >
            The effective value of each step setting, with its source, for
            every node whose parameters passed validation. No run inputs are
            needed.
          items:
            $ref: "#/components/schemas/DraftNode"

    DraftNode:
      type: object
      additionalProperties: false
      required: [node_id, controls]
      properties:
        node_id:
          type: string
        controls:
          type: array
          items:
            $ref: "#/components/schemas/EffectiveControl"

    EffectiveControl:
      type: object
      additionalProperties: false
      required: [lever, value, source, detail]
      properties:
        lever:
          type: string
        value:
          description: Effective value (any JSON value).
        source:
          type: string
          enum: [node, graph, environment, profile]
        detail:
          type: string

    AdmissionValidation:
      type: object
      additionalProperties: false
      required: [status, valid, admitted, graph_identity, order, collections, nodes]
      properties:
        status:
          type: string
          enum: [ok]
        valid:
          type: boolean
          enum: [true]
        admitted:
          type: boolean
          enum: [true]
        graph_identity:
          type: string
        order:
          type: array
          items:
            type: string
        collections:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, profile, profile_origin]
            properties:
              name:
                type: string
              profile:
                type: string
              profile_origin:
                type: string
                enum: [collection, graph]
        nodes:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [node_id, operation, version, enabled, collection, controls]
            properties:
              node_id:
                type: string
              operation:
                type: string
              version:
                type: integer
              enabled:
                type: boolean
              collection:
                type: [string, "null"]
              controls:
                type: array
                items:
                  $ref: "#/components/schemas/EffectiveControl"

    # ── Graph runs ─────────────────────────────────────────────────────
    RunStatus:
      type: string
      enum: [queued, running, cancelling, succeeded, failed, cancelled, interrupted]

    SubmitRunRequest:
      type: object
      additionalProperties: false
      required: [revision_id]
      properties:
        revision_id:
          type: string
          minLength: 1
          maxLength: 64
        inputs:
          type: object
          default: {}
          description: Run inputs. Values must not hold credentials.
        origin:
          type: string
          enum: [submit, repeat]
          default: submit
        experiment_context:
          type: [string, "null"]
          minLength: 1
          maxLength: 64
          description: >
            Run in this approved experiment context. The run records
            `resources.experiment` (context id, graph identity, backend and
            index identity). Omitted means the live library.

    RunRecord:
      type: object
      additionalProperties: false
      required:
        - run_id
        - pipeline_id
        - revision_id
        - graph_hash
        - status
        - origin
        - source_run_id
        - settings
        - resources
        - inputs
        - failure
        - result_ref
        - last_sequence
        - created_at
        - started_at
        - finished_at
      properties:
        run_id:
          type: string
        pipeline_id:
          type: string
        revision_id:
          type: string
        graph_hash:
          type: string
        status:
          $ref: "#/components/schemas/RunStatus"
        origin:
          type: string
          enum: [submit, repeat, retry]
        source_run_id:
          type: [string, "null"]
          description: The run a retry repeats.
        settings:
          type: object
          description: Redacted settings resolved at admission, per collection.
        resources:
          type: object
          description: >
            Identities resolved at admission. Graph runs record
            `graph_identity`, `operations` (node id to `operation@version`),
            `controls` (node id to the admitted `EffectiveControl` list) and
            `index`: `backend` (store kind, location, embedding identity,
            `index_identity`, `store_class`) and `collections` (name to
            `{exists, data_version, version_scope}`; `version_scope` is
            `durable`, or `process-local` with a `generation` counter that is
            valid in the server process only). Experiment runs add
            `experiment` and `artefact_root`.
        inputs:
          type: object
        failure:
          type: [object, "null"]
          description: "`{reason, error, ...}` for a failed, cancelled or interrupted run."
        result_ref:
          type: [string, "null"]
        last_sequence:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
        started_at:
          type: [string, "null"]
          format: date-time
        finished_at:
          type: [string, "null"]
          format: date-time

    RunEnvelope:
      type: object
      additionalProperties: false
      required: [status, run]
      properties:
        status:
          type: string
          enum: [ok]
        run:
          $ref: "#/components/schemas/RunRecord"

    RunList:
      type: object
      additionalProperties: false
      required: [status, runs]
      properties:
        status:
          type: string
          enum: [ok]
        runs:
          type: array
          items:
            $ref: "#/components/schemas/RunRecord"

    RunResult:
      type: object
      additionalProperties: false
      required: [status, run_id, result]
      properties:
        status:
          type: string
          enum: [ok]
        run_id:
          type: string
        result:
          type: object
          description: >
            The redacted pipeline result: run id, status, graph identity,
            outputs, node outcomes, failed node, completed effects, wall
            time, error and the admitted node controls.
          required: [run_id, status, graph_identity, outputs]
          properties:
            run_id:
              type: string
            status:
              type: string
            graph_identity:
              type: string
            outputs:
              type: object
            nodes:
              type: array
              items:
                $ref: "#/components/schemas/NodeOutcome"
            controls:
              type: object
              description: Node id to the admitted controls of that node.
              additionalProperties:
                type: array
                items:
                  $ref: "#/components/schemas/EffectiveControl"

    RunArtefact:
      type: object
      additionalProperties: false
      required: [status, run_id, name, value]
      properties:
        status:
          type: string
          enum: [ok]
        run_id:
          type: string
        name:
          type: string
        value:
          description: >
            The full redacted value. Credentials are removed and raw
            vectors are replaced by an omission marker.

    NodeOutcome:
      type: object
      required: [node_id, status]
      description: What happened to one node in one unit.
      properties:
        node_id:
          type: string
        status:
          type: string
        error:
          type: [string, "null"]
        fallback:
          type: [string, "null"]
          description: The domain fallback reason, when one applied.
        effects:
          type: array
          items:
            type: string
        duration_s:
          type: [number, "null"]
        unit_id:
          type: [string, "null"]
        summary:
          type: object
          description: >
            Bounded, redacted node summary, the data of its completed or
            bypassed event. For example a reranker switched off records
            `{reranked: false, reason}`; a node disabled in the graph
            records the bypass reason. A cut summary adds
            `truncated: true` and an `artefact_ref`; `getRunArtefact`
            returns the full value.

    RunEventRecord:
      type: object
      additionalProperties: false
      required: [run_id, sequence, kind, node_id, unit_id, summary, created_at]
      properties:
        run_id:
          type: string
        sequence:
          type: integer
          minimum: 1
        kind:
          type: string
          description: Event kind, for example `run.started` or `node.finished`.
        node_id:
          type: [string, "null"]
        unit_id:
          type: [string, "null"]
        summary:
          type: object
        created_at:
          type: string
          format: date-time

    RunEventPage:
      type: object
      additionalProperties: false
      required: [status, run_id, run_status, events, last_sequence, complete]
      properties:
        status:
          type: string
          enum: [ok]
        run_id:
          type: string
        run_status:
          $ref: "#/components/schemas/RunStatus"
        events:
          type: array
          items:
            $ref: "#/components/schemas/RunEventRecord"
        last_sequence:
          type: integer
          minimum: 0
          description: Send this value as the next `after_sequence`.
        complete:
          type: boolean

    JobEventPage:
      type: object
      additionalProperties: false
      required: [status, job_id, job_status, events, last_sequence, complete]
      properties:
        status:
          type: string
          enum: [ok]
        job_id:
          type: string
        job_status:
          type: string
          enum: [queued, running, completed, failed]
        events:
          type: array
          items:
            $ref: "#/components/schemas/RunEventRecord"
        last_sequence:
          type: integer
          minimum: 0
          description: Send this value as the next `after_sequence`.
        complete:
          type: boolean

    StreamEnd:
      type: object
      additionalProperties: false
      required: [status, last_sequence]
      description: Data of the final `run.end` server-sent event.
      properties:
        status:
          $ref: "#/components/schemas/RunStatus"
        last_sequence:
          type: integer
          minimum: 0

    StreamClosing:
      type: object
      additionalProperties: false
      required: [reason]
      description: Data of the `server.closing` server-sent event.
      properties:
        reason:
          type: string

    AnswerStageEvent:
      type: object
      additionalProperties: false
      required: [stage, sequence, elapsed_ms]
      description: >
        Data of one `stage` server-sent event of `streamAnswer`. It never
        holds question, passage or answer text, model or provider names,
        keys, paths or error text.
      properties:
        stage:
          type: string
          enum: [searching, writing, citing, verifying]
        sequence:
          type: integer
          minimum: 1
          description: Starts at 1 and rises by 1 for each stage frame.
        elapsed_ms:
          type: integer
          minimum: 0
          description: Milliseconds since the request was admitted.

    # ── Workspace cleanup ──────────────────────────────────────────────
    CleanupSelector:
      type: object
      additionalProperties: false
      description: Every given criterion must hold. Only finished runs are selected.
      properties:
        older_than_days:
          type: [number, "null"]
          minimum: 0
        statuses:
          type: array
          maxItems: 8
          default: []
          items:
            type: string
          description: Terminal statuses (succeeded, failed, cancelled, interrupted).
        run_id:
          type: [string, "null"]
          minLength: 1
          maxLength: 64

    CleanupPreviewRequest:
      type: object
      additionalProperties: false
      required: [selector]
      properties:
        selector:
          $ref: "#/components/schemas/CleanupSelector"

    CleanupApplyRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
        selector:
          description: When given, it must equal the previewed selector.
          oneOf:
            - $ref: "#/components/schemas/CleanupSelector"
            - type: "null"

    CleanupItem:
      type: object
      additionalProperties: false
      required: [item, reason]
      properties:
        item:
          type: string
        reason:
          type: string

    CleanupPreviewEnvelope:
      type: object
      additionalProperties: false
      required: [status, preview]
      properties:
        status:
          type: string
          enum: [ok]
        preview:
          type: object
          additionalProperties: false
          required: [token, selector, expires_at, runs, skipped, warnings, totals]
          properties:
            token:
              type: string
            selector:
              type: object
              additionalProperties: false
              required: [older_than_days, statuses, run_id]
              properties:
                older_than_days:
                  type: [number, "null"]
                statuses:
                  type: array
                  items:
                    type: string
                run_id:
                  type: [string, "null"]
            expires_at:
              type: string
              format: date-time
            runs:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [run_id, status, finished_at, events, files]
                properties:
                  run_id:
                    type: string
                  status:
                    $ref: "#/components/schemas/RunStatus"
                  finished_at:
                    type: [string, "null"]
                  events:
                    type: integer
                  files:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [ref, bytes]
                      properties:
                        ref:
                          type: string
                        bytes:
                          type: integer
            skipped:
              type: array
              items:
                $ref: "#/components/schemas/CleanupItem"
            warnings:
              type: array
              items:
                type: string
            totals:
              type: object
              additionalProperties: false
              required: [runs, events, files, bytes]
              properties:
                runs:
                  type: integer
                events:
                  type: integer
                files:
                  type: integer
                bytes:
                  type: integer

    CleanupResultEnvelope:
      type: object
      additionalProperties: false
      required: [status, result]
      properties:
        status:
          type: string
          enum: [ok]
        result:
          type: object
          additionalProperties: false
          required:
            - runs_removed
            - events_removed
            - files_removed
            - bytes_removed
            - failed
            - skipped
          properties:
            runs_removed:
              type: integer
            events_removed:
              type: integer
            files_removed:
              type: integer
            bytes_removed:
              type: integer
            failed:
              type: array
              items:
                $ref: "#/components/schemas/CleanupItem"
            skipped:
              type: array
              items:
                $ref: "#/components/schemas/CleanupItem"

    # ── Templates ───────────────────────────────────────────────────────
    PipelineTemplate:
      type: object
      additionalProperties: false
      required: [name, title, description, standard_operation, document, outputs]
      properties:
        name:
          type: string
          enum: [ingestion, search, answer]
        title:
          type: string
        description:
          type: string
        standard_operation:
          type: string
          description: The Engine method the template reproduces.
        document:
          type: object
          description: Editable graph document; save it as a revision before a run.
        outputs:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, description]
            properties:
              name:
                type: string
              description:
                type: string

    PipelineTemplateList:
      type: object
      additionalProperties: false
      required: [status, templates]
      properties:
        status:
          type: string
          enum: [ok]
        templates:
          type: array
          items:
            $ref: "#/components/schemas/PipelineTemplate"

    # ── Experiment contexts ─────────────────────────────────────────────
    ExperimentError:
      type: object
      additionalProperties: false
      required: [status, code, message]
      description: >
        A refused experiment request. `code` is stable, for example
        `live_library_target`, `experiment_scope_mismatch`,
        `experiment_credential_required`, `experiment_context_unknown`,
        `experiment_context_revoked`, `action_not_permitted`,
        `commit_outside_context`, or a path check code such as
        `outside_root`, `traversal` or `symlink_escape`.
      properties:
        status:
          type: string
          enum: [error]
        code:
          type: string
        message:
          type: string
        context_id:
          type: [string, "null"]

    ExperimentRequest:
      type: object
      additionalProperties: false
      required: [workspace]
      properties:
        workspace:
          type: string
          minLength: 1
          maxLength: 4096
          description: Absolute path of an existing directory below an approved experiment root.
        name:
          type: string
          maxLength: 80
          default: ""
        actions:
          type: [array, "null"]
          minItems: 1
          maxItems: 2
          items:
            type: string
            enum: [read, ingest]
          description: Permitted actions. Omitted means both; `ingest` permits commit nodes.
        store_backend:
          type: string
          minLength: 1
          maxLength: 32
          default: lancedb
          description: "`chroma` (local) needs `store` in `declared_factors`."
        declared_factors:
          type: array
          maxItems: 8
          default: []
          items:
            type: string

    ExperimentRecord:
      type: object
      additionalProperties: false
      required:
        - context_id
        - name
        - root
        - workspace
        - output_dir
        - store_backend
        - declared_factors
        - actions
        - approved_at
        - revoked_at
        - status
      properties:
        context_id:
          type: string
        name:
          type: string
        root:
          type: string
        workspace:
          type: string
        output_dir:
          type: string
        store_backend:
          type: string
        declared_factors:
          type: array
          items:
            type: string
        actions:
          type: array
          items:
            type: string
        approved_at:
          type: string
          format: date-time
        revoked_at:
          type: [string, "null"]
          format: date-time
        status:
          type: string
          enum: [active, revoked]

    BackendIdentity:
      type: object
      additionalProperties: false
      required:
        - context_id
        - store_kind
        - store_path
        - embedding_provider
        - embedding_model
        - index_identity
      properties:
        context_id:
          type: [string, "null"]
        store_kind:
          type: string
        store_path:
          type: string
        embedding_provider:
          type: string
        embedding_model:
          type: string
        index_identity:
          type: string
          description: Short hash of the store location and embedding identity.

    ExperimentDetail:
      type: object
      additionalProperties: false
      required: [status, experiment, identity]
      properties:
        status:
          type: string
          enum: [ok]
        experiment:
          $ref: "#/components/schemas/ExperimentRecord"
        identity:
          $ref: "#/components/schemas/BackendIdentity"

    ExperimentCreated:
      type: object
      additionalProperties: false
      required: [status, experiment, identity, trust_notice]
      properties:
        status:
          type: string
          enum: [ok]
        experiment:
          $ref: "#/components/schemas/ExperimentRecord"
        identity:
          $ref: "#/components/schemas/BackendIdentity"
        trust_notice:
          type: string

    ExperimentFolderRequest:
      type: object
      additionalProperties: false
      required: [path]
      properties:
        path:
          type: string
          minLength: 1
          maxLength: 4096
          description: Relative folder path below the root, for example `hybrid-search/run-1`.
        root:
          type: [string, "null"]
          minLength: 1
          maxLength: 4096
          description: Approved root. Needed only when more than one root is approved.

    ExperimentFolder:
      type: object
      additionalProperties: false
      required: [root, path, name, workspace]
      properties:
        root:
          type: string
        path:
          type: string
          description: Path below the root, with `/` between segments.
        name:
          type: string
        workspace:
          type: string
          description: Absolute path, ready for `POST /v1/experiments`.

    ExperimentFolderCreated:
      type: object
      additionalProperties: false
      required: [status, folder]
      properties:
        status:
          type: string
          enum: [ok]
        folder:
          $ref: "#/components/schemas/ExperimentFolder"

    ExperimentFolderNode:
      type: object
      additionalProperties: false
      required: [name, path, workspace, context_id, children]
      properties:
        name:
          type: string
        path:
          type: string
          description: Path below the root, with `/` between segments.
        workspace:
          type: string
        context_id:
          type: [string, "null"]
          description: The active context registered at this directory, else null.
        children:
          type: array
          items:
            $ref: "#/components/schemas/ExperimentFolderNode"

    ExperimentList:
      type: object
      additionalProperties: false
      required: [status, roots, folders, experiments, trust_notice]
      properties:
        status:
          type: string
          enum: [ok]
        roots:
          type: array
          items:
            type: string
        folders:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [root, tree]
            properties:
              root:
                type: string
              tree:
                type: array
                items:
                  $ref: "#/components/schemas/ExperimentFolderNode"
        experiments:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [experiment, identity]
            properties:
              experiment:
                $ref: "#/components/schemas/ExperimentRecord"
              identity:
                $ref: "#/components/schemas/BackendIdentity"
        trust_notice:
          type: string

    ExperimentRevoked:
      type: object
      additionalProperties: false
      required: [status, experiment]
      properties:
        status:
          type: string
          enum: [ok]
        experiment:
          $ref: "#/components/schemas/ExperimentRecord"

    # ── Notebook plugins ────────────────────────────────────────────────
    PluginState:
      type: object
      additionalProperties: false
      required: [name, status, message, executable, version, launchable, display_name, tool]
      properties:
        name:
          type: string
        status:
          type: string
          enum: [compatible, incompatible, unchecked, needs_approval, unavailable]
        message:
          type: string
          description: What the operator can do next.
        executable:
          type: string
        version:
          type: [string, "null"]
        launchable:
          type: boolean
        display_name:
          type: [string, "null"]
        tool:
          type: [string, "null"]

    EditorInfo:
      type: object
      additionalProperties: false
      required: [launch_id, plugin, notebook, experiment_context, url_without_token]
      properties:
        launch_id:
          type: string
        plugin:
          type: string
        notebook:
          type: string
        experiment_context:
          type: [string, "null"]
        url_without_token:
          type: string
          description: Loopback editor URL. It never holds the access token.

    PluginList:
      type: object
      additionalProperties: false
      required: [status, plugins, editors, install_hint, trust_notice]
      properties:
        status:
          type: string
          enum: [ok]
        plugins:
          type: array
          items:
            $ref: "#/components/schemas/PluginState"
        editors:
          type: array
          items:
            $ref: "#/components/schemas/EditorInfo"
        install_hint:
          type: string
        trust_notice:
          type: string

    RegisterPluginRequest:
      type: object
      additionalProperties: false
      required: [manifest_path, executable_path, approved]
      properties:
        manifest_path:
          type: string
          minLength: 1
          maxLength: 4096
        executable_path:
          type: string
          minLength: 1
          maxLength: 4096
        approved:
          type: boolean
          description: Must be true. Registration is an explicit trust decision.

    PluginEnvelope:
      type: object
      additionalProperties: false
      required: [status, plugin]
      properties:
        status:
          type: string
          enum: [ok]
        plugin:
          $ref: "#/components/schemas/PluginState"
        trust_notice:
          type: string

    PluginUnregistered:
      type: object
      additionalProperties: false
      required: [status, name, unregistered]
      properties:
        status:
          type: string
          enum: [ok]
        name:
          type: string
        unregistered:
          type: boolean
          enum: [true]

    OpenEditorRequest:
      type: object
      additionalProperties: false
      required: [notebook, experiment_context, consent]
      properties:
        notebook:
          type: string
          minLength: 1
          maxLength: 1024
          description: Relative `.py` path inside the experiment workspace.
        experiment_context:
          type: string
          minLength: 1
          maxLength: 64
        consent:
          type: boolean
          description: Must be true. The notebook runs Python with your permissions.

    EditorOpened:
      type: object
      additionalProperties: false
      required:
        - status
        - launch_id
        - plugin
        - notebook
        - experiment_context
        - url_without_token
        - token_delivery
        - trust_notice
      properties:
        status:
          type: string
          enum: [ok]
        launch_id:
          type: string
        plugin:
          type: string
        notebook:
          type: string
        experiment_context:
          type: [string, "null"]
        url_without_token:
          type: string
        token_delivery:
          type: object
          additionalProperties: false
          required: [method, token]
          description: The editor access token, shown only in this response.
          properties:
            method:
              type: string
              enum: [response_body_once]
            token:
              type: string
        trust_notice:
          type: string

    EditorStopped:
      type: object
      additionalProperties: false
      required: [status, launch_id, stopped]
      properties:
        status:
          type: string
          enum: [ok]
        launch_id:
          type: string
        stopped:
          type: boolean
          enum: [true]

    # ── Integrations ────────────────────────────────────────────────────
    Integration:
      type: object
      additionalProperties: false
      required: [id, name, purpose, extra, install_command, pip_command, availability, installable, install_reason, packages]
      properties:
        id:
          type: string
          description: The extra name, or `magika`.
        name:
          type: string
        purpose:
          type: string
          description: One-line description.
        extra:
          type: [string, "null"]
          description: The pip extra, or null for an always-on integration.
        install_command:
          type: [string, "null"]
          description: >
            Copy-ready command for this install type, or null without an
            extra. `uv-tool`: `uv tool install --reinstall
            "omrs[<receipt extras>,<extra>] @ <receipt source>"` with the home
            folder written as `~` (the lasting command). `checkout`: `uv sync
            --extra <extra>`. `other`: `pip install "omrs[<extra>]"`.
        pip_command:
          type: [string, "null"]
          description: Copy-ready `pip install "omrs[<extra>]"`, or null without an extra.
        availability:
          type: string
          enum: [available, not-installed, unknown, restart-needed]
          description: >
            `unknown` means the probe failed or reported a broken install.
            `restart-needed` means an install from the app succeeded in this
            launch and the server must restart to use it.
        installable:
          type: boolean
          description: Whether `POST /v1/integrations/{extra}/install` would start an install now.
        install_reason:
          type: [string, "null"]
          enum: [not-installable-here, not-uv-tool, uv-not-found, already-installed, no-requirements, null]
          description: Why `installable` is false, or null when it is true.
        packages:
          type: array
          items:
            type: string
          description: >
            Requirements the installed OMRS package declares for the extra,
            without the extra marker (for example
            `llama-index-llms-anthropic>=0.11.0`). Empty without an extra.

    IntegrationList:
      type: object
      additionalProperties: false
      required: [status, install_type, integrations]
      properties:
        status:
          type: string
          enum: [ok]
        install_type:
          type: string
          enum: [uv-tool, checkout, other]
          description: >
            `uv-tool` when `uv-receipt.toml` sits in the server's own Python
            environment folder, `checkout` when the package runs from a folder
            with `pyproject.toml` and `uv.lock`, else `other`.
        integrations:
          type: array
          items:
            $ref: "#/components/schemas/Integration"

    IntegrationInstall:
      type: object
      additionalProperties: false
      required: [state, extra, started_at, finished_at, reason, exit_code, output]
      properties:
        state:
          type: string
          enum: [idle, running, succeeded, failed]
        extra:
          type: [string, "null"]
          description: The extra of the running or last install; null when idle.
        started_at:
          type: [string, "null"]
          format: date-time
        finished_at:
          type: [string, "null"]
          format: date-time
        reason:
          type: [string, "null"]
          enum: [exit-code, timed-out, start-failed, null]
          description: Why the install failed; null unless `state` is `failed`.
        exit_code:
          type: [integer, "null"]
        output:
          type: array
          maxItems: 40
          items:
            type: string
          description: The last output lines, redacted.

    IntegrationInstallReply:
      type: object
      additionalProperties: false
      required: [status, install]
      properties:
        status:
          type: string
          enum: [ok]
        install:
          $ref: "#/components/schemas/IntegrationInstall"

    # ── Provider connections ────────────────────────────────────────────
    ProviderField:
      type: object
      additionalProperties: false
      required: [id, label, kind, required, min, max, value, source, locked, lock_reason, set, last4, state]
      properties:
        id:
          type: string
        label:
          type: string
        kind:
          type: string
          enum: [url, secret, int]
        min:
          type: [integer, "null"]
          description: Smallest allowed value of an `int` field; null for other kinds.
        max:
          type: [integer, "null"]
          description: Largest allowed value of an `int` field; null for other kinds.
        required:
          type: boolean
          description: >
            Whether Chat needs a value here to be ready. A key that is not
            required (for example a local OpenAI-compatible server) does not
            block Chat while empty.
        value:
          type: [string, integer, "null"]
          description: The address in use, or the number of an `int` field. A key field holds null.
        source:
          type: string
          enum: [env, dotenv, config-file, keychain, key-file, default, none]
        locked:
          type: boolean
        lock_reason:
          type: [string, "null"]
        set:
          type: boolean
          description: Whether a value is set. A key value is never returned.
        last4:
          type: [string, "null"]
          maxLength: 4
          description: The last four characters of a key of 16 or more characters.
        state:
          type: [string, "null"]
          enum: [keychain-missing, keychain-unreadable, null]

    ProviderReadOnlyValue:
      type: object
      additionalProperties: false
      required: [label, value]
      properties:
        label:
          type: string
        value:
          type: string

    Connection:
      type: object
      additionalProperties: false
      required:
        [provider, display_name, locality, installed, install_hint, extra, fields, read_only, roles]
      properties:
        provider:
          type: string
        display_name:
          type: string
        locality:
          type: string
          enum: [local, cloud]
        installed:
          type: boolean
        install_hint:
          type: [string, "null"]
        extra:
          type: [string, "null"]
          description: >
            The `pyproject.toml` extra that supplies the provider, or null when the base
            install has it. The install command is `uv sync --extra <extra>`.
        fields:
          type: array
          items:
            $ref: "#/components/schemas/ProviderField"
        read_only:
          type: array
          items:
            $ref: "#/components/schemas/ProviderReadOnlyValue"
        roles:
          type: array
          items:
            type: string
            enum: [embeddings, answers, metadata, verification]

    ConnectionList:
      type: object
      additionalProperties: false
      required: [status, revision, config_dir, user_config_dir, keychain, connections]
      properties:
        status:
          type: string
          enum: [ok]
        revision:
          type: string
          description: >
            Stamp of `omrs.jsonc` (SHA-256 of its bytes, or `absent`). A save may send it back;
            a file that changed since gives 409.
        config_dir:
          type: string
          description: The server's working directory. The settings read `<config_dir>/.env`.
        user_config_dir:
          type: string
          description: >
            The user config folder, with `~` for the home folder.
            It holds `omrs.jsonc` and `secrets/<provider>.key`.
        keychain:
          type: string
          enum: [available, unavailable]
        connections:
          type: array
          items:
            $ref: "#/components/schemas/Connection"

    ConnectionTestResult:
      type: object
      additionalProperties: false
      required: [status, reachable, reason]
      properties:
        status:
          type: string
          enum: [ok]
        reachable:
          type: boolean
        reason:
          type: [string, "null"]
          pattern: "^(refused|timeout|unauthorised|not-configured|http-[0-9]{3})$"
          description: Null when reachable.

    ChatChoice:
      type: object
      additionalProperties: false
      required: [provider, model]
      properties:
        provider:
          type: string
          minLength: 1
          maxLength: 64
        model:
          type: string
          minLength: 1
          maxLength: 200

    ChatSaveRequest:
      type: [object, "null"]
      additionalProperties: false
      properties:
        provider:
          type: [string, "null"]
          minLength: 1
          maxLength: 64
        model:
          type: [string, "null"]
          minLength: 1
          maxLength: 200
        reasoning:
          type: [string, "null"]
          maxLength: 32
          pattern: "^(?:[A-Za-z0-9_-]{1,32})?$"
          description: >
            The reasoning level, written in the same save. `""` removes the saved level, so
            the provider default applies. Left out, the saved level stays.
        revision:
          type: [string, "null"]
          maxLength: 128
          description: >
            The `revision` last read. A file that changed since gives 409 with
            "omrs.jsonc changed on disk. Reload to see the new values." and nothing is written.

    ChatSettings:
      type: object
      additionalProperties: false
      required:
        - status
        - revision
        - provider
        - model
        - source
        - locked
        - lock_reason
        - enabled
        - ready
        - reason
        - reasoning
        - reasoning_locked
        - reasoning_lock_reason
        - reasoning_ignored
      properties:
        status:
          type: string
          enum: [ok]
        revision:
          type: string
          description: >
            Stamp of `omrs.jsonc` (SHA-256 of its bytes, or `absent`). A save may send it back;
            a file that changed since gives 409.
        provider:
          type: string
        model:
          type: string
        source:
          type: string
          enum: [env, dotenv, config-file, default]
        locked:
          type: boolean
        lock_reason:
          type: [string, "null"]
        enabled:
          type: boolean
        ready:
          type: boolean
        reason:
          type: [string, "null"]
          enum: [disabled, unknown-provider, not-installed, not-configured, null]
        reasoning:
          type: string
          description: The saved reasoning level. `""` means the provider default.
        reasoning_locked:
          type: boolean
          description: True when the environment or `.env` sets the level. A save that sends it gives 409.
        reasoning_lock_reason:
          type: [string, "null"]
        reasoning_ignored:
          type: boolean
          description: True when the provider sends no reasoning level to the model.

    JudgeSaveRequest:
      type: [object, "null"]
      additionalProperties: false
      properties:
        provider:
          type: [string, "null"]
          minLength: 1
          maxLength: 64
          description: A registered LLM provider name. The aliases `cloud` and `local` are refused.
        model:
          type: [string, "null"]
          minLength: 1
          maxLength: 200
        reasoning:
          type: [string, "null"]
          maxLength: 32
          pattern: "^(?:[A-Za-z0-9_-]{1,32})?$"
          description: >
            The reasoning level, written in the same save. `""` removes the saved level, so
            the provider default applies. Left out, the saved level stays.
        revision:
          type: [string, "null"]
          maxLength: 128
          description: >
            The `revision` last read. A file that changed since gives 409 with
            "omrs.jsonc changed on disk. Reload to see the new values." and nothing is written.

    JudgeSettings:
      type: object
      additionalProperties: false
      required:
        - status
        - revision
        - provider
        - resolved_provider
        - model
        - source
        - locked
        - lock_reason
        - enabled
        - ready
        - reason
        - reasoning
        - reasoning_locked
        - reasoning_lock_reason
        - reasoning_ignored
      properties:
        status:
          type: string
          enum: [ok]
        revision:
          type: string
          description: >
            Stamp of `omrs.jsonc` (SHA-256 of its bytes, or `absent`). A save may send it back;
            a file that changed since gives 409.
        provider:
          type: string
          description: The judge provider as set, a registry name or the alias `cloud` or `local`.
        resolved_provider:
          type: string
          description: The registry provider that `provider` resolves to.
        model:
          type: string
          description: The judge model in force. `""` when none is set.
        source:
          type: string
          enum: [env, dotenv, config-file, default]
        locked:
          type: boolean
        lock_reason:
          type: [string, "null"]
        enabled:
          type: boolean
        ready:
          type: boolean
        reason:
          type: [string, "null"]
          enum: [disabled, unknown-provider, not-installed, not-configured, no-model, null]
        reasoning:
          type: string
          description: The saved reasoning level. `""` means the provider default.
        reasoning_locked:
          type: boolean
          description: True when the environment or `.env` sets the level. A save that sends it gives 409.
        reasoning_lock_reason:
          type: [string, "null"]
        reasoning_ignored:
          type: boolean
          description: True when the provider sends no reasoning level to the model.

    ReasoningLevels:
      oneOf:
        - type: object
          additionalProperties: false
          required: [status, known, ignored]
          properties:
            status:
              type: string
              enum: [ok]
            known:
              const: false
            ignored:
              type: boolean
        - type: object
          additionalProperties: false
          required: [status, known, levels, default, mandatory, ignored]
          properties:
            status:
              type: string
              enum: [ok]
            known:
              const: true
            levels:
              type: array
              minItems: 1
              items:
                type: string
                pattern: "^[A-Za-z0-9_-]{1,32}$"
            default:
              type: [string, "null"]
              description: The level the provider uses when none is sent, or null when not published.
            mandatory:
              type: boolean
              description: True when the model always reasons; no level turns it off.
            ignored:
              type: boolean
              description: True when the provider sends no reasoning level to the model.

    UsageCredit:
      oneOf:
        - type: object
          additionalProperties: false
          required: [status, available]
          properties:
            status:
              type: string
              enum: [ok]
            available:
              const: false
        - type: object
          additionalProperties: false
          required: [status, available, limit_usd, remaining_usd]
          properties:
            status:
              type: string
              enum: [ok]
            available:
              const: true
            limit_usd:
              type: number
              description: The key's spending limit in US dollars.
            remaining_usd:
              type: number
              description: The part of the limit left, in US dollars.

    ChatTestResult:
      type: object
      additionalProperties: false
      required: [status, ok, reason, elapsed_ms]
      properties:
        status:
          type: string
          enum: [ok]
        ok:
          type: boolean
        reason:
          type: [string, "null"]
          pattern: "^(refused|timeout|unauthorised|not-installed|not-configured|empty-reply|failed|http-[0-9]{3})$"
        elapsed_ms:
          type: integer
          minimum: 0

    ProviderModels:
      type: object
      additionalProperties: false
      required: [status, reachable, reason, models, truncated]
      properties:
        status:
          type: string
          enum: [ok]
        reachable:
          type: boolean
        reason:
          type: [string, "null"]
          pattern: "^(refused|timeout|unauthorised|not-configured|http-[0-9]{3})$"
        models:
          type: array
          maxItems: 1000
          items:
            type: string
            minLength: 1
            maxLength: 200
        truncated:
          type: boolean

    FieldValuesRequest:
      type: object
      additionalProperties: false
      properties:
        fields:
          type: object
          maxProperties: 16
          default: {}
          additionalProperties:
            type: string
          description: Typed values by field id. Used for one request and never saved.

    SaveProviderFieldsRequest:
      type: object
      additionalProperties: false
      required: [fields]
      properties:
        revision:
          type: [string, "null"]
          maxLength: 128
          description: >
            The `revision` last read. A file that changed since gives 409 with
            "omrs.jsonc changed on disk. Reload to see the new values." and nothing is written.
        fields:
          type: object
          minProperties: 1
          maxProperties: 16
          additionalProperties:
            type: [string, integer, number, "null"]
            maxLength: 2048
          description: >
            Value by field id: an address for a `url` field, a whole number (or
            a string of digits) for an `int` field. Null clears the saved value.

    SaveProviderKeyRequest:
      type: object
      additionalProperties: false
      required: [api_key]
      properties:
        api_key:
          type: string
          minLength: 8
          maxLength: 512
          description: Printable characters with no spaces. Never returned.
        revision:
          type: [string, "null"]
          maxLength: 128
          description: >
            The `revision` last read. A file that changed since gives 409 with
            "omrs.jsonc changed on disk. Reload to see the new values." and nothing is written.

    ProviderRevisionRequest:
      type: object
      additionalProperties: false
      properties:
        revision:
          type: [string, "null"]
          maxLength: 128
          description: >
            The `revision` last read. A file that changed since gives 409 with
            "omrs.jsonc changed on disk. Reload to see the new values." and nothing is written.

    ProviderSaved:
      type: object
      additionalProperties: false
      required: [status, revision]
      properties:
        status:
          type: string
          enum: [ok]
        revision:
          type: string
          description: >
            Stamp of `omrs.jsonc` (SHA-256 of its bytes, or `absent`). A save may send it back;
            a file that changed since gives 409.

    # ── Managed llama.cpp server ────────────────────────────────────────
    LlamacppServerField:
      type: object
      additionalProperties: false
      required: [id, label, kind, value, min, max, source, locked, lock_reason]
      properties:
        id:
          type: string
        label:
          type: string
        kind:
          type: string
          enum: [text, int]
        value:
          type: [string, integer]
          description: The program path or model (empty when not set), or the context window.
        min:
          type: [integer, "null"]
        max:
          type: [integer, "null"]
        source:
          type: string
          enum: [env, dotenv, config-file, default]
        locked:
          type: boolean
        lock_reason:
          type: [string, "null"]

    LlamacppServerStatus:
      type: object
      additionalProperties: false
      required:
        [status, revision, state, reason, exit_code, pid_running, running_with, pending_restart, saved]
      properties:
        status:
          type: string
          enum: [ok]
        revision:
          type: string
          description: >
            Stamp of `omrs.jsonc` (SHA-256 of its bytes, or `absent`). A save may send it back;
            a file that changed since gives 409.
        state:
          type: string
          enum: [stopped, starting, running, failed]
        reason:
          type: [string, "null"]
          enum:
            - binary-invalid
            - model-invalid
            - not-loopback
            - port-in-use
            - exited
            - timeout
            - not-configured
            - null
          description: One fixed reason when the state is `failed`; never text from the process.
        exit_code:
          type: [integer, "null"]
          description: The exit code when the reason is `exited`.
        pid_running:
          type: boolean
          description: Whether the owned process is alive. The process id is never returned.
        running_with:
          type:
            - object
            - "null"
          additionalProperties: false
          required: [context_window, model_kind]
          properties:
            context_window:
              type: integer
            model_kind:
              type: string
              enum: [file, hf]
          description: What the live process was started with, or null when none is owned.
        pending_restart:
          type: boolean
          description: The saved program, model, window or idle sleep differ from the live process.
        saved:
          type: object
          additionalProperties: false
          required: [binary, model, context_window, idle_sleep]
          properties:
            binary:
              $ref: "#/components/schemas/LlamacppServerField"
            model:
              $ref: "#/components/schemas/LlamacppServerField"
            context_window:
              $ref: "#/components/schemas/LlamacppServerField"
            idle_sleep:
              $ref: "#/components/schemas/LlamacppServerField"

    SaveLlamacppServerRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        binary:
          type: [string, "null"]
          maxLength: 2048
        model:
          type: [string, "null"]
          maxLength: 2048
        context_window:
          type: [integer, number, string, "null"]
          description: A whole number from 2,048 to 262,144 (or a string of digits).
        idle_sleep:
          type: [integer, number, string, "null"]
          description: Seconds from 0 to 86,400 (or a string of digits). 0 turns sleep off.
        revision:
          type: [string, "null"]
          maxLength: 128
          description: >
            The `revision` last read. A file that changed since gives 409 with
            "omrs.jsonc changed on disk. Reload to see the new values." and nothing is written.

    # ── Server log ──────────────────────────────────────────────────────
    LogRecord:
      type: object
      additionalProperties: false
      required: [seq, time, level, logger, message]
      properties:
        seq:
          type: integer
          minimum: 1
          description: Rises by one for each record in one launch.
        time:
          type: string
          description: ISO 8601 time in UTC.
        level:
          type: string
          enum: [debug, info, warning, error, critical]
        logger:
          type: string
        message:
          type: string
          description: Redacted. Cut at 10,000 characters.

    SettingsConfiguration:
      type: object
      additionalProperties: false
      required: [status, path, revision, settings, problems, handover]
      properties:
        status:
          type: string
          enum: [ok]
        path:
          type: string
          description: Path of `omrs.jsonc`, with the home folder written as `~`.
        revision:
          type: string
          description: SHA-256 of the file bytes, or `absent` when the file does not exist.
        settings:
          type: array
          items:
            $ref: "#/components/schemas/ConfigurationSetting"
        problems:
          type: array
          items:
            $ref: "#/components/schemas/ConfigurationProblem"
        handover:
          $ref: "#/components/schemas/ConfigurationHandover"

    ConfigurationSetting:
      type: object
      additionalProperties: false
      required: [key, value, source, applies, restart_pending]
      properties:
        key:
          type: string
          description: Dotted setting key, for example `retrieval.top_k`.
        value:
          description: >
            The value in force as plain JSON data. Null for a key field and for
            a setting with no value.
        source:
          type: string
          enum: [init, env, dotenv, config-file, key-file, keychain, default]
        applies:
          type: string
          enum: [live, restart]
        restart_pending:
          type: boolean
        last4:
          type: string
          maxLength: 4
          description: >
            Present only on a key field that is set: its last four characters,
            or an empty string for a key shorter than eight characters.

    ConfigurationProblem:
      type: object
      additionalProperties: false
      required: [key, kind, message]
      properties:
        key:
          type: string
          description: The key in `omrs.jsonc`, or `omrs.jsonc` for a file that cannot be read.
        kind:
          type: string
          enum: [broken, invalid, unknown, retired]
        message:
          type: string
          description: Plain-English rule or advice. It never holds the value.

    ConfigurationHandover:
      type: object
      additionalProperties: false
      required: [pending, folder]
      properties:
        pending:
          type: boolean
          description: Saved workspace settings could not be moved into `omrs.jsonc`.
        folder:
          type: [string, "null"]
          description: The config folder to name in the notice, when `pending`.

    DocumentReadingState:
      type: object
      additionalProperties: false
      required: [status, revision, settings, pdf_readers, pdf_reader_in_use, ocr]
      properties:
        status:
          type: string
          enum: [ok]
        revision:
          type: string
          description: >
            SHA-256 of the `omrs.jsonc` bytes, or `absent` when there is no file.
            Send it back on a save; a file that changed since gives 409.
        settings:
          type: array
          minItems: 9
          maxItems: 9
          description: One row per key, in the fixed key order.
          items:
            $ref: "#/components/schemas/DocumentReadingSetting"
        pdf_readers:
          type: array
          description: >
            `auto` first (always available), then each registered reader in
            registry order.
          items:
            $ref: "#/components/schemas/ReaderOption"
        pdf_reader_in_use:
          type: [string, "null"]
          description: >
            The reader the running engine uses after resolution (`auto`
            resolved, an uninstalled choice replaced by `pypdf`). Computed once
            per process. Null only when it cannot be computed.
        ocr:
          type: object
          additionalProperties: false
          required: [workers_dir, worker_command_set, engines]
          properties:
            workers_dir:
              type: [string, "null"]
              description: Launch `ocr_workers_dir` with the home folder as `~`, or null when unset.
            worker_command_set:
              type: boolean
              description: >
                True when the launch `ocr_worker_command` is not empty, so it
                replaces the primary engine.
            engines:
              type: array
              description: >
                The folder names under `<ocr_workers_dir>/engines/` joined with
                the in-force and saved engine names, sorted by name.
              items:
                $ref: "#/components/schemas/OcrEngineOption"

    DocumentReadingSetting:
      type: object
      additionalProperties: false
      required: [key, value, saved, source, locked, lock_reason, restart_pending, default]
      properties:
        key:
          type: string
          enum:
            - pdf_reader
            - ocr_fallback_enabled
            - ocr_fallback_min_confidence
            - ocr_fallback_page_fraction
            - ocr_routing_unit
            - ocr_engine_primary
            - ocr_engine_fallback
            - ocr_maths_routing_enabled
            - ocr_maths_page_fraction
        value:
          type: [string, boolean, number]
          description: >
            The value in force since launch. For `pdf_reader` this is the
            configured name, which can be `auto`.
        saved:
          type: [string, boolean, number, "null"]
          description: >
            The valid value `omrs.jsonc` holds now. Null when the file does not
            set the key or holds a value that breaks its rule. A blank text
            value also comes back as null, because the file reader treats it
            as not set.
        source:
          type: string
          enum: [env, dotenv, config-file, default]
          description: Source of `value` at launch. An explicit option or a YAML default reads `default`.
        locked:
          type: boolean
          description: True when `source` is `env` or `dotenv`. A save of a locked key gets 409.
        lock_reason:
          type: [string, "null"]
          description: >
            "Remove <ENV_NAME> from the environment or .env to edit it here."
            when locked, else null.
        restart_pending:
          type: boolean
          description: The file value differs from the value captured at launch, and the key is not locked.
        default:
          type: [string, boolean, number]
          description: The code default from the `Settings` model.

    ReaderOption:
      type: object
      additionalProperties: false
      required: [name, available, reason]
      properties:
        name:
          type: string
          enum: [auto, liteparse, pdf_inspector, pypdfium2, pypdf]
        available:
          type: boolean
          description: The reader's package imports. `auto` is always available.
        reason:
          type: [string, "null"]
          description: Why the reader cannot run (names the missing package), or null.

    OcrEngineOption:
      type: object
      additionalProperties: false
      required: [name, available, reason]
      properties:
        name:
          type: string
          description: Engine folder name.
        available:
          type: boolean
          description: The engine resolves to a worker command now.
        reason:
          type: [string, "null"]
          description: >
            Null when available. Otherwise "OCR_WORKERS_DIR is not set, so no
            OCR engine can run.", "The name is not a folder name." or "Not
            provisioned. Run python3 ocr-workers/provision.py <name>."

    DocumentReadingUpdate:
      type: object
      additionalProperties: false
      required: [values, revision]
      properties:
        values:
          type: object
          minProperties: 1
          maxProperties: 9
          description: >
            One to nine of the nine keys. Each value has the key's JSON type, or
            is null to remove the key so the default applies. A key outside the
            nine gets 400.
          propertyNames:
            enum:
              - pdf_reader
              - ocr_fallback_enabled
              - ocr_fallback_min_confidence
              - ocr_fallback_page_fraction
              - ocr_routing_unit
              - ocr_engine_primary
              - ocr_engine_fallback
              - ocr_maths_routing_enabled
              - ocr_maths_page_fraction
          additionalProperties:
            type: [string, boolean, number, "null"]
        revision:
          type: string
          maxLength: 128
          description: >
            The `revision` last read. A file that changed since gives 409 and
            nothing is written.

    PowerStatus:
      type: object
      additionalProperties: false
      required: [status, managed]
      properties:
        status:
          type: string
          enum: [ok]
        managed:
          type: boolean
          description: >
            True when the running app is the login item, so Restart and Turn
            off can act on it.

    PowerRequest:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action:
          type: string
          maxLength: 32
          enum: [restart, "off"]
          description: >
            `restart` signals the app so launchd starts it again. `off` unloads
            the agent. Any other value gets 422.

    PowerAccepted:
      type: object
      additionalProperties: false
      required: [status, action]
      properties:
        status:
          type: string
          enum: [ok]
        action:
          type: string
          enum: [restart, "off"]

    LogList:
      type: object
      additionalProperties: false
      required: [status, records, last_seq]
      properties:
        status:
          type: string
          enum: [ok]
        records:
          type: array
          items:
            $ref: "#/components/schemas/LogRecord"
        last_seq:
          type: integer
          minimum: 0
