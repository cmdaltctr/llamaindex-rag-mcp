openapi: 3.1.0
info:
  title: OMRS local workspace API
  description: >
    HTTP contract of the optional local web runtime of OMRS (Opinionated
    Modular RAG). Start the runtime with `omrs web`. The routes map to the
    same core operations that the MCP and CLI transports call. Routes
    validate, delegate and format only.


    ## Error envelope

    Every error response uses the MCP error-dict shape:
    `{"status": "error", "message": "..."}`. `error_type` is optional.
    A graph or selector validation failure (422) adds `issues`. Messages
    never contain stack traces or credential values. An unknown `/v1` path
    gets this envelope with 404, never the application HTML.


    ## Request validation

    A request body or query value that does not match its schema gets 400
    with `error_type: validation`. A graph document or cleanup selector that
    is well formed but invalid gets 422 with the structured `issues`.


    ## Access

    The server binds to loopback only. Every request must carry a loopback
    `Host` header for the bound port (else 400). On `/v1` paths a foreign
    `Origin`, or `Sec-Fetch-Site: cross-site`/`same-site`, gets 403.
    Credentials in the query string get 400.


    Two credentials exist. The browser exchanges a secret for an HttpOnly,
    SameSite=Strict session cookie (`POST /v1/session`): the one-time
    bootstrap secret from the launch URL fragment, or the workspace sign-in
    secret that the server puts into its own page. Notebook clients send a revocable
    per-launch bearer credential (`Authorization: Bearer omrs_bt_<id>.<secret>`).
    Each operation names its scope in `x-omrs-scopes`. An operation whose
    `security` lists only `sessionCookie` is session only: a bearer
    credential never passes, whatever scopes it holds. Cookie-authenticated
    `POST`, `PUT`, `PATCH` and `DELETE` requests must carry the application
    Origin. `GET /v1/health` and `POST /v1/session` are the only public
    operations (`security: []`).


    A bearer credential can be bound to one approved experiment context
    (`POST /v1/credentials` with `experiment_context`). A bound credential
    reaches only `/v1/session`, `/v1/pipeline-operations`,
    `/v1/pipeline-templates`, `/v1/pipelines` and `/v1/runs` (else 403).
    It runs graphs only in its own context, never on the live library, and
    it sees only its own context's runs.


    ## Jobs and graph runs

    Ingestion and codebase maps are document jobs: 202 with a `Job`, then
    poll `GET /v1/jobs/{jobId}` and page `GET /v1/jobs/{jobId}/events`. Graph runs are 202 with a `RunRecord`,
    then poll `GET /v1/runs/{run_id}`, page `GET /v1/runs/{run_id}/events`,
    or follow `GET /v1/runs/{run_id}/events/stream` (server-sent events with
    replay after `Last-Event-ID`). Both kinds share one persisted run
    service with one consumer and a bounded queue (429 when full). Work that
    was not finished when the server stopped is reported as `interrupted`
    (graph runs) or `failed` (jobs) at the next start. It is never repeated
    automatically.
  version: 2.0.0
  license:
    name: Apache-2.0

servers:
  - url: http://127.0.0.1:{port}/v1
    variables:
      port:
        default: "8765"
        description: >
          Loopback port chosen at launch: `omrs web --port`, else `web_port` in
          `omrs.jsonc` (saved with `PUT /v1/settings/web-port`), else 8765. `--port 0`
          picks a free port. The launch URL on stderr names it.

x-omrs-scope-catalogue:
  read:
    session_only: false
    description: Read collections, search, answer, jobs, pipelines, runs and events.
  graph:
    session_only: false
    description: Create pipelines, save layouts and revisions, validate graphs.
  run:
    session_only: false
    description: Submit, cancel and retry graph runs.
  files:
    session_only: true
    description: Approved roots, uploads, ingestion and codebase-map jobs.
  plugins:
    session_only: true
    description: Notebook plugin registration, compatibility checks and editor start/stop.
  credentials:
    session_only: true
    description: Issue, list and revoke bearer credentials.
  manage:
    session_only: true
    description: >
      Preview-bound destructive actions (deletion, profile change, cleanup),
      experiment context approval and revocation, experiment folder
      creation, provider connection tests and the server log.

paths:
  # ── Health and session (public bootstrap) ───────────────────────────
  /health:
    get:
      operationId: getHealth
      summary: Report liveness and version
      description: Public. Returns no workspace data.
      security: []
      x-omrs-scopes: []
      responses:
        "200":
          description: The server is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /session:
    post:
      operationId: createSession
      summary: Exchange the bootstrap or workspace secret for a session cookie
      description: >
        Public, but constrained. The request must carry the application
        Origin. The body holds the one-time bootstrap secret or the
        workspace sign-in secret. The bootstrap secret works once, and
        after 20 wrong guesses it stops working. The workspace secret
        lasts across restarts and does not spend the bootstrap secret.
        Success sets the cookie `omrs_session_<port>` (HttpOnly,
        SameSite=Strict, Path=/).
      security: []
      x-omrs-scopes: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BootstrapRequest"
      responses:
        "200":
          description: Session created. The response sets the session cookie.
          headers:
            Set-Cookie:
              description: "`omrs_session_<port>=<value>; HttpOnly; SameSite=Strict; Path=/`"
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/BootstrapRejected"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      operationId: getSession
      summary: Describe the caller's credential and the workspace path
      security:
        - sessionCookie: [read]
        - bearerToken: [read]
      x-omrs-scopes: [read]
      responses:
        "200":
          description: Credential kind, scopes and workspace path.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInfo"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  # ── Bearer credentials (session only) ───────────────────────────────
  /credentials:
    post:
      operationId: issueCredential
      summary: Issue a bearer credential for a notebook client
      description: The token is shown once. Only its SHA-256 digest is kept.
      security:
        - sessionCookie: [credentials]
      x-omrs-scopes: [credentials]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialRequest"
      responses:
        "201":
          description: Credential issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuedCredential"
        "400":
          $ref: "#/components/responses/ExperimentRefused"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      operationId: listCredentials
      summary: List bearer credentials without their secrets
      security:
        - sessionCookie: [credentials]
      x-omrs-scopes: [credentials]
      responses:
        "200":
          description: Issued credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /credentials/{credential_id}:
    delete:
      operationId: revokeCredential
      summary: Revoke a bearer credential
      description: Revocation takes effect on the next request.
      security:
        - sessionCookie: [credentials]
      x-omrs-scopes: [credentials]
      parameters:
        - $ref: "#/components/parameters/CredentialId"
      responses:
        "200":
          description: Credential revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialRevoked"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # ── File grants and uploads (session only) ──────────────────────────
  /roots:
    get:
      operationId: listRoots
      summary: List the approved roots and the managed upload root
      description: >
        Roots come from `omrs web --root` and the workspace upload storage.
        Paths read from indexed metadata never add a root.
      security:
        - sessionCookie: [files]
      x-omrs-scopes: [files]
      responses:
        "200":
          description: Approved roots.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RootList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /uploads/preflight:
    post:
      operationId: preflightUpload
      summary: Check a file name, type and size before the upload
      description: >
        The name must be a plain file name. The extension must be an
        ingestible type. Archives fail with 415. A declared size over the
        limit (50 MiB by default) fails with 413.
      security:
        - sessionCookie: [files]
      x-omrs-scopes: [files]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadPreflightRequest"
      responses:
        "200":
          description: The upload can start.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadPreflightResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /uploads:
    post:
      operationId: uploadFile
      summary: Stream one file into managed storage
      description: >
        The body is the raw file. The percent-encoded file name travels in
        the `X-Upload-Name` header, so it stays out of the access log. The
        size limit is also enforced while the body streams. A failed or
        interrupted upload keeps no partial file. The response does not
        return the server path: ingest the upload by its managed-root path
        (`GET /v1/roots`, then `<upload id>/<name>`).
      security:
        - sessionCookie: [files]
      x-omrs-scopes: [files]
      parameters:
        - name: X-Upload-Name
          in: header
          required: true
          description: Percent-encoded plain file name.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: File stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadStored"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # ── Document jobs (session only) ────────────────────────────────────
  /ingestions:
    post:
      operationId: ingestPath
      summary: Queue ingestion of an approved file or directory
      description: >
        Indexes supported document formats into the collection. The path
        must be absolute and inside an approved root (else 403 before any
        work). Returns 202 with a job resource. Poll `GET /v1/jobs/{jobId}`.
      security:
        - sessionCookie: [files]
      x-omrs-scopes: [files]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestRequest"
      responses:
        "202":
          description: Ingestion job accepted and queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /codebase-maps:
    post:
      operationId: generateCodebaseMap
      summary: Queue a codebase map of an approved directory
      description: >
        Scans a project directory, builds code and document graphs, detects
        communities and hubs, and returns a text map in the job result
        (`{"map": "..."}`). The job passes the owning Engine's settings and
        store to the core map API. The path must be absolute and inside an
        approved root. Returns 202 with a job resource.
      security:
        - sessionCookie: [files]
      x-omrs-scopes: [files]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CodebaseMapRequest"
      responses:
        "202":
          description: Codebase map job accepted and queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /jobs/{jobId}:
    get:
      operationId: getJobStatus
      summary: Poll an ingestion or codebase-map job
      description: >
        Terminal states: `completed`, `failed`. A job that was queued or
        running when the server stopped reads `failed` after the next
        start. Graph runs and non-UUID ids get 404.
      security:
        - sessionCookie: [read]
        - bearerToken: [read]
      x-omrs-scopes: [read]
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Job status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /jobs/{jobId}/events:
    get:
      operationId: listJobEvents
      summary: Page committed events of an ingestion or codebase-map job
      description: >
        Returns the committed events of the run behind the job, with a
        sequence above `after_sequence`. Send the returned `last_sequence`
        as the next `after_sequence`. `complete` is true when the job is
        terminal and no later event exists. Same scope as
        `GET /v1/jobs/{jobId}`. Graph runs and non-UUID ids get 404.
      security:
        - sessionCookie: [read]
        - bearerToken: [read]
      x-omrs-scopes: [read]
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
        - name: after_sequence
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 500
      responses:
        "200":
          description: One page of job events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobEventPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # ── Collections and documents ───────────────────────────────────────
  /collections:
    get:
      operationId: listCollections
      summary: List all collections
      description: >
        Returns all collections with document and chunk counts, the
        stored profile name (or `null`) and the vector database that
        holds them.
      security:
        - sessionCookie: [read]
        - bearerToken: [read]
      x-omrs-scopes: [read]
      responses:
        "200":
          description: Collection list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CollectionInfo"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /collections/{collection}/documents:
    get:
      operationId: listDocuments
      summary: List indexed sources in a collection
      description: >
        Returns every source with its chunk count, stable source identity
        and machine-local orphan status. A missing collection gives an
        empty list.
      security:
        - sessionCookie: [read]
        - bearerToken: [read]
      x-omrs-scopes: [read]
      parameters:
        - $ref: "#/components/parameters/CollectionName"
      responses:
        "200":
          description: Document list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DocumentInfo"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      operationId: deleteDocuments
      summary: Preview, or confirm a previewed, deletion
      description: >
        Removes chunks by source path, by metadata filter, or drops the
        whole collection (no selector). Step 1: send `dry_run: true`. This
        mutates nothing and returns the affected count plus a single-use
        `confirmation`. Step 2: repeat the same selector with
        `confirmation_token`. The token is bound to the action, collection,
        selector and observed store validity token, and expires after 300
        seconds. No token gives 428. An unknown, used, expired, altered or
        stale token gives 409, and the data stays unchanged. Preview again.
      security:
        - sessionCookie: [manage]
      x-omrs-scopes: [manage]
      parameters:
        - $ref: "#/components/parameters/CollectionName"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteRequest"
      responses:
        "200":
          description: Deletion preview (dry run) or deletion result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /collections/{collection}/search:
    post:
      operationId: searchCollection
      summary: Search one collection
      description: >
        Returns the most relevant chunks with lineage, score and score kind.
        Omitted controls resolve from the collection profile. Diagnostics-only
        keys appear only with `diagnostics: true`.
      security:
        - sessionCookie: [read]
        - bearerToken: [read]
      x-omrs-scopes: [read]
      parameters:
        - $ref: "#/components/parameters/CollectionName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
      responses:
        "200":
          description: Search results.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SearchResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /collections/{collection}/answer:
    post:
      operationId: answerCollection
      summary: Answer a question from retrieved evidence with citations
      description: >
        Retrieves evidence through the same profile-resolved path as
        search, then synthesises a grounded answer. Citations are built
        deterministically from chunk lineage. Retrieval and generation
        failures come back inside the answer result (`failure_stage`), not
        as HTTP errors. When retrieval finds nothing the response carries
        the no_evidence shape.
      security:
        - sessionCookie: [read]
        - bearerToken: [read]
      x-omrs-scopes: [read]
      parameters:
        - $ref: "#/components/parameters/CollectionName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnswerRequest"
      responses:
        "200":
          description: Grounded answer result (including the no-evidence shape).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnswerResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /collections/{collection}/answer/stream:
    post:
      operationId: streamAnswer
      summary: Answer a question and stream its stages as server-sent events
      description: >
        Takes the body of `answerCollection` and follows its scope, Origin
        and validation rules. The response is `text/event-stream`: one
        `event: stage` frame for each stage the answer enters, in the order
        searching, writing, citing, verifying, then exactly one
        `event: result` frame with the result `answerCollection` returns,
        then the end. A stage that does not run is not sent. There is no
        `retry` line, no heartbeat and no replay. Stage frames hold only the
        stage name, a sequence number and the elapsed milliseconds since
        admission. The stream opens only when the first stage or the result
        is ready, so a request the Engine rejects gets the same 400 as
        `answerCollection`. A client that leaves cancels the answer.
      security:
        - sessionCookie: [read]
        - bearerToken: [read]
      x-omrs-scopes: [read]
      x-omrs-sse-events:
        stage: AnswerStageEvent
        result: AnswerResponse
      parameters:
        - $ref: "#/components/parameters/CollectionName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnswerRequest"
      responses:
        "200":
          description: Event stream of stage frames, then one result frame.
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /collections/{collection}/chunks/{chunk_id}:
    get:
      operationId: getChunk
      summary: Inspect one stored chunk and its neighbours
      description: >
        Reads the stored chunk by its stable `chunk_id`, with up to `window`
        neighbours per side from the same source version. It never opens
        the original file, so a citation stays inspectable when its source
        is outside the approved roots. Text is plain JSON text
        (`text_format: plain`). Render it as text, never as markup.
      security:
        - sessionCookie: [read]
        - bearerToken: [read]
      x-omrs-scopes: [read]
      parameters:
        - $ref: "#/components/parameters/CollectionName"
        - name: chunk_id
          in: path
          required: true
          schema:
            type: string
        - name: window
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 5
            default: 1
      responses:
        "200":
          description: The chunk and its neighbours.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChunkInspection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "501":
          $ref: "#/components/responses/NotImplemented"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /collections/{collection}/profile:
    patch:
      operationId: changeCollectionProfile
      summary: Preview, or confirm a previewed, profile change
      description: >
        Profiles control retrieval behaviour: `documents` (quality-first,
        reranker on, dense-only) or `codebase` (speed-first, reranker off,
        hybrid), or a ready user profile (its id). A user profile runs its
        Ingest, Search and Answer pipelines for the collection. The change
        does not re-chunk or re-embed existing chunks. A profile that is not
        ready, unknown or deleted gives 400 with `not_ready_reasons` and no
        confirmation. A profile whose embedding model differs from the model
        that the collection's vectors were made with gives 409 with
        `error_type` `embedding_mismatch`, in the preview and in the confirm
        step; the message names both models and the tag stays.
        Step 1: send `confirm: false` (the default). This returns a
        `ProfilePreview` with the lever impacts and a single-use
        `confirmation`. Step 2: send `confirm: true` with the same profile
        and `confirmation_token`. No token gives 428. A stale, altered or
        expired token gives 409. Preview again.
      security:
        - sessionCookie: [manage]
      x-omrs-scopes: [manage]
      parameters:
        - $ref: "#/components/parameters/CollectionName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileChangeRequest"
      responses:
        "200":
          description: >
            Preview (confirm=false) or the applied change (confirm=true).
            The `status` value tells the two apart.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ProfilePreview"
                  - $ref: "#/components/schemas/ProfileChangeResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # ── Graph catalogue, pipelines and revisions ────────────────────────
  /collections/{collection}/display-name:
    patch:
      operationId: setCollectionDisplayName
      summary: Set or clear the display name of a collection
      description: >
        Stores a label in the collection metadata. The collection name, the
        stored vectors and every retrieval call stay as they were, so there
        is no preview step. The server trims the value; an empty value
        clears the display name. More than 80 Unicode code points, or a
        control character, gives 400. An unknown collection gives 404 and
        nothing is created. Needs the browser session: bearer credentials
        for notebooks are refused with 403.
      security:
        - sessionCookie: [manage]
      x-omrs-scopes: [manage]
      parameters:
        - $ref: "#/components/parameters/CollectionName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DisplayNameRequest"
      responses:
        "200":
          description: The display name now stored (`null` after a clear).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DisplayNameResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /profiles:
    get:
      operationId: listProfiles
      summary: List built-in and user profiles
      description: >
        Built-in profiles first, then user profiles that are not deleted. Each
        item carries readiness and the collections that use it. List items do
        not carry `standard_graphs`.
      security:
        - sessionCookie: [read]
        - bearerToken: [read]
      x-omrs-scopes: [read]
      responses:
        "200":
          description: The profiles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      operationId: createProfile
      summary: Create a user profile
      description: >
        `source` is a built-in id (the standard graphs, shaped by that
        built-in), a user profile id (a copy of its current revisions and
        layouts) or null (base `documents`, three pipelines with no saved
        graph). The id comes from the title. The profile is ready only when
        each pipeline passes the readiness check.
      security:
        - sessionCookie: [graph]
        - bearerToken: [graph]
      x-omrs-scopes: [graph]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileCreateRequest"
      responses:
        "201":
          description: Profile created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /profiles/{profile_id}:
    get:
      operationId: getProfile
      summary: Return one profile
      description: >
        A built-in profile also carries `standard_graphs`: the Ingest, Search
        and Answer graphs that a duplicate of it gets. For a user profile
        `standard_graphs` is null.
      security:
        - sessionCookie: [read]
        - bearerToken: [read]
      x-omrs-scopes: [read]
      parameters:
        - $ref: "#/components/parameters/ProfileId"
      responses:
        "200":
          description: The profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileDetailEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    patch:
      operationId: updateProfile
      summary: Change the title or the description of a user profile
      description: >
        The id never changes. A title holds 1 to 80 characters after
        trimming and no control characters (400). A built-in profile gives
        403.
      security:
        - sessionCookie: [graph]
        - bearerToken: [graph]
      x-omrs-scopes: [graph]
      parameters:
        - $ref: "#/components/parameters/ProfileId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdateRequest"
      responses:
        "200":
          description: The changed profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      operationId: deleteProfile
      summary: Delete a user profile that no collection uses
      description: >
        A soft delete: the pipelines, revisions and run records stay. A
        profile that a collection uses gives 409 with `used_by`. A built-in
        profile gives 403. A deleted id is never given to a new profile.
      security:
        - sessionCookie: [graph]
        - bearerToken: [graph]
      x-omrs-scopes: [graph]
      parameters:
        - $ref: "#/components/parameters/ProfileId"
      responses:
        "200":
          description: The profile as it was before the delete.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /embedding-providers:
    get:
      operationId: listEmbeddingProviders
      summary: List the embedding providers and the server default model
      description: >
        Lists every registered embedding provider. A provider is
        unavailable when its optional dependency is missing; `reason` then
        names the extra to install. `server_default` is the provider and the
        model that the `EMBED_*` settings select, which every built-in
        profile and every user profile without a choice uses. This route
        sends no request to any provider.
      security:
        - sessionCookie: [read]
        - bearerToken: [read]
      x-omrs-scopes: [read]
      responses:
        "200":
          description: The providers and the server default.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmbeddingProviderList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /embedding-providers/{provider}/check:
    post:
      operationId: checkEmbeddingModel
      summary: Check an embedding model with one probe embedding
      description: >
        Embeds the text `OMRS model check` with a throwaway embedder and
        reports the vector size (`dimensions`) and length (`norm`). For
        llama.cpp, which ignores the model name in a request, the server
        first lists its models, and the name must match one of them. A failed
        check is still 200: `ok` is false and `reason` says why in plain
        English (provider not installed, model not served, provider error
        text, or a vector length outside the norm tolerance while the norm
        guard is on). Credentials are removed from `reason`. An unregistered
        provider gives 404. This route contacts the provider, and only when
        called. It needs the browser session.
      security:
        - sessionCookie: [manage]
      x-omrs-scopes: [manage]
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmbeddingCheckRequest"
      responses:
        "200":
          description: The check result, passed or failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmbeddingCheckResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /profiles/{profile_id}/embedding:
    put:
      operationId: setProfileEmbedding
      summary: Choose the embedding model of a user profile
      description: >
        Send `provider` and `model` to choose a model, or both `null` to
        return to the server default. The server runs the same check as
        `checkEmbeddingModel` first; a failed check gives 422 with a top-level
        `reason`, and the profile keeps its model. The model is locked while a
        collection that follows the profile holds vectors (a stamp or at
        least one row): a request for another model gives 409 with
        `error_type` `embedding_locked` and `collections`, first blocking
        collection first. A request for the stamped model is allowed. `model`
        in a `collections` entry is `null` when the model that made the
        vectors is not recorded. A built-in profile gives 400: duplicate the
        profile first. An unregistered provider or an unknown profile gives
        404. This route needs the browser session.
      security:
        - sessionCookie: [manage]
      x-omrs-scopes: [manage]
      parameters:
        - $ref: "#/components/parameters/ProfileId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileEmbeddingRequest"
      responses:
        "200":
          description: The profile with its new embedding choice.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /pipeline-operations:
    get:
      operationId: listPipelineOperations
      summary: List the graph operation catalogue with availability
      security:
        - sessionCookie: [read]
        - bearerToken: [read]
      x-omrs-scopes: [read]
      responses:
        "200":
          description: Every operation version, with availability and reasons.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationCatalogue"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /pipelines:
    post:
      operationId: createPipeline
      deprecated: true
      summary: Withdrawn. Create a profile instead
      description: >
        Pipelines belong to profiles. This operation answers 410 and creates
        nothing. Use `createProfile` (`POST /v1/profiles`). Slot pipelines of
        a profile stay readable and editable through the other `/pipelines`
        operations.
      security:
        - sessionCookie: [graph]
        - bearerToken: [graph]
      x-omrs-scopes: [graph]
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "410":
          $ref: "#/components/responses/Gone"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    get:
      operationId: listPipelines
      summary: List pipelines in creation order
      description: Reserved document-job pipelines are hidden.
      security:
        - sessionCookie: [read]
        - bearerToken: [read]
      x-omrs-scopes: [read]
      responses:
        "200":
          description: Pipelines.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /pipelines/validate:
    post:
      operationId: validatePipeline
      summary: Validate a graph without running it
      description: >
        Core validation decides what a valid graph is. Without `inputs` this
        is the draft check (`admitted: false`). With `inputs` it is the
        admission check that a run submission applies (`admitted: true`).
        No node, model call or write runs. An invalid graph gets 422 with
        every structured issue. A draft check that fails also returns `nodes`
        for the nodes that are valid so far.
      security:
        - sessionCookie: [graph]
        - bearerToken: [graph]
      x-omrs-scopes: [graph]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidateRequest"
      responses:
        "200":
          description: The graph is valid.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/DraftValidation"
                  - $ref: "#/components/schemas/AdmissionValidation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /pipelines/{pipeline_id}:
    get:
      operationId: getPipeline
      summary: Return a pipeline, its current revision and its profile slot
      security:
        - sessionCookie: [read]
        - bearerToken: [read]
      x-omrs-scopes: [read]
      parameters:
        - $ref: "#/components/parameters/PipelineId"
      responses:
        "200":
          description: Pipeline with its current revision (or null).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /pipelines/{pipeline_id}/layout:
    put:
      operationId: savePipelineLayout
      summary: Replace the presentation layout
      description: >
        No revision is created. A document-job pipeline gives 409, and so
        does a pipeline of a deleted profile. The layout key `omrs_task` is
        reserved (400).
      security:
        - sessionCookie: [graph]
        - bearerToken: [graph]
      x-omrs-scopes: [graph]
      parameters:
        - $ref: "#/components/parameters/PipelineId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LayoutRequest"
      responses:
        "200":
          description: Layout saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /pipelines/{pipeline_id}/revisions:
    post:
      operationId: savePipelineRevision
      summary: Store an immutable revision and make it current
      description: >
        The document must parse as a supported graph document, either the
        graph itself or `{"graph", "layout"}` (only the graph is stored).
        Full checks run at validation and admission. A new revision gives
        201 (`created: true`). Identical content gives 200 with the existing
        revision (`created: false`). A pipeline of a user profile must name
        the base profile of the profile as its graph `profile` (400). The
        response lists the collections that the save affects in
        `affected_collections`. A save that would make a profile in use not
        ready gives 409 with `not_ready_reasons`. A pipeline of a deleted
        profile gives 409.
      security:
        - sessionCookie: [graph]
        - bearerToken: [graph]
      x-omrs-scopes: [graph]
      parameters:
        - $ref: "#/components/parameters/PipelineId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevisionRequest"
      responses:
        "200":
          description: Identical content exists; that revision is returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevisionSaved"
        "201":
          description: New revision stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevisionSaved"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    get:
      operationId: listPipelineRevisions
      summary: List a pipeline's revisions by revision number
      security:
        - sessionCookie: [read]
        - bearerToken: [read]
      x-omrs-scopes: [read]
      parameters:
        - $ref: "#/components/parameters/PipelineId"
      responses:
        "200":
          description: Revisions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevisionList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /pipelines/{pipeline_id}/revisions/{revision_id}:
    get:
      operationId: getPipelineRevision
      summary: Return one revision of a pipeline
      security:
        - sessionCookie: [read]
        - bearerToken: [read]
      x-omrs-scopes: [read]
      parameters:
        - $ref: "#/components/parameters/PipelineId"
        - name: revision_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The revision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevisionEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # ── Graph runs ──────────────────────────────────────────────────────
  /runs:
    post:
      operationId: submitRun
      summary: Admit a saved revision with its inputs and queue a run
      description: >
        Admission runs at once with the inputs. An invalid graph or input
        gets 422 and no run record is written. A document-job revision or
        an unknown revision gives 404. Inputs that hold credentials give
        400. A full queue gives 429. Returns 202 with the queued run. Poll
        `GET /v1/runs/{run_id}` or follow its events. With
        `experiment_context` the run uses that approved context's Engine.
        The experiment admission guard refuses before any run record with
        403 and a stable `code`: `live_library_target` (an experiment
        credential without a context), `experiment_scope_mismatch`,
        `experiment_credential_required`, `experiment_context_unknown`,
        `experiment_context_revoked`, `action_not_permitted` or
        `commit_outside_context`.
      security:
        - sessionCookie: [run]
        - bearerToken: [run]
      x-omrs-scopes: [run]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitRunRequest"
      responses:
        "202":
          description: Run queued (status `queued`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ExperimentRefused"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    get:
      operationId: listRuns
      summary: List graph runs, newest first
      description: Document-job runs are hidden.
      security:
        - sessionCookie: [read]
        - bearerToken: [read]
      x-omrs-scopes: [read]
      parameters:
        - name: pipeline_id
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: Repeat the parameter to select several statuses.
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/RunStatus"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: Runs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /runs/{run_id}:
    get:
      operationId: getRun
      summary: Return one run record
      description: >
        The record holds the revision, redacted settings, state and failure.
        Statuses: queued, running, cancelling, succeeded, failed, cancelled,
        interrupted. A run that was not finished when the server stopped
        reads `interrupted` after the next start.
      security:
        - sessionCookie: [read]
        - bearerToken: [read]
      x-omrs-scopes: [read]
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: The run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /runs/{run_id}/result:
    get:
      operationId: getRunResult
      summary: Return the stored, redacted result of a finished run
      security:
        - sessionCookie: [read]
        - bearerToken: [read]
      x-omrs-scopes: [read]
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: The stored result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /runs/{run_id}/artefacts/{name}:
    get:
      operationId: getRunArtefact
      summary: Return one stored, redacted artefact of a run
      description: >
        A summary that was cut carries `truncated: true` and an
        `artefact_ref` of the form `<run_id>/<name>.json`. This route
        returns the full redacted value of that artefact. It applies the
        same access policy as `getRun`: a run the caller cannot read
        answers 404 as an unknown run does. A name that is not one safe
        path segment answers 400 and no file is read.
      security:
        - sessionCookie: [read]
        - bearerToken: [read]
      x-omrs-scopes: [read]
      parameters:
        - $ref: "#/components/parameters/RunId"
        - name: name
          in: path
          required: true
          description: The file name of the `artefact_ref`, without `.json`.
          schema:
            type: string
      responses:
        "200":
          description: The stored artefact.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunArtefact"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /runs/{run_id}/cancel:
    post:
      operationId: cancelRun
      summary: Cancel a queued run, or stop an active run at a safe boundary
      description: >
        A queued run becomes `cancelled`. An active run becomes `cancelling`
        and then `cancelled` at its next safe boundary. A terminal run is
        returned unchanged. Closing an event stream never cancels a run.
      security:
        - sessionCookie: [run]
        - bearerToken: [run]
      x-omrs-scopes: [run]
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: The run after the request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /runs/{run_id}/retry:
    post:
      operationId: retryRun
      summary: Repeat a failed, cancelled or interrupted run as a new run
      description: >
        The new run uses the stored revision and inputs with fresh
        admission, `origin: retry` and `source_run_id`. The source run does
        not change. Another status gives 409.
      security:
        - sessionCookie: [run]
        - bearerToken: [run]
      x-omrs-scopes: [run]
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "202":
          description: The new run is queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ExperimentRefused"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /runs/{run_id}/events:
    get:
      operationId: listRunEvents
      summary: Page committed run events (polling fallback)
      description: >
        Returns events with a sequence above `after_sequence`. Send the
        returned `last_sequence` as the next `after_sequence`. `complete`
        is true when the run is terminal and no later event exists.
      security:
        - sessionCookie: [read]
        - bearerToken: [read]
      x-omrs-scopes: [read]
      parameters:
        - $ref: "#/components/parameters/RunId"
        - name: after_sequence
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 500
      responses:
        "200":
          description: One page of events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunEventPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /runs/{run_id}/events/stream:
    get:
      operationId: streamRunEvents
      summary: Follow run events as server-sent events
      description: >
        The stream first sends `retry: 3000`. It then replays committed
        events after `Last-Event-ID` (or `after`; the header wins) and
        follows new ones. Each event frame has `id: <sequence>`,
        `event: <kind>` and `data: <RunEventRecord JSON>`. Use the `id` to
        drop duplicates after a reconnection. The stream ends with
        `event: run.end` when the run is terminal, or with
        `event: server.closing` when the server stops. A closed connection
        only detaches the stream: the run continues until an explicit
        cancel. The same access policy as run inspection applies.
      security:
        - sessionCookie: [read]
        - bearerToken: [read]
      x-omrs-scopes: [read]
      x-omrs-sse-events:
        "*": RunEventRecord
        run.end: StreamEnd
        server.closing: StreamClosing
      parameters:
        - $ref: "#/components/parameters/RunId"
        - name: after
          in: query
          required: false
          description: Replay events after this sequence. `Last-Event-ID` wins.
          schema:
            type:
              - integer
              - "null"
            minimum: 0
        - name: Last-Event-ID
          in: header
          required: false
          description: Sequence of the last event the client received.
          schema:
            type:
              - string
              - "null"
      responses:
        "200":
          description: Event stream.
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # ── Workspace cleanup (session only) ────────────────────────────────
