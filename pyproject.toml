[project]
name = "rag-mcp"
version = "0.1.0"
description = "LlamaIndex RAG MCP server for document retrieval"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0",
    "llama-index>=0.11.0",
    "llama-index-vector-stores-chroma>=0.2.0",
    "llama-index-readers-file>=0.2.0",
    "chromadb>=0.5.0",
    "llama-index-embeddings-ollama>=0.2.0",
    "python-dotenv>=1.0.0",
    # Reranker (cross-encoder via pure ONNX Runtime — no PyTorch)
    "onnxruntime>=1.17.0,<1.26.0",
    "transformers>=4.40.0",
    "huggingface-hub>=0.20.0",
    "typer>=0.25.1",
    # File watcher (cross-platform: FSEvents / inotify / ReadDirectoryChangesW)
    "watchdog>=4.0.0",
    # Async HTTP client for Ollama metadata extraction (non-blocking)
    "httpx>=0.27.0",
]

[project.scripts]
rag-mcp = "rag_mcp.cli:run_cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_mcp"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
source = ["rag_mcp"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
]

[project.optional-dependencies]
# Optional extras for LlamaIndex-based metadata extraction (Stage 2).
# Install with: uv sync --extra metadata
metadata = [
    "llama-index-llms-ollama>=0.4.0",
]
