[project]
name = "rag-mcp"
version = "1.8.0"
description = "LlamaIndex RAG MCP server for document retrieval"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0",
    "llama-index>=0.11.0",
    "llama-index-vector-stores-chroma>=0.2.0",
    "llama-index-readers-file>=0.2.0",
    "chromadb>=0.5.0",
    "llama-index-embeddings-ollama>=0.2.0",
    "python-dotenv>=1.0.0",
    # Reranker (cross-encoder via pure ONNX Runtime — no PyTorch)
    "onnxruntime>=1.17.0,<1.26.0",
    "transformers>=4.40.0",
    "huggingface-hub>=0.20.0",
    "typer>=0.25.1",
    # File watcher (cross-platform: FSEvents / inotify / ReadDirectoryChangesW)
    "watchdog>=4.0.0",
    # Async HTTP client for Ollama metadata extraction (non-blocking)
    "httpx>=0.27.0",
    # LlamaIndex LLM integration for llamaindex metadata extraction mode
    "llama-index-llms-ollama>=0.4.0",
    "docx2txt>=0.9",
    # PDF parser (Rust + PDFium, Apache-2.0). Default reader when installed.
    # See ADR-020. Prebuilt wheels for macOS, Linux, Windows.
    "liteparse>=2.0.0",
    # Code graph: AST extraction and community detection
    "tree-sitter>=0.21.0",
    "tree-sitter-language-pack>=0.1.0",
    "networkx>=3.0",
]

[project.optional-dependencies]
hybrid = [
    "rank-bm25>=0.2.2",
]
pdf-pypdfium2 = [
    "pypdfium2>=4.0.0",
]
azure = [
    "azure-ai-documentintelligence>=1.0.0",
]

[project.scripts]
rag-mcp = "rag_mcp.cli:run_cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_mcp"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
source = ["rag_mcp"]

[dependency-groups]
dev = [
    "huggingface-hub>=0.36.2",
    "ipywidgets>=8.1.8",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
]

# ─── Semantic Release ────────────────────────────────────────────────
[tool.semantic_release]
commit_parser = "conventional"
version_toml = ["pyproject.toml:project.version"]
allow_zero_version = true
build_command = "uv build"
tag_format = "v{version}"

[tool.semantic_release.branches.main]
match = "master"
prerelease = false

[tool.semantic_release.changelog]
exclude_commit_patterns = [
    '''chore(?:\([^)]*?\))?: .+''',
    '''ci(?:\([^)]*?\))?: .+''',
    '''refactor(?:\([^)]*?\))?: .+''',
    '''style(?:\([^)]*?\))?: .+''',
    '''test(?:\([^)]*?\))?: .+''',
    '''build\((?!deps\): .+)''',
    '''docs(?:\([^)]*?\))?: .+''',
]

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"
output_format = "md"

[tool.semantic_release.commit_parser_options]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]
parse_squash_commits = true
ignore_merge_commits = true

[tool.semantic_release.remote]
type = "github"
token = { env = "GH_TOKEN" }
