[project]
name = "omrg"
version = "2.2.0"
description = "Standalone retrieval framework with MCP, CLI and watcher transports"
requires-python = ">=3.11"
dependencies = [
    # mcp 2.0 + huggingface-hub 1.0 caps lifted in the major dependency
    # upgrade cycle. mcp 2.0 rewrites the HTTP stack to httpx2;
    # huggingface-hub 1.0 migrated from requests to httpx and removed
    # legacy params (resume_download, force_filename, local_dir_use_symlinks)
    # — none of which this project uses.
    "mcp[cli]>=2.0.0",
    # llama-index family: floors follow the tightest sibling (design D6).
    # llama-index-llms-ollama 0.9.0 is the first to require core>=0.14.5,
    # so the whole set moves together to stay self-consistent under
    # chromadb 1.x. See ADR-042.
    "llama-index>=0.14.5",
    # Second vector-store backend (ADR-046, add-lancedb-vectordb-backend).
    # lancedb>=0.37 pins the lancedb.expr type-safe filter builder (PR
    # #3150); the adapter's own floor (>=0.21.1) does not guarantee it.
    # Resolved tree pulls lancedb/pylance/pyarrow/tantivy only — no
    # PyTorch, so the ONNX-only boundary holds. pyarrow is declared
    # directly (the store builds upsert rows with it) and floored at
    # the locked major: its frequent major bumps carry no semantic
    # signal, so floor == lock keeps the floors CI honest.
    "llama-index-vector-stores-lancedb>=0.5.0",
    "lancedb>=0.37",
    # Declared directly (ADR-046): lance_meta.py calls pylance's
    # update_schema_metadata for durable table metadata, but the
    # adapter pulls pylance with no version constraint. Floor == lock:
    # update_schema_metadata is the verified 10.x API surface and the
    # floors job installs with --resolution lowest-direct.
    "pylance>=10",
    "pyarrow>=25",
    "llama-index-readers-file>=0.5.0",
    "llama-index-embeddings-ollama>=0.7.0",
    "python-dotenv>=1.0.0",
    # Reranker (cross-encoder via pure ONNX Runtime — no PyTorch)
    "onnxruntime>=1.20.0",
    "tokenizers>=0.20",
    "huggingface-hub>=1.0.0",
    "typer>=0.25.1",
    # File watcher (cross-platform: FSEvents / inotify / ReadDirectoryChangesW)
    "watchdog>=5.0.0",
    # Async HTTP client for Ollama metadata extraction (non-blocking)
    "httpx>=0.27.0",
    # LlamaIndex LLM integration for llamaindex metadata extraction mode
    "llama-index-llms-ollama>=0.9.0",
    "docx2txt>=0.9",
    # PDF parser fallback (Rust + PDFium, Apache-2.0). See ADR-020.
    "liteparse>=2.0.0",
    # PDF parser default (Rust markdown extraction, MIT). See ADR-050.
    "pdf-inspector>=1.17.0",
    # Code graph: AST extraction and community detection.
    # tree-sitter-language-pack 1.12.3 fixes a silent-failure mode where
    # get_parser() returned a vendored parser class that produced unusable
    # trees on Python 3.14 (and broke import below 3.14). ast_extract.py
    # wraps the call in a broad except, so the silent variant degraded
    # every AST extraction to a logged warning. See ADR-042.
    "tree-sitter>=0.23.0",
    "tree-sitter-language-pack>=1.12.3",
    "networkx>=3.2",
    "pydantic-settings>=2.14.1",
    "pyyaml>=6.0.3",
    # Declared directly although transitive (pylance >=10 set the
    # precedent): pypdf is only reached through reader dependencies, but
    # pypdf < 6.16.1 has CVE-2026-84311 (exponential Form XObject
    # traversal during extract_text — a crafted PDF can hang the
    # ingestion worker; security review F7 of
    # add-grounded-answer-synthesis-3). Floor == fixed release.
    "pypdf>=6.16.1",
]

[project.optional-dependencies]
# Quarantined Chroma backend (ADR-049, make-lancedb-default-and-isolate-chromadb).
# chromadb 1.5.x is affected by CVE-2026-45829 with no accepted patched
# release, so both Chroma packages moved out of the base install into this
# opt-in extra. Floors are retained because Chroma compatibility remains
# supported: chromadb>=1.0.0 reverts list_collections() to returning
# Collection objects (0.6.0–0.9.x returned bare strings, breaking
# ChromaVectorStoreAdapter.list_collections — see ADR-042).
# Install: uv sync --extra chroma (source) / pip install "omrg[chroma]".
chroma = [
    "chromadb>=1.0.0",
    "llama-index-vector-stores-chroma>=0.5.0",
]
hybrid = [
    "rank-bm25>=0.2.2",
]
pdf-pypdfium2 = [
    "pypdfium2>=4.0.0",
]
# Compatibility extra for existing `uv sync --extra pdf-inspector` commands.
# pdf-inspector is a base dependency and the configured default (ADR-050).
pdf-inspector = [
    "pdf-inspector>=1.17.0",
]
# Optional Leiden community detection (COMMUNITY_ALGORITHM=leiden).
# Floors pair on the igraph 1.x boundary: leidenalg 0.11+ declares
# igraph<2.0,>=1.0.0, both ship abi3 wheels for macOS (arm64/x86_64),
# manylinux (x86_64/aarch64), and Windows x86_64. Locked footprint
# ~4-9 MB. See ADR-044 (add-pluggable-community-detection).
community-leiden = [
    "leidenalg>=0.11.0",
    "igraph>=1.0.0",
]
azure = [
    "azure-ai-documentintelligence>=1.0.0",
]
llamacpp = [
    "llama-index-embeddings-openai-like>=0.3.0",
    "llama-index-llms-openai-like>=0.5.0",
]
openrouter = [
    "llama-index-embeddings-openai-like>=0.3.0",
    "llama-index-llms-openai-like>=0.5.0",
]
# PyTorch-backed reranker (opt-in). Adds ~200 MB on macOS ARM, more on
# Linux. Default backend stays ONNX; installing this does not change
# defaults.  Pin >=5.0: v3.x uses activation_fct, the activation_fn
# kwarg did not exist until v4.x, and v5.4+ changed activation_fn
# persistence on predict().  See ADR-038.
torch = [
    "sentence-transformers>=5.0",
    # transformers 5.0 cap lifted in the major dependency upgrade cycle
    # (coupled with huggingface-hub 1.0 — all transformers <5 versions
    # require huggingface-hub <1.0).
    "transformers>=5.0.0",
]

[project.scripts]
omrg = "omrg.transports.cli:run_cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omrg"]

[tool.hatch.build.targets.wheel.force-include]
"src/omrg/config/defaults.yaml" = "omrg/config/defaults.yaml"
"src/omrg/config/profiles/documents.yaml" = "omrg/config/profiles/documents.yaml"
"src/omrg/config/profiles/codebase.yaml" = "omrg/config/profiles/codebase.yaml"
"src/omrg/config/profiles/hybrid.yaml" = "omrg/config/profiles/hybrid.yaml"

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Root on sys.path so tests can import experiments._lib.* (add-chroma-cloud-backend).
pythonpath = ["."]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "chroma: requires the optional chroma extra (uv sync --extra chroma); skipped by design in the base install",
]

# ─── Import-linter contracts (Phase 2: config/compose/DI layering) ─────
# Enforces the three-layer architecture from ADR-031:
#   config.py (typed resolver) / compose.py (composition root) / DI elsewhere.
# See openspec/changes/phase-2-refactor-config-core-split/design.md (D5).
[tool.importlinter]
root_package = "omrg"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "settings-models-are-pure-data"
type = "forbidden"
source_modules = [
    "omrg.core.chunking.settings",
    "omrg.core.ingestion.settings",
    "omrg.core.retrieval.settings",
    "omrg.core.metadata.settings",
    # Task 10.2: the EffectiveSettings value object every core/ and
    # integrations/ module now receives must stay pure data too.
    "omrg.core.settings",
]
forbidden_modules = [
    "omrg.config",
    "omrg.compose",
    "omrg.core",
]

[[tool.importlinter.contracts]]
name = "providers-constructed-only-in-compose"
type = "forbidden"
source_modules = ["omrg"]
forbidden_modules = [
    "omrg.core.providers.embeddings.ollama",
    "omrg.core.providers.embeddings.llamacpp",
    "omrg.core.providers.embeddings.openrouter",
    "omrg.core.providers.llm.ollama",
    "omrg.core.providers.llm.llamacpp",
    "omrg.core.providers.llm.openrouter",
]
# Imports within core/providers/ and imports made by the composition root
# are permitted (registries resolve concrete modules lazily via importlib,
# which import-linter cannot see; these expressions cover the static cases).
ignore_imports = [
    "omrg.compose -> omrg.core.providers.**",
    "omrg.core.providers.** -> omrg.core.providers.**",
]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "core-business-avoids-providers-transports"
type = "forbidden"
source_modules = [
    "omrg.core.ingestion",
    "omrg.core.retrieval",
    "omrg.core.metadata",
    "omrg.core.chunking",
    # Extended at task 10.1: these were uncovered, so the boundary they
    # depend on was unenforced even though no violation existed.
    "omrg.core.vectordb",
    "omrg.core.profiles",
    "omrg.core.codebase",
    "omrg.core.documents",
    "omrg.core.community",
    # add-grounded-answer-synthesis-3 task 3.5: answering is core business
    # logic with an injected LLM seam (design D1) — it must never import a
    # provider or transport module directly, with NO ignore entry.
    "omrg.core.answer",
    "omrg.daemon",
]
forbidden_modules = [
    "omrg.core.providers",
    "omrg.transports",
]
ignore_imports = [
    # PERMANENT: daemon is an orchestration layer, like transports — it is a
    # legitimate CONSUMER of the composition root. What this contract forbids
    # is core BUSINESS logic reaching for providers directly; calling
    # compose.build_profile_resolver() is the sanctioned direction.
    "omrg.daemon.watcher -> omrg.compose",
    # metadata.llamaindex resolves the LLM provider registry for the cloud
    # (OpenRouter) branch — the registry centralises construction that was
    # previously inline.  The contract forbids business logic from importing
    # concrete provider modules; the registry is the sanctioned indirection.
    "omrg.core.metadata.llamaindex -> omrg.core.providers.llm.registry",
]
unmatched_ignore_imports_alerting = "error"

# Community partitioning is shared infrastructure. It must not depend on
# either domain consumer, otherwise codebase and document graph packages
# become coupled through the strategy layer (OpenSpec task 5.1).
[[tool.importlinter.contracts]]
name = "community-strategies-independent-of-consumers"
type = "forbidden"
source_modules = ["omrg.core.community"]
forbidden_modules = [
    "omrg.core.codebase",
    "omrg.core.documents",
]
unmatched_ignore_imports_alerting = "error"

# ─── Architecture-v2 conformance contracts ────────────────────────────
# Added by the complete-architecture-v2-conformance change. Each is added
# before its fix so the failing state is observed first (design.md D7).
# See openspec/changes/complete-architecture-v2-conformance/.

# F2: chromadb is confined to the vector store implementation.
[[tool.importlinter.contracts]]
name = "chromadb-confined-to-vectordb"
type = "forbidden"
source_modules = ["omrg"]
forbidden_modules = ["chromadb"]
ignore_imports = [
    "omrg.core.vectordb.chroma -> chromadb",
    "omrg.core.vectordb.chroma_cloud -> chromadb",
]
unmatched_ignore_imports_alerting = "error"

# F2 sibling (add-lancedb-vectordb-backend): lancedb is confined to the
# vector store implementation — the only direct import sites are the
# store itself, the filter translator, and the native-FTS seam
# (implement-native-sparse-backend-strategy, task 2.1).
[[tool.importlinter.contracts]]
name = "lancedb-confined-to-vectordb"
type = "forbidden"
source_modules = ["omrg"]
forbidden_modules = ["lancedb"]
ignore_imports = [
    "omrg.core.vectordb.lancedb -> lancedb",
    "omrg.core.vectordb.lance_literal -> lancedb",
    "omrg.core.vectordb.lance_fts -> lancedb",
]
unmatched_ignore_imports_alerting = "error"

# F3: config is a leaf — it must not import core business logic, compose,
# transports, integrations, or daemon. Only the pure-data subpackage
# settings models (omrg.core.*.settings) are sanctioned upward refs.
[[tool.importlinter.contracts]]
name = "config-is-leaf"
type = "forbidden"
source_modules = ["omrg.config"]
forbidden_modules = [
    "omrg.core.ingestion",
    "omrg.core.retrieval",
    "omrg.core.metadata",
    "omrg.core.vectordb",
    "omrg.core.profiles",
    "omrg.core.providers",
    "omrg.compose",
    "omrg.transports",
    "omrg.integrations",
    "omrg.daemon",
]
ignore_imports = [
    # PERMANENT: sanctioned pure-data settings model imports. Config
    # composes the subpackage settings models by inheritance (pre-group-7)
    # or nesting (post-group-7). These are the only upward refs allowed.
    "omrg.config -> omrg.core.chunking.settings",
    "omrg.config -> omrg.core.retrieval.settings",
    "omrg.config -> omrg.core.metadata.settings",
    "omrg.config -> omrg.core.ingestion.settings",
]
unmatched_ignore_imports_alerting = "error"

# F5: integrations are acyclic leaves — no imports from core, transports,
# daemon, or the top-level graph modules (which relocate in group 2).
[[tool.importlinter.contracts]]
name = "integrations-are-leaves"
type = "forbidden"
source_modules = ["omrg.integrations"]
forbidden_modules = [
    "omrg.core",
    "omrg.transports",
    "omrg.daemon",
]
ignore_imports = [
    # PERMANENT: integrations read the frozen EffectiveSettings value object.
    # This is the same sanctioned category as config -> core.*.settings: a
    # pure-data model with no business logic and no imports of its own. It is
    # NOT a dependency on core business logic, which stays forbidden.
    "omrg.integrations.magika -> omrg.core.settings",
    "omrg.integrations.azure -> omrg.core.settings",
    "omrg.integrations.pdf.liteparse -> omrg.core.settings",
    # TEMPORARY: integrations import config, which transitively reaches
    # core through the sanctioned settings models. These import edges
    # are removed at task 5.6 when integrations receive EffectiveSettings
    # by injection and stop importing config.
    #
    # COVERAGE LOSS — read before adding to this list. Each entry suppresses
    # the *root* edge of a transitive chain, so this contract goes blind to
    # EVERY chain through config from that module, not just the known one.
    # A new `integrations.magika -> config -> core.retrieval.dense` would go
    # undetected today. Do not add modules here to silence a new violation;
    # the four below are a time-boxed migration artefact removed at 5.6, and
    # task 10.3a fails the build if any outlives its fix.
]
unmatched_ignore_imports_alerting = "error"

[tool.coverage.run]
source = ["omrg"]
# The deprecated-shim omit list was removed in v2.0.0 together with the
# shims themselves (task 9.5). Every module under src/omrg is now real
# code with real consumers, so nothing is excluded from the gate.

# ─── Ruff (lint + format) ────────────────────────────────────────────
# Replaces flake8, black, isort, and bandit in one tool. The rule sets:
#   E  pycodestyle errors (PEP 8 style)
#   F  Pyflakes (unused imports, undefined names, redefinitions)
#   I  isort (import ordering)
#   UP pyupgrade (modernise syntax for the target Python version)
#   B  flake8-bugbear (common pitfall patterns)
#   S  flake8-bandit (security: hardcoded secrets, injection, weak crypto)
# Gitleaks runs separately as a pre-commit hook for literal secret scanning.
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = [
    "graphify-out",
    "chroma_db",
    "chroma_db_test",
    "models",
    "experiments",
    ".opencode",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

# S101 (assert) is expected in test code.
# S108 (/tmp paths) and B017 (broad pytest.raises) are standard test patterns.
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S108", "B017", "S603", "S607"]
# Experiment scripts are not production code: they call system tools
# (sysctl), spawn child processes, and use bare DataFrame display.
# E501/S311: the calibration harnesses carry long historical lines and
# seeded pseudo-random sampling; B007/B905: pre-existing build loops.
"experiments/*/test_*.py" = ["S101", "S108", "B017", "S603", "S607"]
"experiments/*/run_eval.py" = ["S110", "S603", "S607", "E501", "S311"]
"experiments/*/run_qualification.py" = ["S110", "S310", "S603", "S607"]
"experiments/*/verify_reopen.py" = ["S603", "S607"]
"experiments/*/analysis.py" = ["B018"]
"experiments/*/summarise_eval.py" = ["E501"]
"experiments/*/build_indexes.py" = ["E501", "S311", "B007", "B905"]
"experiments/*/build_corpus.py" = ["E501", "S311"]

[dependency-groups]
dev = [
    "import-linter>=2.13",
    "ipywidgets>=8.1.8",
    "jupytext>=1.19.4",
    # matplotlib powers experiment analysis.py plots only — it is not a
    # production dependency and must not ship with the package.
    "matplotlib>=3.11.1",
    "openapi-spec-validator>=0.7.1",
    "pre-commit>=4.0.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    # ruff floor raised so pre-commit (which runs ``uv run ruff``) formats
    # identically on the floors and on the locked version. See ADR-042.
    "ruff>=0.16.0",
]

# ─── Semantic Release ────────────────────────────────────────────────
[tool.semantic_release]
commit_parser = "conventional"
version_toml = ["pyproject.toml:project.version"]
allow_zero_version = true
build_command = "uv build"
tag_format = "v{version}"

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.changelog]
exclude_commit_patterns = [
    '''chore(?:\([^)]*?\))?: .+''',
    '''ci(?:\([^)]*?\))?: .+''',
    '''refactor(?:\([^)]*?\))?: .+''',
    '''style(?:\([^)]*?\))?: .+''',
    '''test(?:\([^)]*?\))?: .+''',
    '''build\((?!deps\): .+)''',
    '''docs(?:\([^)]*?\))?: .+''',
]

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"
output_format = "md"

[tool.semantic_release.commit_parser_options]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]
parse_squash_commits = true
ignore_merge_commits = true

[tool.semantic_release.remote]
type = "github"
token = { env = "GH_TOKEN" }

[tool.pyright]
include = ["src", "tests", "experiments"]
exclude = ["**/.venv", "**/__pycache__", "**/.opencode"]
venvPath = "."
venv = ".venv"
