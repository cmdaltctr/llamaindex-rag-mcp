[project]
name = "rag-mcp"
version = "2.2.0"
description = "LlamaIndex RAG MCP server for document retrieval"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0",
    "llama-index>=0.11.0",
    "llama-index-vector-stores-chroma>=0.2.0",
    "llama-index-readers-file>=0.2.0",
    "chromadb>=0.5.0",
    "llama-index-embeddings-ollama>=0.2.0",
    "python-dotenv>=1.0.0",
    # Reranker (cross-encoder via pure ONNX Runtime — no PyTorch)
    "onnxruntime>=1.17.0,<1.26.0",
    "transformers>=4.40.0",
    "huggingface-hub>=0.20.0",
    "typer>=0.25.1",
    # File watcher (cross-platform: FSEvents / inotify / ReadDirectoryChangesW)
    "watchdog>=4.0.0",
    # Async HTTP client for Ollama metadata extraction (non-blocking)
    "httpx>=0.27.0",
    # LlamaIndex LLM integration for llamaindex metadata extraction mode
    "llama-index-llms-ollama>=0.4.0",
    "docx2txt>=0.9",
    # PDF parser (Rust + PDFium, Apache-2.0). Default reader when installed.
    # See ADR-020. Prebuilt wheels for macOS, Linux, Windows.
    "liteparse>=2.0.0",
    # Code graph: AST extraction and community detection
    "tree-sitter>=0.21.0",
    "tree-sitter-language-pack>=0.1.0",
    "networkx>=3.0",
    "pydantic-settings>=2.14.1",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
hybrid = [
    "rank-bm25>=0.2.2",
]
pdf-pypdfium2 = [
    "pypdfium2>=4.0.0",
]
azure = [
    "azure-ai-documentintelligence>=1.0.0",
]
llamacpp = [
    "llama-index-embeddings-openai>=0.2.0",
    "llama-index-llms-openai-like>=0.2.0",
]
openrouter = [
    "llama-index-embeddings-openai>=0.2.0",
    "llama-index-llms-openai-like>=0.2.0",
]

[project.scripts]
rag-mcp = "rag_mcp.transports.cli:run_cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"src/rag_mcp/config/defaults.yaml" = "rag_mcp/config/defaults.yaml"
"src/rag_mcp/config/profiles/documents.yaml" = "rag_mcp/config/profiles/documents.yaml"
"src/rag_mcp/config/profiles/codebase.yaml" = "rag_mcp/config/profiles/codebase.yaml"
"src/rag_mcp/config/profiles/hybrid.yaml" = "rag_mcp/config/profiles/hybrid.yaml"

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

# ─── Import-linter contracts (Phase 2: config/compose/DI layering) ─────
# Enforces the three-layer architecture from ADR-031:
#   config.py (typed resolver) / compose.py (composition root) / DI elsewhere.
# See openspec/changes/phase-2-refactor-config-core-split/design.md (D5).
[tool.importlinter]
root_package = "rag_mcp"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "settings-models-are-pure-data"
type = "forbidden"
source_modules = [
    "rag_mcp.core.chunking.settings",
    "rag_mcp.core.ingestion.settings",
    "rag_mcp.core.retrieval.settings",
    "rag_mcp.core.metadata.settings",
    # Task 10.2: the EffectiveSettings value object every core/ and
    # integrations/ module now receives must stay pure data too.
    "rag_mcp.core.settings",
]
forbidden_modules = [
    "rag_mcp.config",
    "rag_mcp.compose",
    "rag_mcp.core",
]

[[tool.importlinter.contracts]]
name = "providers-constructed-only-in-compose"
type = "forbidden"
source_modules = ["rag_mcp"]
forbidden_modules = [
    "rag_mcp.core.providers.embeddings.ollama",
    "rag_mcp.core.providers.embeddings.llamacpp",
    "rag_mcp.core.providers.embeddings.openrouter",
    "rag_mcp.core.providers.llm.ollama",
    "rag_mcp.core.providers.llm.llamacpp",
    "rag_mcp.core.providers.llm.openrouter",
]
# Imports within core/providers/ and imports made by the composition root
# are permitted (registries resolve concrete modules lazily via importlib,
# which import-linter cannot see; these expressions cover the static cases).
ignore_imports = [
    "rag_mcp.compose -> rag_mcp.core.providers.**",
    "rag_mcp.core.providers.** -> rag_mcp.core.providers.**",
]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "core-business-avoids-providers-transports"
type = "forbidden"
source_modules = [
    "rag_mcp.core.ingestion",
    "rag_mcp.core.retrieval",
    "rag_mcp.core.metadata",
    "rag_mcp.core.chunking",
    # Extended at task 10.1: these were uncovered, so the boundary they
    # depend on was unenforced even though no violation existed.
    "rag_mcp.core.vectordb",
    "rag_mcp.core.profiles",
    "rag_mcp.core.codebase",
    "rag_mcp.core.documents",
    "rag_mcp.daemon",
]
forbidden_modules = [
    "rag_mcp.core.providers",
    "rag_mcp.transports",
]
ignore_imports = [
    # PERMANENT: daemon is an orchestration layer, like transports — it is a
    # legitimate CONSUMER of the composition root. What this contract forbids
    # is core BUSINESS logic reaching for providers directly; calling
    # compose.build_profile_resolver() is the sanctioned direction.
    "rag_mcp.daemon.watcher -> rag_mcp.compose",
    # metadata.llamaindex resolves the LLM provider registry for the cloud
    # (OpenRouter) branch — the registry centralises construction that was
    # previously inline.  The contract forbids business logic from importing
    # concrete provider modules; the registry is the sanctioned indirection.
    "rag_mcp.core.metadata.llamaindex -> rag_mcp.core.providers.llm.registry",
]
unmatched_ignore_imports_alerting = "error"

# ─── Architecture-v2 conformance contracts ────────────────────────────
# Added by the complete-architecture-v2-conformance change. Each is added
# before its fix so the failing state is observed first (design.md D7).
# See openspec/changes/complete-architecture-v2-conformance/.

# F2: chromadb is confined to the vector store implementation.
[[tool.importlinter.contracts]]
name = "chromadb-confined-to-vectordb"
type = "forbidden"
source_modules = ["rag_mcp"]
forbidden_modules = ["chromadb"]
ignore_imports = [
    "rag_mcp.core.vectordb.chroma -> chromadb",
]
unmatched_ignore_imports_alerting = "error"

# F3: config is a leaf — it must not import core business logic, compose,
# transports, integrations, or daemon. Only the pure-data subpackage
# settings models (rag_mcp.core.*.settings) are sanctioned upward refs.
[[tool.importlinter.contracts]]
name = "config-is-leaf"
type = "forbidden"
source_modules = ["rag_mcp.config"]
forbidden_modules = [
    "rag_mcp.core.ingestion",
    "rag_mcp.core.retrieval",
    "rag_mcp.core.metadata",
    "rag_mcp.core.vectordb",
    "rag_mcp.core.profiles",
    "rag_mcp.core.providers",
    "rag_mcp.compose",
    "rag_mcp.transports",
    "rag_mcp.integrations",
    "rag_mcp.daemon",
]
ignore_imports = [
    # PERMANENT: sanctioned pure-data settings model imports. Config
    # composes the subpackage settings models by inheritance (pre-group-7)
    # or nesting (post-group-7). These are the only upward refs allowed.
    "rag_mcp.config -> rag_mcp.core.chunking.settings",
    "rag_mcp.config -> rag_mcp.core.retrieval.settings",
    "rag_mcp.config -> rag_mcp.core.metadata.settings",
    "rag_mcp.config -> rag_mcp.core.ingestion.settings",
]
unmatched_ignore_imports_alerting = "error"

# F5: integrations are acyclic leaves — no imports from core, transports,
# daemon, or the top-level graph modules (which relocate in group 2).
[[tool.importlinter.contracts]]
name = "integrations-are-leaves"
type = "forbidden"
source_modules = ["rag_mcp.integrations"]
forbidden_modules = [
    "rag_mcp.core",
    "rag_mcp.transports",
    "rag_mcp.daemon",
]
ignore_imports = [
    # PERMANENT: integrations read the frozen EffectiveSettings value object.
    # This is the same sanctioned category as config -> core.*.settings: a
    # pure-data model with no business logic and no imports of its own. It is
    # NOT a dependency on core business logic, which stays forbidden.
    "rag_mcp.integrations.magika -> rag_mcp.core.settings",
    "rag_mcp.integrations.azure -> rag_mcp.core.settings",
    "rag_mcp.integrations.pdf.liteparse -> rag_mcp.core.settings",
    "rag_mcp.integrations.pdf.factory -> rag_mcp.core.settings",
    # TEMPORARY: integrations import config, which transitively reaches
    # core through the sanctioned settings models. These import edges
    # are removed at task 5.6 when integrations receive EffectiveSettings
    # by injection and stop importing config.
    #
    # COVERAGE LOSS — read before adding to this list. Each entry suppresses
    # the *root* edge of a transitive chain, so this contract goes blind to
    # EVERY chain through config from that module, not just the known one.
    # A new `integrations.magika -> config -> core.retrieval.dense` would go
    # undetected today. Do not add modules here to silence a new violation;
    # the four below are a time-boxed migration artefact removed at 5.6, and
    # task 10.3a fails the build if any outlives its fix.
]
unmatched_ignore_imports_alerting = "error"

[tool.coverage.run]
source = ["rag_mcp"]
# The deprecated-shim omit list was removed in v2.0.0 together with the
# shims themselves (task 9.5). Every module under src/rag_mcp is now real
# code with real consumers, so nothing is excluded from the gate.

# ─── Ruff (lint + format) ────────────────────────────────────────────
# Replaces flake8, black, isort, and bandit in one tool. The rule sets:
#   E  pycodestyle errors (PEP 8 style)
#   F  Pyflakes (unused imports, undefined names, redefinitions)
#   I  isort (import ordering)
#   UP pyupgrade (modernise syntax for the target Python version)
#   B  flake8-bugbear (common pitfall patterns)
#   S  flake8-bandit (security: hardcoded secrets, injection, weak crypto)
# Gitleaks runs separately as a pre-commit hook for literal secret scanning.
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = [
    "graphify-out",
    "chroma_db",
    "chroma_db_test",
    "models",
    "experiments",
    ".opencode",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

# S101 (assert) is expected in test code.
# S108 (/tmp paths) and B017 (broad pytest.raises) are standard test patterns.
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S108", "B017", "S603", "S607"]

[dependency-groups]
dev = [
    "huggingface-hub>=0.36.2",
    "import-linter>=2.13",
    "ipywidgets>=8.1.8",
    "jupytext>=1.19.4",
    "openapi-spec-validator>=0.7.1",
    "pre-commit>=4.0.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.12.0",
]

# ─── Semantic Release ────────────────────────────────────────────────
[tool.semantic_release]
commit_parser = "conventional"
version_toml = ["pyproject.toml:project.version"]
allow_zero_version = true
build_command = "uv build"
tag_format = "v{version}"

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.changelog]
exclude_commit_patterns = [
    '''chore(?:\([^)]*?\))?: .+''',
    '''ci(?:\([^)]*?\))?: .+''',
    '''refactor(?:\([^)]*?\))?: .+''',
    '''style(?:\([^)]*?\))?: .+''',
    '''test(?:\([^)]*?\))?: .+''',
    '''build\((?!deps\): .+)''',
    '''docs(?:\([^)]*?\))?: .+''',
]

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"
output_format = "md"

[tool.semantic_release.commit_parser_options]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]
parse_squash_commits = true
ignore_merge_commits = true

[tool.semantic_release.remote]
type = "github"
token = { env = "GH_TOKEN" }

[tool.pyright]
include = ["src", "tests", "experiments"]
exclude = ["**/.venv", "**/__pycache__", "**/.opencode"]
