# yaml-language-server: $schema=https://storage.googleapis.com/coderabbit_public_assets/schema.v2.json
#
# CodeRabbit repository configuration.
# Reference: https://docs.coderabbit.ai/reference/configuration
# Committing this file (rather than relying only on the web UI) gives the
# settings version control, PR-time transparency, and precedence over
# org/repo web UI settings.

language: en-GB
tone_instructions: >
  State what's wrong in plain English, then give clear and numbered actions
  to fix it. Describe problems and list multiple valid fixes as numbered
  choices, not one buried pick. Write in ASD-STE100 Simplified Technical
  English. No emoji.
early_access: true
enable_free_tier: true

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  collapse_walkthrough: false
  changed_files_summary: true
  sequence_diagrams: true
  estimate_code_review_effort: true
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  suggested_labels: true
  auto_apply_labels: false
  suggested_reviewers: false
  auto_assign_reviewers: false
  poem: false
  abort_on_close: true
  disable_cache: false

  # Sparse-checkout filters: keep CodeRabbit's context to source of truth,
  # skip generated/derived artefacts (matches .gitignore's own boundary).
  path_filters:
    - "!**/*.lock"
    - "!uv.lock"
    - "!**/__pycache__/**"
    - "!**/*.egg-info/**"
    - "!dist/**"
    - "!build/**"
    - "!htmlcov/**"
    - "!graphify-out/**"
    - "!.ua/**"
    - "!experiments/**/chroma_*/**"
    - "!experiments/**/corpus/**"
    - "!experiments/**/raw/**"
    - "!experiments/**/data/**"
    - "!experiments/**/*.ipynb"
    - "!niftypm/**"
    - "!openspec/changes/archive/**"

  # Path-scoped instructions encode this repo's architecture invariants
  # (see AGENTS.md) so CodeRabbit enforces them the same way a human
  # reviewer familiar with the codebase would.
  path_instructions:
    - path: "src/rag_mcp/config/**"
      instructions: |
        This package is a LEAF. It must not import core/ business logic —
        only the pure-data core/*/settings.py models. Flag any import of
        core/ingestion, core/retrieval, or a concrete provider/strategy
        module. There is no config.settings singleton and no RESOLVED_*
        module-level constant; importing config must not resolve anything.

    - path: "src/rag_mcp/core/ingestion/**"
      instructions: |
        Must not import from core/retrieval/ — the two share only settings,
        injected as EffectiveSettings. Flag any cross-import. Ingestion
        entry points must go through ingest_path_async (async-only, no sync
        entry point).

    - path: "src/rag_mcp/core/retrieval/**"
      instructions: |
        Must not import from core/ingestion/. Settings are injected, never
        read from a global/singleton. If touching reranker.py, verify any
        process-wide state mutation (the failure-escalation counter, the
        model cache) is reset only on a genuine success path, not on every
        cache hit or fresh-instance construction — search() builds a fresh
        reranker per call, so instance-level resets defeat cross-call
        escalation logic silently.

    - path: "src/rag_mcp/core/codebase/**"
      instructions: |
        Deterministic only — no LLM calls in code graph construction or
        community detection. Must not cross-import core/ingestion/ or
        core/retrieval/. Magika detection lives in integrations/magika.py
        and must not be imported back into this package.

    - path: "src/rag_mcp/core/documents/**"
      instructions: |
        Deterministic only — no LLM calls in doc graph or similarity
        scoring. Must not cross-import core/ingestion/ or core/retrieval/.

    - path: "src/rag_mcp/transports/**"
      instructions: |
        Thin wrappers only — delegate to core/, never contain business
        logic. Every MCP tool handler in transports/mcp.py must wrap its
        body in try/except and return {"status": "error", "message": "..."}
        — flag any handler that can raise instead of returning an error
        dict. Every MCP tool must declare ToolAnnotations (readOnlyHint,
        destructiveHint). CLI output must go to stderr (Console(stderr=True))
        since stdout is the MCP protocol channel.

    - path: "src/rag_mcp/integrations/azure.py"
      instructions: |
        azure-ai-documentintelligence must not be imported at module
        top-level (ADR-024) — the import must happen lazily inside
        _get_client() so the SDK is not a hard runtime dependency.

    - path: "src/rag_mcp/**/*.py"
      instructions: |
        New modules need type annotations and `from __future__ import
        annotations`, plus Google-style docstrings on public functions and
        classes. No file should exceed 500 lines (tests/test_file_size_ceiling.py
        enforces this) — for a large new/modified file, suggest splitting by
        responsibility rather than approving as-is. Never use PyTorch at
        runtime (ONNX Runtime only). No hardcoded paths, secrets, or API
        keys — everything through .env / injected settings.

    - path: "tests/**"
      instructions: |
        Tests inject settings via the effective_settings(**overrides)
        conftest factory or set_default_effective_settings(...) — there is
        no singleton to patch, so a test that tries to patch one is
        testing nothing. Reranker tests must call reset_model_cache() in
        setup/teardown to avoid leaking cached model/failure state across
        cases. For a bug-fix PR, confirm the new test actually fails
        against the pre-fix code (not just that it passes now) — a test
        that passes regardless of the implementation is worse than no test.

    - path: "openspec/changes/**/specs/**/spec.md"
      instructions: |
        Check internal consistency: scenario text (WHEN/THEN) must match
        prose claims made elsewhere in the same change (proposal.md,
        design.md) and must not contradict a sibling scenario in the same
        file. Flag stale defaults/values that don't match the current
        code. Scenario headings may legitimately preserve old wording for
        OpenSpec delta continuity against the base spec — do not flag a
        heading/prose mismatch if the prose explicitly explains the
        continuity choice.

    - path: "docs/adr/**"
      instructions: |
        ADRs are an append-only historical record. A change to an existing
        ADR should be an addendum/follow-up note, not a rewrite of the
        original decision text or context.

    - path: "docs/tdr/**"
      instructions: |
        TDRs document platform-specific workarounds and debugging findings,
        distinct from ADRs (architectural choices). Verify the reported
        root cause and fix are still consistent with the current code
        rather than describing a since-changed workaround.

  auto_review:
    enabled: true
    auto_incremental_review: true
    ignore_title_keywords: []
    labels: []
    drafts: false
    base_branches:
      - "main"
      - "v3"

  finishing_touches:
    docstrings:
      enabled: true
    unit_tests:
      enabled: false

  tools:
    ruff:
      enabled: true
    pylint:
      enabled: false
    flake8:
      enabled: false
    markdownlint:
      enabled: true
    yamllint:
      enabled: true
    gitleaks:
      enabled: true
    actionlint:
      enabled: true
    opengrep:
      enabled: true
    semgrep:
      enabled: false
    shellcheck:
      enabled: true
    github-checks:
      enabled: true
      timeout_ms: 90000

chat:
  auto_reply: true

knowledge_base:
  opt_out: false
  web_search:
    enabled: true
  code_guidelines:
    enabled: true
    filePatterns:
      - "AGENTS.md"
      - "CLAUDE.md"
      - "docs/guides/**/*.md"
  learnings:
    scope: auto
  issues:
    scope: auto
  pull_requests:
    scope: auto

code_generation:
  docstrings:
    language: en-GB
    path_instructions:
      - path: "src/rag_mcp/**/*.py"
        instructions: |
          Google-style docstrings. British English spelling in prose.
          Document the WHY for non-obvious behaviour, not a restatement of
          the signature.
