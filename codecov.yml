# Codecov configuration: coverage gating for pull requests.
# Coverage tiers mirror AGENTS.md:
#   core + MCP >= 95%, orchestration >= 85%, overall >= 90%.
# Project checks are informational (not CI-blocking) while targets are
# recalibrated for branch coverage — see TDR-007 amendment.

coverage:
  status:
    project:
      core:
        target: 95%
        informational: true
        paths:
          - "src/omrs/core/ingestion/"
          - "src/omrs/core/retrieval/"
          - "src/omrs/core/metadata/"
          - "src/omrs/core/chunking/"
          - "src/omrs/core/vectordb/"
          - "src/omrs/core/profiles/"
          - "src/omrs/core/settings.py"
          - "src/omrs/config/"
          - "src/omrs/transports/mcp.py"
      orchestration:
        target: 85%
        informational: true
        paths:
          - "src/omrs/daemon/"
          - "src/omrs/transports/cli/"
      default:
        target: 90%
        informational: true

    patch:
      default:
        target: 90%

ignore:
  - "tests/**"
  - "experiments/**"
  - "**/__init__.py"
  - "**/__pycache__/**"
  - ".venv/**"
  - "chroma_db/**"

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false
